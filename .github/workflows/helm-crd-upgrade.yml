name: helm-crd-upgrade

# ISI-3518 / ADR-0002 (Option B): prove upgrade-safe CRD delivery. On a
# throwaway kind cluster this installs the standalone k8squad-crds chart at an
# OLD (field-stripped) revision, `helm upgrade`s ONLY the CRD chart to HEAD
# (control-plane chart untouched), and asserts the new field propagates into the
# served CRD schema, that user CRs survive upgrade + uninstall, and that the
# CRDs-first install ordering holds (ADR §7 AC-4/5/6).
#
# All logic lives in hack/test-crd-upgrade.sh so it is runnable locally against
# any kube-context; this workflow only provisions kind and invokes it.
# Self-hosted (needs docker/kind) and fork-safe (no secrets / registry access).

on:
  pull_request:
    paths:
      - 'config/helm/**'
      - 'config/helm-crds/**'
      - 'config/crd/bases/**'
      - 'hack/test-crd-upgrade.sh'
      - 'hack/wrap-crd-template.sh'
      - '.github/workflows/helm-crd-upgrade.yml'
  schedule:
    - cron: '30 5 * * *'   # nightly, offset from getting-started-smoke (05:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-crd-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crd-upgrade:
    name: helm upgrade propagates CRD schema (fresh kind cluster)
    runs-on: [self-hosted, linux, x64]   # needs docker/kind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create fresh kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          wait: 120s

      - name: helm upgrade CRD propagation test
        run: ./hack/test-crd-upgrade.sh
