{{- if .Values.controlPlane.enabled }}
{{- $ns := include "k8squad.namespace" . }}
# Operator manager ClusterRole. Mirrors config/rbac/role.yaml (kubebuilder
# marker output); keep the two in lockstep — CI RBAC gen writes role.yaml, this
# is the Helm-installed copy applied to the release.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8squad.fullname" . }}-operator
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "operator") | nindent 4 }}
rules:
- apiGroups: [""]
  # configmaps rule (ISI-3614 / mcpserver): per-sandbox config payloads.
  # ISI-4165: otelegress is removed, so configmaps lost the patch verb and
  # split back out of the namespaces/persistentvolumeclaims group below.
  resources: [configmaps]
  verbs: [create, delete, get, list, update, watch]
- apiGroups: [""]
  # secrets create: ISI-3614 / ADR-0007 — the warm-pool Bind path writes a
  # per-sandbox task-io Secret (pod-owned, auto-GC) to deliver the run-scoped
  # credential.
  resources: [limitranges, resourcequotas, secrets, serviceaccounts]
  verbs: [create, get, list, patch, update, watch]
- apiGroups: [""]
  # namespaces (team reconciler) + persistentvolumeclaims (ISI-4127, the
  # project-pvc reconciler: create/delete from the workspace manager,
  # update/patch for in-place size expansion — the only mutable PVC field)
  # share one verb set, and controller-gen groups resources with identical
  # verbs into one rule; the lockstep test compares grouping, so the chart
  # mirrors it.
  resources: [namespaces, persistentvolumeclaims]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [""]
  # ISI-3614 / ADR-0007: the warm-pool Bind path reads the booted sandbox pod
  # (by its unique label) to place the pod-owned task-io Secret in the pod's
  # namespace with an OwnerReference for auto-GC. ISI-4132: create/delete join
  # the set — the warm pool Boots/TearDowns sandbox pods imperatively
  # (pkg/warmpool/kube.go), and a fresh install without them wedges every
  # dispatch at sandbox bring-up.
  resources: [pods]
  verbs: [create, delete, get, list, watch]
- apiGroups: [""]
  # ISI-4315: KubeCapacitySnapshot lists nodes on every controller tick
  # (allocatable minus live pod requests) to size the warm-pool capacity
  # ceiling, so idle warmth yields to project Runs instead of saturating
  # the workers.
  resources: [nodes]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, delete, get, list, watch]
- apiGroups: [ksquad.io]
  resources: [agentruntimes, agents, egresspolicies, mcpservers, otelconfigs, roles, skills]
  verbs: [get, list, watch]
- apiGroups: [ksquad.io]
  # runs split out of the read-only pack (ISI-4132): the M1.3 intake sweep
  # CREATES Run CRs for due board tickets (pkg/controller/rundrive/intake.go).
  # Without create, dispatch 403s forever on a fresh install.
  resources: [runs]
  verbs: [create, get, list, watch]
- apiGroups: [ksquad.io]
  resources: [mcpservers/status, otelconfigs/status, projects/status, runs/status, teams/status]
  verbs: [get, patch, update]
- apiGroups: [ksquad.io]
  resources: [projects]
  verbs: [get, list, patch, watch]
- apiGroups: [ksquad.io]
  resources: [teams]
  verbs: [get, list, patch, update, watch]
- apiGroups: [ksquad.io]
  resources: [teams/finalizers]
  verbs: [patch, update]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [create, get, list, patch, update, watch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterrolebindings, clusterroles, rolebindings, roles]
  verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8squad.fullname" . }}-operator
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8squad.fullname" . }}-operator
subjects:
- kind: ServiceAccount
  name: ksquad-operator
  namespace: {{ $ns }}
---
# Leader-election: the manager coordinates on a Lease/ConfigMap in its own
# namespace (leaderElectionID ksquad-operator.ksquad.io).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8squad.fullname" . }}-operator-leader-election
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "operator") | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8squad.fullname" . }}-operator-leader-election
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8squad.fullname" . }}-operator-leader-election
subjects:
- kind: ServiceAccount
  name: ksquad-operator
  namespace: {{ $ns }}
---
# scm-webhook (cmd/scm-webhook) reads Project CRs + their HMAC webhook Secrets
# across namespaces and patches the ingress-trigger annotation. Least-privilege:
# no write on secrets, no reconcile of other CRs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8squad.fullname" . }}-scm-webhook
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "scm-webhook") | nindent 4 }}
rules:
- apiGroups: [ksquad.io]
  resources: [projects]
  verbs: [get, list, watch, patch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8squad.fullname" . }}-scm-webhook
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "scm-webhook") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8squad.fullname" . }}-scm-webhook
subjects:
- kind: ServiceAccount
  name: ksquad-scm-webhook
  namespace: {{ $ns }}
---
# apiserver compose write surface (ISI-3546 / ISI-3198). The 8.5 compose
# endpoints (POST/PUT /api/{teams,projects,agents,roles,skills}) apply
# user-authored CRs through the apiserver's OWN controller-runtime client, which
# runs as the ksquad-apiserver ServiceAccount. In-app authz (contributor tier +
# team-namespace scoping, ADR-039) is the real user boundary; the SA is the
# trusted write proxy, so it needs cluster-wide access to the compose kinds
# (Team namespaces are provisioned dynamically). Without this the client
# authenticates but every apply 403s at the kube API — the route logs "write
# surface ready" yet writes fail, the true blocker behind ISI-3544 ("can't add
# an agent"). Least-privilege, mirrored to the DIRECT (uncached) client the
# compose path actually uses (internal/apiserver/cache.go NewCRDApplier →
# client.New): get+create+update on every compose kind (upsert = Get-then-
# Create-or-Update, composecrd.go:305/321/334); list ONLY on teams, to resolve
# the target Team namespace (CRDApplier.List over TeamList, composecrd.go:278).
# No watch (direct client, no informers), no patch (never called), no delete
# (compose never deletes); status is owned by the operator, not this write path.
# Kept in lockstep by TestApiserverClusterRoleLeastPrivilege in rbac_lockstep_test.go.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8squad.fullname" . }}-apiserver
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "apiserver") | nindent 4 }}
rules:
- apiGroups: [ksquad.io]
  resources: [teams]
  verbs: [get, list, create, update]
- apiGroups: [ksquad.io]
  resources: [agents]
  verbs: [get, list, create, update]
- apiGroups: [ksquad.io]
  resources: [projects]
  verbs: [get, list, create, update]
# skills carries `list` (ISI-3963): besides the compose write path (get+create+
# update), the fleet-aware skill list read model (internal/apiserver/fleetlist.go
# Skills()) Lists Skills through the shared informer cache. As with roles/runs,
# without `list` the LIST 403s at the cluster scope, the informer never syncs,
# and GET /api/squad/skills fails.
- apiGroups: [ksquad.io]
  resources: [skills]
  verbs: [get, list, create, update]
# roles carries `list` (ISI-3932): besides the compose write path (get+create+
# update), the Agents org read model (internal/apiserver/org.go load()) Lists
# Roles through the shared informer cache to paint each Agent's Role badge —
# without `list` that informer never syncs and agent detail 502s. The fleet role
# list read model (fleetlist.go Roles(), ISI-3963) also relies on this `list`.
- apiGroups: [ksquad.io]
  resources: [roles]
  verbs: [get, list, create, update]
# agentruntimes + runs are READ-ONLY, informer-cache-backed (ISI-3932): the
# Agents org read model (org.go load()/AgentRuns/AgentStatuses) and the squad
# overview read model (overview.go), both wired over NewCacheReader, List these
# cluster-wide. The admin fleet-wide projections (ADR-039 / ISI-3932) List Runs
# across ALL namespaces; even the team-scoped reads go through the SAME
# cluster-scoped informer, so a namespaced List still triggers a cluster-wide
# Run/AgentRuntime informer. As with otelconfigs below (ISI-3916), `list` is what
# unblocks the cache — without it the LIST 403s at the cluster scope, the
# informer never syncs, and GET /api/squad/overview + /api/agents/* fail. No
# create/update/patch/delete: the operator owns these CRs, the apiserver reads.
- apiGroups: [ksquad.io]
  resources: [agentruntimes, runs]
  verbs: [get, list]
# egresspolicies is READ-ONLY (ISI-3891): the E3-S2 credential-test BYO
# probe guard (pkg/probeegress) lists EgressPolicies in the caller's squad
# namespace and follows Project egressPolicyRefs to decide whether the
# apiserver may dial a caller-chosen endpoint. No watch/patch/delete: the
# probe never writes egress declarations.
- apiGroups: [ksquad.io]
  resources: [egresspolicies]
  verbs: [get, list]
# otelconfigs is READ+WRITE (ISI-3916 read half, ISI-3954 write half): the Story A
# OTelConfig read model (internal/apiserver/otelconfig.go ClientOTelConfigSource,
# wired in cmd/apiserver/main.go over NewCacheReader) Lists the cluster-scoped
# OTelConfig the Settings › OTel export-state card reads via the shared informer
# cache — a controller-runtime informer marks HasSynced after its initial LIST, so
# `list` is what unblocks the cache; without it the LIST 403s, the informer never
# syncs, GET /api/otelconfig hangs ~15s then 504s. The ISI-3954 write half
# (OTelConfigWriteService, PUT/POST /api/otelconfig) upserts the single CR named
# "default" via the SAME direct client the compose path uses — name-only
# Get-then-Create-or-Update — so it adds `create`+`update` (no list needed for the
# write itself; the read supplies it). No patch/delete: the write surface never
# patches or deletes. status stays operator-owned (the /status subresource grant
# above is the operator's, not this SA's).
- apiGroups: [ksquad.io]
  resources: [otelconfigs]
  verbs: [get, list, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8squad.fullname" . }}-apiserver
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "apiserver") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8squad.fullname" . }}-apiserver
subjects:
- kind: ServiceAccount
  name: ksquad-apiserver
  namespace: {{ $ns }}
{{- end }}
