---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agents.ksquad.io
spec:
  group: ksquad.io
  names:
    categories:
    - ksquad
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is the Schema for the agents API — one agent instance in a squad
          (arch §5.1). It is namespaced by default.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSpec defines the desired state of Agent (arch §5.1, story 1.2 AC3).

              An Agent is one agent instance in a squad. The arch §5.1 table does not
              list a status subresource for Agent; the Agent reconciler (story 1.3)
              validates the credential Secret + runtime and publishes the Agent Card
              (§10.1).
            properties:
              capabilityOverrides:
                description: |-
                  CapabilityOverrides are applied to the generated Agent Card
                  capabilities (arch §10.1) — the ticket's agentCardOverrides.
                properties:
                  allow:
                    description: |-
                      Allow turns capabilities on in addition to the resolved runtime's
                      advertised set.
                    items:
                      type: string
                    type: array
                  deny:
                    description: |-
                      Deny turns capabilities off; Deny wins over Allow (enforced by the
                      Agent reconciler, story 1.3).
                    items:
                      type: string
                    type: array
                type: object
              contextBudgetOverride:
                description: |-
                  ContextBudgetOverride optionally overrides the Project-level context
                  budget (arch §8.5) for this agent — e.g. a ~200K allocation for a
                  Claude-backed agent while a BYO-Ollama agent takes ~8K on the same
                  project. Resolution order: Project default → Agent override → Run
                  dynamic trim, clamped by the resolved model contextWindow; a value
                  above the window is a fail-closed validation error (reconciler,
                  story 1.3).
                properties:
                  artifacts:
                    description: Artifacts tier allocation (build outputs, PR refs
                      from the §5.4 mirror).
                    format: int64
                    type: integer
                  memoryRecall:
                    description: |-
                      MemoryRecall tier allocation (scoped §7 semantic recall, untrusted
                      provenance tier).
                    format: int64
                    type: integer
                  projectDocs:
                    description: ProjectDocs tier allocation (architecture docs, conventions).
                    format: int64
                    type: integer
                  workItem:
                    description: |-
                      WorkItem tier allocation. Must-include content (work item + acceptance
                      criteria + goals) is never truncated (§8.5).
                    format: int64
                    type: integer
                type: object
              credentialSecretRef:
                description: |-
                  CredentialSecretRef is the per-user BYO credential Secret (arch §11,
                  ADR-010 BYO-lock). Admission-time resolution ("an Agent must resolve
                  its credential Secret before it is admitted") is the reconciler's
                  fail-closed job (story 1.3).
                properties:
                  key:
                    description: Key inside the Secret; empty means the consumer-defined
                      default key.
                    type: string
                  name:
                    description: Name of the referenced Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              fallbackModel:
                description: |-
                  FallbackModel optionally names a secondary model for mid-Run model
                  switches on rate_limited signals (arch §8 tier-1 recovery, §10.3,
                  ADR-030/ADR-031), optionally with its own endpoint/credential.
                properties:
                  model:
                    description: Model is the secondary model name.
                    minLength: 1
                    type: string
                  modelEndpointRef:
                    description: |-
                      ModelEndpointRef optionally gives the fallback its own BYO endpoint
                      Secret (§10.3). Unset means the fallback resolves against the Agent's
                      own endpoint.
                    properties:
                      key:
                        description: Key inside the Secret; empty means the consumer-defined
                          default key.
                        type: string
                      name:
                        description: Name of the referenced Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - model
                type: object
              model:
                description: |-
                  Model is the resolved model name (e.g. a Claude model id, or an
                  Ollama-served model name when a BYO endpoint is configured).
                minLength: 1
                type: string
              modelEndpointRef:
                description: |-
                  ModelEndpointRef optionally references a per-user Secret holding a
                  BYO / Ollama / OpenAI-compatible model endpoint (arch §10.3, ADR-026,
                  `byoModelEndpoint` capability). Epic 5.7 flagged this field as
                  required at Gate 2 before 5.7 builds (CEO 2026-08-11) — the field
                  itself is mandatory on the type, while remaining optional at runtime:
                  an Agent on a paid provider with the default endpoint sets none of
                  the optional fields. It is a model-provider seam — NOT an
                  AgentRuntime.type and NOT a new image (that category error is
                  recorded in ADR-026).
                properties:
                  key:
                    description: Key inside the Secret; empty means the consumer-defined
                      default key.
                    type: string
                  name:
                    description: Name of the referenced Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              ownedBy:
                description: |-
                  OwnedBy is the owner principal ref (story 1.6, ISI-2522): the
                  authoritative ownership signal for resource-scoped permission checks
                  (Epic 15.3) — not a display field. Mutable: ownership may be
                  transferred after creation. Defaults to the created-by principal at
                  admission (internal/webhook AttributionWebhook) and is indexed for
                  RBAC scope queries (internal/index).
                maxLength: 253
                minLength: 1
                type: string
              roleRef:
                description: |-
                  RoleRef references the Role CRD supplying the reusable behavior
                  profile (prompt ref, default skills, runtime class hint).
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object. Empty means the referring object's
                      own namespace.
                    type: string
                required:
                - name
                type: object
              runtimeRef:
                description: |-
                  RuntimeRef references the AgentRuntime CRD (arch §5.3) that defines
                  this agent's coding-agent flavor and CLI version policy. The
                  AgentRuntime type is authored in story 1.3; this ref is the seam.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object. Empty means the referring object's
                      own namespace.
                    type: string
                required:
                - name
                type: object
              skillRefs:
                description: SkillRefs reference the Skill CRDs granted to this agent.
                items:
                  description: ObjectRef is a light cross-CRD reference to another
                    ksquad.io object.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referenced object. Empty means the referring object's
                        own namespace.
                      type: string
                  required:
                  - name
                  type: object
                type: array
            required:
            - credentialSecretRef
            - model
            - roleRef
            - runtimeRef
            type: object
        type: object
    served: true
    storage: true
