{{- if and .Values.controlPlane.enabled .Values.controlPlane.eventRelay.enabled }}
{{- $ns := include "k8squad.namespace" . }}
{{- $c := "event-relay" }}
{{- if not .Values.controlPlane.eventRelay.natsUrl }}
{{- fail "controlPlane.eventRelay.enabled=true requires controlPlane.eventRelay.natsUrl (the relay fails closed without NATS + DATABASE_URL)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksquad-event-relay
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.eventRelay.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 8 }}
    spec:
      serviceAccountName: ksquad-event-relay
      securityContext:
        runAsNonRoot: true
      containers:
      - name: event-relay
        image: {{ include "k8squad.image" (dict "root" $ "component" $c) }}
        imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: metrics
          containerPort: 9090
        env:
        {{- include "k8squad.databaseEnv" . | nindent 8 }}
        - name: RELAY_NATS_URL
          value: {{ .Values.controlPlane.eventRelay.natsUrl | quote }}
        - name: RELAY_METRICS_ADDR
          value: ":9090"
        {{- include "k8squad.otelEnv" . | nindent 8 }}
        {{- with .Values.controlPlane.eventRelay.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          tcpSocket:
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          {{- toYaml (.Values.controlPlane.eventRelay.resources | default dict) | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ksquad-event-relay-metrics
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
spec:
  selector:
    {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 4 }}
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
{{- end }}
