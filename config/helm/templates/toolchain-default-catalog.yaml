{{/*
Epic B (ISI-3286) — the default toolchain catalog (plan §2.2/§2.2b).

Behind tools.defaultCatalog.enabled: renders one Toolchain object per
curated entry into the control-plane namespace (the cluster catalog — the
admin-authored authority team namespaces may only narrow). Deploying a
tool for squads stays "flip one flag": the operator owns the per-Run RBAC
rendering, so there is no Role/RoleBinding/SA plumbing to hand-write.

The curated defaults are least-privilege (plan §2.2b): kubectl gets
read-only core+apps; the other thirteen (git, gh, go, node, dtctl, helm,
python, docker-cli, uv, jq, yq, curl, make) declare no RBAC at all — they
are staged onto PATH without any Kubernetes API grant. docker-cli is the
client only; the daemon stays the existing dockerd sidecar.
*/}}
{{- if .Values.tools.defaultCatalog.enabled }}
{{- $catalogNS := .Values.namespace.name }}
{{- range $name, $entry := .Values.tools.defaultCatalog.entries }}
---
apiVersion: ksquad.io/v1alpha1
kind: Toolchain
metadata:
  name: {{ $name }}
  namespace: {{ $catalogNS }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    ksquad.io/catalog: default
spec:
  versions:
    {{- toYaml $entry.versions | nindent 4 }}
  {{- with $entry.rbac }}
  rbac:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{/*
Operator toolchain-RBAC grant (ISI-5291, out-of-band gap ProxOps flagged on
ISI-5230). When a catalog Toolchain declares `rbac`, the operator renders a
per-Run Role (or ClusterRole) in the tenant namespace that grants those rules
to the agent SA (pkg/controller/run/rbac.go). Kubernetes privilege-escalation
prevention forbids a subject from creating an RBAC object that grants verbs the
subject does not itself already hold — so the ksquad-operator SA must carry the
UNION of every catalog toolchain's rbac rules, or the grant CreateOrUpdate 403s
and the kubectl toolchain silently fails to land its namespace RBAC. The
operator's own manager ClusterRole (templates/control-plane/rbac.yaml, kept in
lockstep with config/rbac/role.yaml) intentionally does NOT carry these tenant
read verbs, so we mint a dedicated, separately-bound ClusterRole per
RBAC-bearing toolchain. For the default kubectl entry this renders exactly the
hand-applied `ksquad-operator-toolchain-kubectl-grant` object, so a fresh
install / helm upgrade no longer depends on an out-of-band kubectl apply.
Guarded on controlPlane.enabled because the grant's only subject is the
operator SA, which the control plane owns.
*/}}
{{- if .Values.controlPlane.enabled }}
{{- range $name, $entry := .Values.tools.defaultCatalog.entries }}
{{- with $entry.rbac }}
{{- with .rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ksquad-operator-toolchain-{{ $name }}-grant
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    ksquad.io/catalog: default
    ksquad.io/toolchain-grant: {{ $name }}
rules:
  {{- toYaml . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ksquad-operator-toolchain-{{ $name }}-grant
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    ksquad.io/catalog: default
    ksquad.io/toolchain-grant: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ksquad-operator-toolchain-{{ $name }}-grant
subjects:
- kind: ServiceAccount
  name: ksquad-operator
  namespace: {{ $catalogNS }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
