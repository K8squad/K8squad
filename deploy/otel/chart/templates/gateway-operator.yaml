{{- /*
Mode: operator — OpenTelemetryCollector CR managed by the otel-operator.
The operator derives Service "<name>-collector" and ServiceAccount
"<name>-collector" from the CR name, satisfying the platform contract.
*/ -}}
{{- include "k8squad-otel.validate" . -}}
{{- if eq .Values.collector.mode "operator" }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Values.collector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.collector.name }}
    ksquad.io/component: telemetry-gateway
    {{- include "k8squad-otel.labels" . | nindent 4 }}
spec:
  mode: deployment
  observability:
    metrics:
      enableMetrics: true
  replicas: {{ .Values.collector.replicas }}
  image: {{ .Values.collector.image }}
  env:
    - name: KSQUAD_OTLP_AUTH
      valueFrom:
        secretKeyRef:
          name: {{ .Values.collector.authSecretRef.name }}
          key: {{ .Values.collector.authSecretRef.key }}
  # Backing store for the file_storage/queue extension (ISI-4371). The operator
  # auto-wires liveness/readiness from the health_check extension; the persistent
  # sending queue needs a writable volume the readOnlyRootFilesystem does not.
  volumeMounts:
    - name: otelcol-state
      mountPath: /var/lib/otelcol
  volumes:
    - name: otelcol-state
      emptyDir: {}
  # spec.config MUST be a structured mapping, not a YAML literal-block string
  # (ISI-4377). It was a string only under opentelemetry.io/v1alpha1; the live
  # CRD is v1beta1, whose schema types spec.config as `object`. A `config: |`
  # block renders well-formed YAML text that `helm template` accepts, but a
  # v1beta1 apiserver rejects it ("expected map, got string"). Nesting the
  # shared gatewayConfig under `config:` as an object makes the chart directly
  # helm-applyable — no one-off string→object transform on deploy.
  config:
    {{- include "k8squad-otel.gatewayConfig" . | nindent 4 }}
{{- end }}
