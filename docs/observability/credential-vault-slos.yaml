# Credential Vault Audit & Telemetry — SLOs / KPIs / Alerts
# (ISI-5820 WS-9 S7; parent ISI-5777; threat-model T7)
#
# Test-consumable KPI + alert definitions for the three mutating vault verbs
# (write / rotate / delete). Each KPI is a Dynatrace DQL query plus a threshold
# and a comparator, so a harness can run the query (e.g. `dtctl query -f -`),
# read the named numeric field, and assert it against the threshold. Metric keys
# are the canonical OTel names registered in internal/apiserver/obsfunnel.go and
# emitted by the handlers in internal/apiserver/secretwrite.go; Dynatrace
# preserves the dotted keys.
#
# STATUS: the DQL reuses the timeseries/filter grammar already syntax-validated
# against the DT dev tenant (oat05854.dev.apps.dynatracelabs.com) for the sibling
# github-sync-slos.yaml. Live evaluation is gated on an apiserver carrying S2/S3
# deployed to the DT-exporting env AND real vault traffic. Until then every query
# returns empty (no data), which a harness MUST treat as "not yet measurable",
# NOT as pass/fail.

meta:
  slo_domain: credential-vault
  window: 1h                 # rolling evaluation window; widen for release gates
  alert_window_seconds: 300  # 5m for the actionable failure-outcome alerts
  dt_tenant_context: dynatrace-dev
  empty_result_means: not_yet_measurable
  spans:
    - ksquad.credential.create
    - ksquad.credential.rotate
    - ksquad.credential.delete
  audit_tuple:               # the masked span payload — NEVER the value
    - credential.principal   # actor
    - credential.type
    - credential.project
    - k8s.namespace.name
    - outcome

kpis:
  - id: writes_rejected_zero
    title: Credential writes rejected by RBAC/admission == 0
    rationale: >
      outcome=rejected means the apiserver SA lost its secrets:create/delete
      grant or the ValidatingAdmissionPolicy denied the managed-credential write
      — the vault failing closed. Any non-zero value is an RBAC-drift regression
      (cf. ISI-5765/5767), not normal operation.
    metric: ksquad.credential.create.requests
    dql: |
      timeseries rejected = sum(ksquad.credential.create.requests, filter:{outcome=="rejected"})
        + sum(ksquad.credential.rotate.requests, filter:{outcome=="rejected"})
        + sum(ksquad.credential.delete.requests, filter:{outcome=="rejected"}),
        from:-1h
    value_expr: sum(rejected)
    comparator: eq
    threshold: 0
    alert: true

  - id: store_errors_zero
    title: Credential store errors == 0
    rationale: >
      outcome=store_error means the kube credential store was unavailable to the
      write/rotate/delete path. Sustained non-zero means mutations are dropping.
    metric: ksquad.credential.create.requests
    dql: |
      timeseries store_err = sum(ksquad.credential.create.requests, filter:{outcome=="store_error"})
        + sum(ksquad.credential.rotate.requests, filter:{outcome=="store_error"})
        + sum(ksquad.credential.delete.requests, filter:{outcome=="store_error"}),
        from:-1h
    value_expr: sum(store_err)
    comparator: eq
    threshold: 0
    alert: true

  - id: write_success_rate
    title: Write success rate >= 0.95 (excludes existence-hiding 404s)
    rationale: >
      Fraction of create attempts that materialized a Secret. invalid / conflict
      / no_namespace are caller-shaped (not platform faults) but are included as
      the honest denominator; a collapsing rate still surfaces a broken vault.
    metric: ksquad.credential.create.requests
    dql: |
      timeseries
        created = sum(ksquad.credential.create.requests, filter:{outcome=="created"}),
        total   = sum(ksquad.credential.create.requests),
        from:-1h
    value_expr: arrayAvg(created) / arrayAvg(total)
    comparator: gte
    threshold: 0.95

  - id: audit_span_coverage
    title: Every successful mutation emits its audit span
    rationale: >
      Count of ksquad.credential.* spans with a success outcome must equal the
      count of successful mutations in the metrics (created+rotated+deleted).
      A shortfall is an audit hole — a mutation that completed without its span.
      By construction span+metric are recorded in one funnelOutcome call, so a
      gap means the tracer provider is mis-wired in the deployed env.
    dql: |
      fetch spans, from:-1h
      | filter matchesPhrase(span.name, "ksquad.credential.")
      | filter in(outcome, {"created","rotated","deleted"})
      | summarize span_count = count()
    value_field: span_count
    comparator: gte
    # harness compares against the metric success count from the companion query:
    threshold_expr: >
      sum(created) + sum(rotated) + sum(deleted)   # from the per-verb success KPIs

# No-value-leakage is enforced in CI, not by DQL — a dashboard cannot prove the
# absence of a secret across all telemetry. The authoritative guarantee is the
# green state of these tests (internal/apiserver/obsfunnel_test.go):
leakage_guard:
  enforced_by_test:
    - TestNFR2ToolCredentialAuditSpansNoLeak   # write/rotate/delete
    - TestNFR2SecretNeverInTelemetry           # paste-key create
    - TestNFR2CredentialTestSecretNeverInTelemetry
  contract: the credential value appears in NO span attribute and NO log record

# Supporting signals (not gated KPIs; surfaced on the dashboard for triage).
supporting:
  - id: mutations_by_verb_outcome
    dql: |
      timeseries
        creates = sum(ksquad.credential.create.requests),
        rotates = sum(ksquad.credential.rotate.requests),
        deletes = sum(ksquad.credential.delete.requests),
        by:{outcome}, from:-1h
  - id: audit_trail
    dql: |
      fetch spans, from:-1h
      | filter matchesPhrase(span.name, "ksquad.credential.")
      | fields timestamp, span.name, credential.principal, credential.type,
               credential.project, k8s.namespace.name, outcome
      | sort timestamp desc
