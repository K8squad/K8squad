    controller-gen.kubebuilder.io/version: v0.16.5
  name: otelconfigs.ksquad.io
spec:
  group: ksquad.io
  names:
    kind: OTelConfig
    listKind: OTelConfigList
    plural: otelconfigs
    shortNames:
    - otelcfg
    singular: otelconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].lastTransitionTime
      name: Since
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OTelConfig is the platform-scoped, declarative telemetry routing contract
          (arch §5.1, story 1.5). It is cluster-scoped because telemetry routing is a
          platform concern, not a Team concern. Default is opt-in: no signal blocks
          means nothing is exported anywhere.

          Validation is layered: CEL rules embedded in the CRD (structural,
          enforced by the API server on 1.25+) plus a validating webhook that mirrors
          the CEL checks and adds checks CEL cannot express (see
          otelconfig_webhook.go).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OTelConfigSpec defines the desired state of OTelConfig. At least one signal
              must be configured; a spec with no signals is rejected as meaningless.
            properties:
              logs:
                description: Logs routing. Optional — omit to not export logs.
                properties:
                  auth:
                    description: |-
                      Auth references a Secret key whose value is presented as the
                      Authorization header on export requests.
                    properties:
                      key:
                        description: Key inside the Secret holding the auth value
                          (e.g. "token").
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: Name of the Secret containing the auth value.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      namespace:
                        description: |-
                          Namespace where the Secret lives. Defaults to the k8squad system
                          namespace when omitted.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  endpoint:
                    description: |-
                      Endpoint the signal is shipped to. For grpc this is host[:port] with an
                      optional https?:// scheme and no path; for http/protobuf and http/json
                      this is a full http(s) URL (typically .../v1/traces, .../v1/metrics,
                      .../v1/logs).
                    maxLength: 2048
                    minLength: 1
                    type: string
                  protocol:
                    description: Protocol used to export the signal.
                    enum:
                    - grpc
                    - http/protobuf
                    - http/json
                    type: string
                  resourceAttributes:
                    additionalProperties:
                      type: string
                    description: |-
                      ResourceAttributes are merged into the OTel resource attributes of the
                      exported signal. Keys owned by the platform (service.instance.id) are
                      rejected.
                    maxProperties: 64
                    type: object
                  sampling:
                    description: Sampling configures the head sampler. Traces only.
                    properties:
                      ratio:
                        description: |-
                          Ratio is the fraction of traces kept when Type is probabilistic.
                          Required and in (0, 1] for probabilistic; forbidden otherwise.
                        maximum: 1
                        minimum: 0
                        type: number
                      type:
                        description: Type selects the sampler.
                        enum:
                        - always_on
                        - always_off
                        - probabilistic
                        type: string
                    required:
                    - type
                    type: object
                required:
                - endpoint
                - protocol
                type: object
                x-kubernetes-validations:
                - message: endpoint must not contain whitespace
                  rule: self.endpoint.matches('^[^[:space:]]+$')
                - message: grpc endpoint must be host[:port] with an optional http(s)
                    scheme and no path
                  rule: self.protocol != 'grpc' || self.endpoint.matches('^(https?://)?[^/[:space:]]+(:[[:digit:]]+)?$')
                - message: http/protobuf and http/json endpoints must be full http(s)
                    URLs
                  rule: '!self.protocol.startsWith(''http/'') || self.endpoint.matches(''^https?://[^[:space:]]+$'')'
                - message: sampling is only valid on traces
                  rule: '!has(self.sampling)'
              metrics:
                description: Metrics routing. Optional — omit to not export metrics.
                properties:
                  auth:
                    description: |-
                      Auth references a Secret key whose value is presented as the
                      Authorization header on export requests.
                    properties:
                      key:
                        description: Key inside the Secret holding the auth value
                          (e.g. "token").
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: Name of the Secret containing the auth value.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      namespace:
                        description: |-
                          Namespace where the Secret lives. Defaults to the k8squad system
                          namespace when omitted.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  endpoint:
                    description: |-
                      Endpoint the signal is shipped to. For grpc this is host[:port] with an
                      optional https?:// scheme and no path; for http/protobuf and http/json
                      this is a full http(s) URL (typically .../v1/traces, .../v1/metrics,
                      .../v1/logs).
                    maxLength: 2048
                    minLength: 1
                    type: string
                  protocol:
                    description: Protocol used to export the signal.
                    enum:
                    - grpc
                    - http/protobuf
                    - http/json
                    type: string
                  resourceAttributes:
                    additionalProperties:
                      type: string
                    description: |-
                      ResourceAttributes are merged into the OTel resource attributes of the
                      exported signal. Keys owned by the platform (service.instance.id) are
                      rejected.
                    maxProperties: 64
                    type: object
                  sampling:
                    description: Sampling configures the head sampler. Traces only.
                    properties:
                      ratio:
                        description: |-
                          Ratio is the fraction of traces kept when Type is probabilistic.
                          Required and in (0, 1] for probabilistic; forbidden otherwise.
                        maximum: 1
                        minimum: 0
                        type: number
                      type:
                        description: Type selects the sampler.
                        enum:
                        - always_on
                        - always_off
                        - probabilistic
                        type: string
                    required:
                    - type
                    type: object
                required:
                - endpoint
                - protocol
                type: object
                x-kubernetes-validations:
                - message: endpoint must not contain whitespace
                  rule: self.endpoint.matches('^[^[:space:]]+$')
                - message: grpc endpoint must be host[:port] with an optional http(s)
                    scheme and no path
                  rule: self.protocol != 'grpc' || self.endpoint.matches('^(https?://)?[^/[:space:]]+(:[[:digit:]]+)?$')
                - message: http/protobuf and http/json endpoints must be full http(s)
                    URLs
                  rule: '!self.protocol.startsWith(''http/'') || self.endpoint.matches(''^https?://[^[:space:]]+$'')'
                - message: sampling is only valid on traces
                  rule: '!has(self.sampling)'
              toolUsage:
                description: |-
                  ToolUsage gates the Epic D tool-usage instrumentation pipeline
                  (gen_ai.tool.call / skill.load / mcp.call spans and the ksquad_* tool
                  metrics). Absent = enabled (opt-out, plan §5.4).
                properties:
                  enabled:
                    description: |-
                      Enabled turns the tool-usage pipeline on or off platform-wide.
                      Absent defaults to true (opt-out, plan §5.4): tool-usage telemetry
                      ships unless explicitly disabled.
                    type: boolean
                type: object
              traces:
                description: Traces routing. Optional — omit to not export traces.
                properties:
                  auth:
                    description: |-
                      Auth references a Secret key whose value is presented as the
                      Authorization header on export requests.
                    properties:
                      key:
                        description: Key inside the Secret holding the auth value
                          (e.g. "token").
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: Name of the Secret containing the auth value.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      namespace:
                        description: |-
