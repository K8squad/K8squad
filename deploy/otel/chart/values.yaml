# K8squad collector topology (ISI-4163 chart-of-record).
# Install into the observability namespace to preserve the platform contract:
#   helm install k8squad-otel deploy/otel/chart -n observability --create-namespace

collector:
  # ── Mode select (board requirement, ISI-4163) ─────────────────────────────
  # operator   — render OpenTelemetryCollector CR (needs the otel-operator).
  # deployment — render a plain Deployment+ConfigMap+Service, no operator.
  # external   — render no gateway: the user already runs a collector.
  mode: operator

  # Gateway name. The Service contract is "<name>-collector.<release-ns>" —
  # keep "otel-gateway" unless you also update config/helm
  # controlPlane.otel.endpoint in lockstep.
  name: otel-gateway
  replicas: 1
  image: otel/opentelemetry-collector-k8s:0.156.0

  # Resource attributes stamped on every signal.
  environment: test
  serviceNamespace: k8squad-test

  # Vendor backend (Dynatrace OTLP). Auth token is NEVER in values — it is
  # referenced from an out-of-band Secret created before install. Set the
  # endpoint to your own Dynatrace tenant's OTLP API, e.g.
  #   https://<your-tenant>.live.dynatrace.com/api/v2/otlp
  # (override via --set collector.vendor.endpoint=... or a values override file).
  vendor:
    endpoint: "https://YOUR_TENANT.live.dynatrace.com/api/v2/otlp"
  authSecretRef:
    name: dynatrace-otlp
    key: token

  # ── instscore ingestion tap (ISI-7749, phase 3 of ISI-7741) ────────────────
  # Second exporter otlphttp/instscore mirroring the SAME redacted,
  # post-processor batches to the K8squad apiserver's OTLP/HTTP ingestion
  # route, which folds them into per-service evidence windows in Postgres
  # (migration 0042) and refreshes instrumentation-score verdicts. The tap
  # rides AFTER k8sattributes/resource and DOWNSTREAM of redaction by
  # construction — exporters receive the processed batch. Auth token is NEVER
  # in values: create the Secret (default instscore-ingest/token) out-of-band
  # with the SAME value as the apiserver's KSQUAD_INSTSCORE_TOKEN.
  # Cross-release wiring: endpoint targets the ksquad chart's apiserver
  # Service "<fullname>-apiserver.<ns>.svc" (port 80).
  instscore:
    enabled: true
    endpoint: "http://ksquad-apiserver.ksquad-system.svc/api/instscore"
    authSecretRef:
      name: instscore-ingest
      key: token

  # BYO collector (mode=external). HTTP(S) OTLP endpoint of the user's own
  # collector, e.g. "http://my-collector.monitoring:4318". Used by the
  # node-logs DaemonSet when enabled; workload wiring is done by setting
  # controlPlane.otel.endpoint in config/helm to the gRPC endpoint.
  external:
    endpoint: ""

nodeLogs:
  # Node-level pod log collection (filelog → gateway). Independent of mode:
  # in external mode it ships logs to collector.external.endpoint.
  enabled: true
  image: otel/opentelemetry-collector-k8s:0.156.0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
