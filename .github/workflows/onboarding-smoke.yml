name: onboarding-smoke

# Onboarding-journey regression lane (ISI-7270 / WS-7, plan rev 0cec0baa under
# ISI-7255) — sibling of getting-started-smoke.yml.
#
# getting-started-smoke proves the published quickstart reproduces (install +
# example-squad apply, no dangling refs) but intentionally stops before the
# human journey. This lane promotes the WS-2..5 milestone assertions — admin
# bootstrap/login, Team, minimal-trio squad (agents+models), Project with repo
# auth — into CI on a THROWAWAY kind cluster, asserting the
# GET /api/onboarding/progress milestone flips ①→④ on a member session so
# onboarding drift FAILS PRs. Milestone reads poll-until-stable because the
# onboarding read model rides the informer cache (ISI-7352 stale-zero window
# ~1 min after fresh-install writes). Credential/live-endpoint legs are
# documented skip-with-reason inside the script — never a silent pass.
#
# All logic lives in hack/onboarding-smoke.sh so it is runnable locally
# against any kube-context; this workflow only provisions the cluster and
# invokes it. The apiserver image is built from PR source (when docker/kind
# are available) so /api/* regressions fail the PR itself.

on:
  pull_request:
    paths:
      - 'internal/apiserver/**'
      - 'db/migrations/**'
      - 'config/helm/**'
      - 'config/helm-crds/**'
      - 'config/roles/**'
      - 'console/lib/onboarding.ts'
      - 'console/lib/presets.ts'
      - 'examples/bmad-team/**'
      - 'hack/onboarding-smoke.sh'
      - '.github/workflows/onboarding-smoke.yml'
  schedule:
    - cron: '0 6 * * *'   # nightly, offset from getting-started-smoke's 05:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-smoke:
    name: onboarding journey (fresh kind cluster)
    runs-on: [self-hosted, linux, x64]   # needs docker/kind — same runner class as getting-started-smoke (ISI-3476)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create fresh kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: chart-testing
          wait: 120s

      - name: Assert the onboarding journey milestones on a fresh install
        env:
          KIND_CLUSTER: chart-testing
        run: ./hack/onboarding-smoke.sh
