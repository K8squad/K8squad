# .grype.yaml — the ONLY CVE escape hatch for the Grype cross-check lane (ISI-7285).
#
# Mirrors the .trivyignore discipline: every suppression below carries, on the comment
# line directly above the rule, an `expires:YYYY-MM-DD` date plus a one-line
# justification. The security.yml `trivyignore (expiry lint)` job lints this file's
# expiry markers exactly like .trivyignore — an expired entry is itself a gate
# failure. Grype (unlike Trivy) has no native expiry support, so the dates live in
# comments and the lint is the enforcement. Remove or re-justify before expiry;
# never blind-renew.
#
# Scope: ALL entries below are ksquad-console RUNTIME BASE contents
# (gcr.io/distroless/nodejs24-debian12:nonroot — libssl3 3.0.18-1~deb12u2,
# node v24.14.0, libc6 2.36-9+deb12u13; base-only: node ships FROM the distroless
# base, the console build stages copy only JS/standalone output). Live-verified
# 2026-11-10 (ISI-7285): the :nonroot tag still ships exactly these versions
# (index sha256:14d42e2511532589a7c7e01a753667a74fcc96266e137e8125006b87b0c32d0a,
# amd64 manifest sha256:6c75c6e4771c2ea5f02aaf991abdc77391acd3a580accd9d7b68651f12c60dc0;
# dpkg status.d inspected from the registry blobs). Fixes exist in Debian bookworm
# security / nodejs upstream and ride the next distroless tag rebuild; distroless
# has no package manager, so the image cannot be patched in-repo. Durable action:
# when the rebuilt base ships libssl3 >= 3.0.22 / node >= 24.22.1 /
# libc6 >= 2.36-9+deb12u14, bump the runtime base in Dockerfile.console and DELETE
# these entries. Trivy's parallel openssl batch lives in .trivyignore (Trivy-only).
