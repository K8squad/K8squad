# The minimum carve-outs over the default-deny baseline (§12.2, Story 4.6):
#   - every team pod may resolve DNS (kube-dns, UDP/TCP 53);
#   - a sandbox Run may reach ONLY its team's egress proxy on :8080 — the
#     allowlisted upstreams are never directly reachable from a sandbox, so
#     every allowlisted call rides the audited proxy (S4-2);
#   - an egress proxy may reach ONLY ksquad-infra on :443 (model.internal,
#     control-plane.ksquad);
#   - ksquad-infra accepts ingress ONLY from pods labelled as egress proxies.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: team-a
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-egress-proxy
  namespace: team-a
spec:
  podSelector:
    matchLabels:
      ksquad.io/component: run-sandbox
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              ksquad.io/component: egress-proxy
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: team-b
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# team-b runs no sandboxes in this fixture; it only needs to stay unreachable
# from team-a (S4-3). No egress-proxy carve-out is created for it.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-egress-to-infra
  namespace: team-a
spec:
  podSelector:
    matchLabels:
      ksquad.io/component: egress-proxy
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ksquad-infra
      ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-ingress-from-proxy-only
  namespace: ksquad-infra
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              ksquad.io/component: egress-proxy
      ports:
        - { protocol: TCP, port: 443 }
