name: Component Matrix

# Story 14.7 (ISI-2742) — the REUSABLE component fan-out primitive.
#
# This workflow is the single source of truth for "what components does the KSquad
# pipeline fan out over". Every test lane (L1 unit/build in ci.yml, L5 e2e, supply-chain,
# the Ollama credit-free lane — stories 14.1 / 14.5 / 14.6 / 14.8) calls this reusable
# workflow and derives its per-component matrix from the outputs below, so the component
# list is declared in exactly ONE place and can never drift lane-to-lane.
#
# It is invoked with `uses: ./.github/workflows/component-matrix.yml` and exposes four
# typed JSON outputs, one per toolchain family:
#
#   go     — deployable Go binaries        (operator, apiserver, memory)
#   shims  — per-runtime A2A shim images   (claude, openclaw, hermes, opencode)
#   helm   — Helm charts                    (k8squad)
#   node   — Node/TypeScript surfaces       (console)
#
# coord (the coordination spine, pkg/coord) is intentionally NOT a go leg here: it is
# exercised by every go leg's `go test ./...` and its correctness-critical concurrency /
# fencing guarantees are gated by the dedicated `spine-chaos.yml` required check. Listing
# it as a redundant full-module unit leg would only triple-run the same tests on the
# 2-runner homelab fleet (ISI-2602) for no added signal.
#
# STABLE CHECK-RUN NAMES (branch protection wires these per component — ISI-2674):
#   go / operator      go / apiserver     go / memory
#   shim / claude      shim / openclaw    shim / hermes    shim / opencode
#   helm / k8squad     node / console     db / migrations self-check
# Consumers MUST keep their `name:` templates in sync with these so a required check never
# silently renames itself out from under branch protection.

on:
  workflow_call:
    outputs:
      go:
        description: "JSON array of deployable Go components: {component, path}."
        value: ${{ jobs.emit.outputs.go }}
      shims:
        description: "JSON array of per-runtime shim images: {runtime, path}."
        value: ${{ jobs.emit.outputs.shims }}
      helm:
        description: "JSON array of Helm charts: {chart, path}."
        value: ${{ jobs.emit.outputs.helm }}
      node:
        description: "JSON array of Node/TS surfaces: {component, path}."
        value: ${{ jobs.emit.outputs.node }}

permissions:
  contents: read

jobs:
  emit:
    name: emit component matrix
    # R1 (ISI-2748 epic-14-ci-runner-constraints): the K8squad/K8squad repo has NO hosted-runner
    # minutes — a `runs-on: ubuntu-latest` job sits queued forever and would wedge every downstream
    # lane that consumes this job's outputs. This leg is trivial (echoes JSON) so it rides either
    # self-hosted box as a light leg; it does not meaningfully contend for the two slots.
    runs-on: [self-hosted, linux, x64]
    outputs:
      go: ${{ steps.set.outputs.go }}
      shims: ${{ steps.set.outputs.shims }}
      helm: ${{ steps.set.outputs.helm }}
      node: ${{ steps.set.outputs.node }}
    steps:
      - name: Declare the canonical KSquad component matrix
        id: set
        run: |
          set -euo pipefail
          # Compact single-line JSON so `fromJSON()` in the calling lane stays trivial.
          {
            echo 'go=[{"component":"operator","path":"cmd/operator"},{"component":"apiserver","path":"cmd/apiserver"},{"component":"memory","path":"cmd/memory"}]'
            echo 'shims=[{"runtime":"claude","path":"cmd/shim-claude"},{"runtime":"openclaw","path":"cmd/shim-openclaw"},{"runtime":"hermes","path":"cmd/shim-hermes"},{"runtime":"opencode","path":"cmd/shim-opencode"}]'
            echo 'helm=[{"chart":"k8squad","path":"config/helm"}]'
            echo 'node=[{"component":"console","path":"console"}]'
          } >> "$GITHUB_OUTPUT"

      - name: Echo matrix (audit trail)
        run: |
          echo "go=${{ steps.set.outputs.go }}"
          echo "shims=${{ steps.set.outputs.shims }}"
          echo "helm=${{ steps.set.outputs.helm }}"
          echo "node=${{ steps.set.outputs.node }}"
