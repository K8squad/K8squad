# BMAD squad — concatenated single-file manifest (ISI-3270).
#
# Generated by concatenating 00-namespace.yaml .. 08-team.yaml in apply order.
# Apply the whole squad with:  kubectl apply -f squad.yaml
# (CRDs must already be installed by the K8squad Helm chart.)
#
# Edit the numbered source files, not this file; regenerate with:
#   for f in 0*.yaml; do printf "\n# =====  =====\n---\n" "$f"; cat "$f"; done > squad.yaml

# ===== 00-namespace.yaml =====
---
# BMAD squad namespace. Everything in this example lives here so a single
# `kubectl delete namespace bmad-squad` tears the whole demo down.
apiVersion: v1
kind: Namespace
metadata:
  name: bmad-squad
  labels:
    app.kubernetes.io/part-of: k8squad
    app.kubernetes.io/managed-by: bmad-team-example
    ksquad.io/example: bmad-team

# ===== 01-credentials.yaml =====
---
# Model credential every Agent authenticates with (BYO, arch §11 / ADR-010).
#
# Replace REPLACE_ME with a real provider token before pointing the squad at
# anything. The default credentialClass is service-account (a long-lived API
# key, e.g. ANTHROPIC_API_KEY); flip an Agent's spec.credentialClass to
# human-seat to inject an interactive OAuth token (e.g. CLAUDE_CODE_OAUTH_TOKEN)
# instead.
apiVersion: v1
kind: Secret
metadata:
  name: model-credentials
  namespace: bmad-squad
type: Opaque
stringData:
  token: "REPLACE_ME"
---
# MCP server credentials (ADR-045: BYO tokens, never literal in the CRD).
# Referenced by 02b-mcpservers.yaml via spec.credentialSecretRef; the
# discovery controller reports resolution as the CredentialsValid condition
# (ADR-042) — a missing Secret degrades the MCPServer to Ready=False, it
# does not block the apply. Same REPLACE_ME rule: swap before real use.
apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-token
  namespace: bmad-squad
type: Opaque
stringData:
  token: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-mcp-token
  namespace: bmad-squad
type: Opaque
stringData:
  token: "REPLACE_ME"

# ===== 02b-mcpservers.yaml =====
---
# MCP servers the squad's tool Skills reach (ADR-042, Epic A / ISI-3285).
#
# Skill.spec.mcpToolRefs in 03-skills.yaml resolve against these MCPServer
# objects — fail-closed: a dangling ref rejects the Run at admission.
# Each server is data-only (transport + endpoint/command + credential +
# tool envelope + egress linkage); Skills may only NARROW toolFilter, never
# widen it (trust boundary D8).
#
# The discovery controller probes each server from the control plane
# (initialize → tools/list) and records status.observedTools plus the
# Ready / CredentialsValid / EgressAllowed / ToolsDiscovered conditions.
# Runs never admit against a server whose tool surface is unknown
# (empty observedTools ⇒ fail-closed staleness, ADR-042) — so expect a
# short delay after the first apply before Runs referencing these servers
# go through.
#
# Endpoints/tokens below are illustrative — repoint them at your own
# GitHub Copilot MCP / Dynatrace tenant before use, and swap the
# REPLACE_ME tokens in 01-credentials.yaml.
---
# GitHub MCP over the Streamable HTTP transport (spike A.2/A.3: one
# endpoint, POST for messages, Mcp-Session-Id header echo; SSE is not a
# v1alpha1 transport). Credential rides the Secret, projected per-Run as
# an env var — never into any file the agent runtime reads (ADR-045 D5).
apiVersion: ksquad.io/v1alpha1
kind: MCPServer
metadata:
  name: github-mcp
  namespace: bmad-squad
spec:
  transport: streamable-http
  endpoint: https://api.githubcopilot.com/mcp/
  credentialSecretRef:
    name: github-mcp-token
    key: token
  # The granted tool envelope: allow globs minus deny globs. Empty allow
  # would grant everything observed; this envelope keeps PR/issue work
  # and subtracts the destructive corners.
  toolFilter:
    allow:
      - "*"
    deny:
      - "delete_*"
  # egressRef: { name: github-egress }   # optional: tie to an EgressPolicy
  # covering this endpoint (R1 — MCP rides the existing egress story).
  discovery:
    intervalMinutes: 10
---
# Dynatrace MCP over stdio, packaged as an image: Run assembly stages it
# as a sidecar container in pods of Runs whose skills reference it
# (ADR-044 step 6), and the discovery probe Job runs the same image.
# Pin the digest in real use.
apiVersion: ksquad.io/v1alpha1
kind: MCPServer
metadata:
  name: dynatrace-mcp
  namespace: bmad-squad
spec:
  transport: stdio
  command: /usr/local/bin/dynatrace-mcp
  args: ["--stdio"]
  image: ghcr.io/k8squad/mcp/dynatrace:1.0
  credentialSecretRef:
    name: dynatrace-mcp-token
    key: token
  toolFilter:
    allow:
      - "query_*"
      - "list_*"
      - "get_*"

# ===== 02-runtimes.yaml =====
---
# AgentRuntime = the coding-agent flavor + CLI version policy an Agent points
# at via spec.runtimeRef (arch §5.3). This squad runs one flavor, claude-code,
# so every Agent references the same runtime. Pin cliVersion to an immutable
# tag/SHA for reproducibility (ADR-017); left unset here so the shim resolves
# the default channel.
apiVersion: ksquad.io/v1alpha1
kind: AgentRuntime
metadata:
  name: claude-code
  namespace: bmad-squad
spec:
  type: claude-code

# ===== 03-skills.yaml =====
---
# The four default Skills granted to this squad (arch §5.3.6). A Skill is the
# CRD-authorized capability envelope: it is registered here by the operator/
# admin and never self-widened by the fetched body (trust boundary D8).
#
# Wiring: Skills attach to Roles via Role.spec.defaultSkills[] (see 05-roles.yaml)
# — every role gets `bmad`; coder/devops/code-reviewer get `github`;
# observability gets `dynatrace`; graphical-designer gets `graphical`.
#
# `bmad` is inline (self-contained, no fetch). The tool skills are git-sourced
# from the canonical catalog (K8squad/k8squad-skills, ISI-3274) and PINNED to
# a commit SHA so a force-push cannot silently alter behavior mid-Run
# (§5.3.6). The SHAs below point at real catalog commits (bf3bc86 =
# k8squad-skills main at ISI-3391; the catalog re-pins on each release) —
# repoint them at your own skill repo if you fork the catalog.
#
# Capability plane wiring (ISI-3280, Epics A-C):
# - mcpToolRefs resolve against the MCPServer objects in 02b-mcpservers.yaml
#   (fail-closed at Run admission on a dangling ref; the skill may only
#   narrow the server's toolFilter, never widen it — D8).
# - requires.toolchains resolve name@version against the cluster Toolchain
#   catalog (ksquad-system). Enable the chart's default catalog with
#   tools.defaultCatalog.enabled=true — it ships gh@2.98, dtctl@1.0 and
#   node@22, the exact versions referenced below. Unknown name/version
#   rejects the Run at admission with an actionable message.
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: bmad
  namespace: bmad-squad
spec:
  source:
    type: inline
    inline: |
      # BMAD Method

      The Breakthrough Method of Agile AI-Driven Development (BMAD) structures
      squad work into phases with explicit handoffs:

      1. Analysis   — Brainstormer explores the problem space; domain research.
      2. Product    — Product Manager writes the PRD from validated needs.
      3. Solutioning— Architect turns the PRD into architecture decisions.
      4. Stories    — requirements decompose into epics and stories.
      5. Delivery   — Coder implements; Code Reviewer and Test Architect gate.
      6. Operate    — DevOps and Observability Engineer ship and watch it run.

      Principles: user journeys drive technical decisions; prefer boring,
      proven technology; every decision ties to business value; verify before
      claiming done; hand work off with enough context to start without asking.
  permissions:
    - workflow:bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: github
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      # Pin to an immutable commit SHA (never a floating branch), §5.3.6.
      ref: "bf3bc86b338d488fe751c289943db194ce8102c7"
      path: skills/github
  mcpToolRefs:
    - name: github-mcp
  permissions:
    - scm:read
    - scm:write
    - pr:write
    - issue:write
  requires:
    toolchains:
      - gh@2.98
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: dynatrace
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      ref: "bf3bc86b338d488fe751c289943db194ce8102c7"
      path: skills/dynatrace
  mcpToolRefs:
    - name: dynatrace-mcp
  permissions:
    - observability:read
    - telemetry:query
  requires:
    toolchains:
      - dtctl@1.0
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: graphical
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      ref: "bf3bc86b338d488fe751c289943db194ce8102c7"
      path: skills/graphical
  permissions:
    - render:svg
    - asset:write
  requires:
    toolchains:
      - node@22

# ===== 04-prompts.yaml =====
---
# Prompt / behavior ConfigMaps, one per Role (referenced by Role.spec.promptRef).
#
# No manager/reportsTo edge exists in the CRD model — Team.spec.agents is flat.
# The BMAD reporting hierarchy is therefore encoded HERE, in each role's prompt,
# and mirrored as labels on the Roles/Agents:
#
#   CEO
#   ├── Product Manager ── Brainstormer, Challenger, Content Writer
#   ├── System Architect ── Code Reviewer, Test Architect, Coder,
#   │                       DevOps Engineer, Observability Engineer
#   └── UX Designer ─────── Graphical Designer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceo-prompt
  namespace: bmad-squad
data:
  system.md: |
    # CEO — BMAD Squad Lead

    You lead this BMAD squad on K8squad. You own vision, priorities, and the
    call on what ships. You do not write code; you set direction and unblock.

    ## Your direct reports
    - Product Manager — owns the PRD and what/why of the product.
    - System Architect — owns the technical solution design.
    - UX Designer — owns the user experience.

    ## How you work
    Translate business goals into clear objectives for your three reports.
    Resolve cross-functional conflicts. Approve scope and sequencing. Demand
    that every decision ties back to user and business value.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-manager-prompt
  namespace: bmad-squad
data:
  system.md: |
    # Product Manager (John) — BMAD Phase 2: Product

    You turn validated needs into a crisp PRD. You report to the CEO.

    ## Your direct reports
    - Brainstormer — divergent ideation and domain research.
    - Challenger — adversarial review of assumptions and scope.
    - Content Writer — user-facing copy, docs, and getting-started guides.

    ## Handoffs
    Receive direction from the CEO. Pull ideas from the Brainstormer and
    pressure-test them with the Challenger before committing. Hand the finished
    PRD to the System Architect for solutioning. Keep acceptance criteria
    testable so the Test Architect can verify them later.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: architect-prompt
  namespace: bmad-squad
data:
  system.md: |
    # System Architect (Winston) — BMAD Phase 3: Solutioning

    You are a senior architect: distributed systems, cloud infrastructure, API
    design. You balance vision with pragmatism and embrace boring, proven
    technology. You report to the CEO.

    ## Your direct reports
    - Code Reviewer — implementation-quality gate.
    - Test Architect — test strategy and coverage.
    - Coder — implementation.
    - DevOps Engineer — CI/CD, delivery, and infrastructure.
    - Observability Engineer — metrics, tracing, logging, alerting.

    ## Handoffs
    Take the PRD from the Product Manager and produce architecture decisions.
    Hand architecture context to the Coder and Test Architect for stories, and
    to the Observability Engineer for telemetry planning. Ground every choice in
    real-world trade-offs — no hype, no silver bullets.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ux-designer-prompt
  namespace: bmad-squad
data:
  system.md: |
    # UX Designer — User Experience

    You own the end-to-end user experience: flows, information architecture,
    and interaction design. You report to the CEO.

    ## Your direct reports
    - Graphical Designer — visual design, mockups, and brand assets.

    ## Handoffs
    Translate PRD goals into user journeys and wireframes. Direct the Graphical
    Designer on visual execution. Align with the System Architect so the design
    is buildable within the chosen architecture.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: brainstormer-prompt
  namespace: bmad-squad
data:
  system.md: |
    # Brainstormer (Mary) — BMAD Phase 1: Analysis

    You explore the problem space with divergent thinking and domain research.
    You report to the Product Manager.

    ## How you work
    Generate a wide field of options before narrowing. Surface analogous
    solutions, edge cases, and unknowns. Feed the strongest, best-researched
    ideas to the Product Manager and Challenger for pressure-testing.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: challenger-prompt
  namespace: bmad-squad
data:
  system.md: |
    # Challenger — Adversarial Review

    You stress-test ideas, assumptions, and scope before they harden into a
    plan. You report to the Product Manager.

    ## How you work
    Ask "what breaks this?" Hunt for hidden assumptions, missing edge cases, and
    scope creep. Argue the counter-position honestly. Your job is to make the
    plan stronger, not to block it — hand findings back to the Product Manager
    and Architect with concrete risks and mitigations.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: content-writer-prompt
  namespace: bmad-squad
data:
  system.md: |
    # Content Writer — User-Facing Copy & Docs

    You write clear, user-facing content: product copy, documentation, and
    getting-started guides. You report to the Product Manager.

    ## How you work
    Write for the reader, not the author. Keep it accurate and current with the
    shipped behavior. When you document an example (like this squad), keep
    filenames and apply-order references stable and flag any drift to the owner.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-reviewer-prompt
  namespace: bmad-squad
data:
  system.md: |
    # Code Reviewer (Amelia) — Implementation Quality Gate

    You review code changes for correctness, clarity, and adherence to the
    architecture. You report to the System Architect.

    ## How you work
    Use the architecture document as the implementation reference. Find real
    bugs and root causes, not symptoms. Prefer reuse and the smallest correct
    diff. Approve only what you would be comfortable owning in production. You
    have the `github` skill for PR review workflows.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-architect-prompt
  namespace: bmad-squad
data:
  system.md: |
    # Test Architect — Test Strategy & Coverage

    You own the test strategy: what to test, at which layer, and how much. You
    report to the System Architect.

    ## How you work
    Turn the PRD's acceptance criteria into verifiable tests. Balance unit,
    integration, and end-to-end coverage against cost. Guard the coverage floor
    and flag untested risk back to the Architect and Coder.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-prompt
  namespace: bmad-squad
data:
  system.md: |
    # Coder — Implementation

    You implement stories against the architecture. You report to the System
    Architect.

    ## How you work
    Keep changes small, tested, and reviewable. Reuse existing helpers and
    patterns before writing new code. Match the surrounding style. Leave a
    runnable check behind for non-trivial logic. Ship via PR for the Code
    Reviewer. You have the `github` skill for branch/PR workflows.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-engineer-prompt
  namespace: bmad-squad
data:
  system.md: |
    # DevOps Engineer — CI/CD, Delivery & Infrastructure

    You own the path from merge to production: pipelines, releases, and the
    infrastructure they run on. You report to the System Architect.

    ## How you work
    Automate the boring parts. Keep pipelines green and fast. Make rollout and
    rollback safe and reversible. Coordinate with the Observability Engineer so
    every deploy is watchable. You have the `github` skill for CI workflows.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-engineer-prompt
  namespace: bmad-squad
data:
  system.md: |
    # Observability Engineer — Metrics, Tracing, Logging, Alerting

    You make the system observable. You report to the System Architect.

    ## How you work
    Take the architecture's components and data flows and design coverage:
    metrics, structured logs, distributed traces, and actionable alerts. Prefer
    signals that answer "is the user affected?" You have the `dynatrace` skill
    (dtctl + Dynatrace MCP) for telemetry queries.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphical-designer-prompt
  namespace: bmad-squad
data:
  system.md: |
    # Graphical Designer — Visual Design & Assets

    You produce the visual layer: mockups, brand assets, and diagrams. You
    report to the UX Designer.

    ## How you work
    Execute the UX Designer's direction into concrete visuals. Keep to the
    brand system. Deliver accessible, production-ready assets. You have the
    `graphical` skill (SVG rendering + asset toolchain).

# ===== 05-roles.yaml =====
---
# One Role per BMAD function (arch §5.1). Each carries:
#   - promptRef      → its behavior ConfigMap (04-prompts.yaml)
#   - defaultSkills  → Skills granted to any Agent assuming the role
#   - labels         → the reporting hierarchy (ksquad.io/reports-to), since the
#                      CRD model has no manager edge
#   - runtimeClassHint → sandbox posture for execution-heavy roles (gvisor)
#
# Skill wiring: every role gets `bmad`; coder/devops/code-reviewer add `github`;
# observability-engineer adds `dynatrace`; graphical-designer adds `graphical`.
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: ceo
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: ceo
spec:
  promptRef:
    name: ceo-prompt
  defaultSkills:
    - name: bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: product-manager
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: product-manager
    ksquad.io/reports-to: ceo
spec:
  promptRef:
    name: product-manager-prompt
  defaultSkills:
    - name: bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: architect
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: architect
    ksquad.io/reports-to: ceo
spec:
  promptRef:
    name: architect-prompt
  defaultSkills:
    - name: bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: ux-designer
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: ux-designer
    ksquad.io/reports-to: ceo
spec:
  promptRef:
    name: ux-designer-prompt
  defaultSkills:
    - name: bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: brainstormer
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: brainstormer
    ksquad.io/reports-to: product-manager
spec:
  promptRef:
    name: brainstormer-prompt
  defaultSkills:
    - name: bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: challenger
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: challenger
    ksquad.io/reports-to: product-manager
spec:
  promptRef:
    name: challenger-prompt
  defaultSkills:
    - name: bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: content-writer
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: content-writer
    ksquad.io/reports-to: product-manager
spec:
  promptRef:
    name: content-writer-prompt
  defaultSkills:
    - name: bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: code-reviewer
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: code-reviewer
    ksquad.io/reports-to: architect
spec:
  promptRef:
    name: code-reviewer-prompt
  runtimeClassHint: gvisor
  defaultSkills:
    - name: bmad
    - name: github
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: test-architect
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: test-architect
    ksquad.io/reports-to: architect
spec:
  promptRef:
    name: test-architect-prompt
  runtimeClassHint: gvisor
  defaultSkills:
    - name: bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: coder
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: coder
    ksquad.io/reports-to: architect
spec:
  promptRef:
    name: coder-prompt
  runtimeClassHint: gvisor
  defaultSkills:
    - name: bmad
    - name: github
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: devops-engineer
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: devops-engineer
    ksquad.io/reports-to: architect
spec:
  promptRef:
    name: devops-engineer-prompt
  runtimeClassHint: gvisor
  defaultSkills:
    - name: bmad
    - name: github
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: observability-engineer
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: observability-engineer
    ksquad.io/reports-to: architect
spec:
  promptRef:
    name: observability-engineer-prompt
  defaultSkills:
    - name: bmad
    - name: dynatrace
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: graphical-designer
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: graphical-designer
    ksquad.io/reports-to: ux-designer
spec:
  promptRef:
    name: graphical-designer-prompt
  defaultSkills:
    - name: bmad
    - name: graphical

# ===== 06-agents.yaml =====
---
# One Agent per Role — the concrete squad members. Each Agent binds a model +
# credential to a Role and Runtime. Skills are inherited from the Role's
# spec.defaultSkills (05-roles.yaml); an Agent could override with its own
# spec.skillRefs, but here we let the role defaults stand.
#
# Models: opus for the strategic/heavy-reasoning roles (CEO, PM, Architect),
# sonnet for the rest. credentialClass defaults to service-account.
---
apiVersion: ksquad.io/v1alpha1
kind: Agent
metadata:
  name: sam
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: ceo
spec:
  model: claude-opus-5
  roleRef:
    name: ceo
  runtimeRef:
    name: claude-code
  credentialSecretRef:
    name: model-credentials
    key: token
---
apiVersion: ksquad.io/v1alpha1
kind: Agent
metadata:
  name: john
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: product-manager
    ksquad.io/reports-to: ceo
spec:
  model: claude-opus-5
  roleRef:
    name: product-manager
  runtimeRef:
    name: claude-code
  credentialSecretRef:
    name: model-credentials
    key: token
---
apiVersion: ksquad.io/v1alpha1
kind: Agent
metadata:
  name: winston
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: architect
    ksquad.io/reports-to: ceo
spec:
  model: claude-opus-5
  roleRef:
    name: architect
  runtimeRef:
    name: claude-code
  credentialSecretRef:
    name: model-credentials
    key: token
---
apiVersion: ksquad.io/v1alpha1
kind: Agent
metadata:
  name: uma
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: ux-designer
    ksquad.io/reports-to: ceo
spec:
  model: claude-sonnet-5
  roleRef:
    name: ux-designer
  runtimeRef:
    name: claude-code
  credentialSecretRef:
    name: model-credentials
    key: token
---
apiVersion: ksquad.io/v1alpha1
kind: Agent
metadata:
  name: mary
  namespace: bmad-squad
