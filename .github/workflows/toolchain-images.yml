name: Toolchain Images

# ISI-3413 — the toolchain image factory. Builds and publishes every image the default
# Toolchain catalog references (config/helm/values.yaml → tools.defaultCatalog.entries →
# ghcr.io/k8squad/toolchains/<tool>:<version>). Before this lane existed, all 14 catalog
# image refs 404'd (ISI-3400 verification, Henrik's comment e5a3327e).
#
# Single source of truth: images/toolchains/matrix.json declares the full tool set
# (tool / catalog tag / Dockerfile / build args) in exactly ONE place — the plan job
# fans the build matrix out from it, so "what toolchains does KSquad ship" can never
# drift lane-to-lane. Adding a tool = one matrix.json row + one Dockerfile.
#
# Supply-chain posture mirrors build-images.yml (Story 14.6 / ISI-2745): multi-arch
# (amd64+arm64) build → push to ghcr.io → SBOM (Syft) → Trivy CVE gate on the curated
# .trivyignore → cosign keyless sign + SBOM attest + SLSA build provenance on publish.
# Unlike the platform lane there are no release tags here: every publish event (main
# push touching images/toolchains/**, weekly CVE rebuild, manual dispatch) signs and
# attests, because the rolling catalog tag IS the release artifact.
#
# Triggers:
#   push/PR touching images/toolchains/**  — PRs build only (no push/sign)
#   schedule (weekly)                      — base-image/apk CVE refresh
#   workflow_dispatch                      — manual republish

on:
  push:
    branches: [main]
    paths:
      - 'images/toolchains/**'
      - '.github/workflows/toolchain-images.yml'
  pull_request:
    paths:
      - 'images/toolchains/**'
      - '.github/workflows/toolchain-images.yml'
  schedule:
    - cron: '23 4 * * 1' # weekly base-image CVE rebuild (Mon 04:23 UTC)
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless (OIDC) + SLSA provenance attestation
  attestations: write

env:
  REGISTRY: ghcr.io

concurrency:
  # ISI-3235/ISI-2748 R2: cancel superseded runs to free the self-hosted slots, but
  # NEVER cancel a main run.
  group: toolchain-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Fan the build matrix out from images/toolchains/matrix.json (single source of truth).
  plan:
    name: plan toolchain matrix
    # R1 (ISI-2748): no hosted-runner minutes — light JSON-shaping leg rides the
    # self-hosted box, same as build-images.yml's plan leg.
    runs-on: [self-hosted, linux, x64]
    outputs:
      tools: ${{ steps.matrix.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read images/toolchains/matrix.json
        id: matrix
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          rows = []
          for t in json.load(open("images/toolchains/matrix.json"))["tools"]:
              rows.append({
                  "tool": t["tool"],
                  "version": t["version"],
                  "dockerfile": t["dockerfile"],
                  "context": t.get("context", "."),
                  "buildargs": "\n".join(f"{k}={v}" for k, v in t.get("buildArgs", {}).items()),
                  # OCI refs must be lowercase — hardcode the lowercased owner path
                  # (repository_owner is 'K8squad'; see build-images.yml imgref step).
                  "image": f"ghcr.io/k8squad/toolchains/{t['tool']}",
              })
          print("tools=" + json.dumps(rows, separators=(",", ":")))
          PY
          echo "::notice::toolchain matrix planned from images/toolchains/matrix.json"

      - name: Verify every matrix Dockerfile exists
        run: |
          set -euo pipefail
          echo '${{ steps.matrix.outputs.tools }}' | python3 -c '
          import json, os, sys
          tools = json.loads(sys.stdin.read())
          missing = [t["tool"] for t in tools if not os.path.isfile(t["dockerfile"])]
          if missing:
              print("::error::matrix.json references missing Dockerfiles for: " + ", ".join(missing))
              sys.exit(1)
          print("OK: all " + str(len(tools)) + " matrix Dockerfiles present.")
          '

  build:
    name: toolchain / ${{ matrix.tool }}
    needs: plan
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image }}:${{ matrix.version }}
            ${{ matrix.image }}:sha-${{ github.sha }}
          build-args: ${{ matrix.buildargs }}
          cache-from: type=gha,scope=toolchain-${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ matrix.tool }}

      - name: Resolve pushed image ref (by digest)
        if: github.event_name != 'pull_request'
        id: imgref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Pin every downstream step (SBOM/scan/sign) to the immutable pushed digest —
          # same reason as build-images.yml's imgref step (sha-<short> tags and
          # mixed-case owner paths break syft/trivy/cosign).
          echo "name=${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ matrix.image }}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (Syft)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.imgref.outputs.ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.tool }}.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-toolchain-${{ matrix.tool }}
          path: sbom-${{ matrix.tool }}.spdx.json
          if-no-files-found: ignore

      - name: CVE scan (Trivy) — gate on CRITICAL/HIGH fixable
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.imgref.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # Same single escape hatch as build-images.yml: the curated, expiry-dated
          # .trivyignore validated by security.yml's trivyignore expiry lint.
          trivyignores: .trivyignore

      - name: cosign install
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign + attest SBOM
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          IMG=${{ steps.imgref.outputs.ref }}
          cosign sign --yes "$IMG"
          cosign attest --yes --predicate sbom-${{ matrix.tool }}.spdx.json --type spdxjson "$IMG"

      - name: Attest build provenance (SLSA)
        if: github.event_name != 'pull_request'
        # Keyless (OIDC) SLSA build-provenance attestation on the published digest,
        # pushed to the registry. The toolchain catalog tag is the release artifact,
        # so every publish attests (build-images.yml gates this on v* tags instead).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.imgref.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
