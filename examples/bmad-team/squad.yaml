# ===== 07-project.yaml =====
---
# The repository this squad works on (arch §5.4). Point repo.url at your own
# project and set repo.ref to the branch you want tracked. Goals are injected
# into every Run's context envelope (§8.5).
apiVersion: ksquad.io/v1alpha1
kind: Project
metadata:
  name: bmad-demo-project
  namespace: bmad-squad
spec:
  repo:
    url: https://github.com/K8squad/hello-k8squad
    ref: main
  goals:
    - "Ship the BMAD-method demo following the phased workflow."
    - "Keep every change small, tested, and reviewable."
  # The per-Project workspace PVC (ISI-4127, §9.4): the operator provisions
  # one claim for this Project in each consuming Team's SANDBOX namespace
  # (via the Team's spec.projects ref — 08-team.yaml) and the squad's agent
  # pods mount it shared at /workspace — files persist across pod restarts
  # and pass between agents. Sandbox pods boot in the team namespace
  # (ADR-044 step 9), and PVCs are namespace-scoped, so that is the only
  # place a mount can resolve (ISI-4302).
  # class is optional; empty resolves from the operator's Helm storage
  # contract and fails closed (no cluster-default bind) when that is unset.
  workspacePVC:
    size: 10Gi

# ===== 08-team.yaml =====
---
# The Team composes the flat list of Agents and Projects into one squad
# (arch §5.1, §12.1 — a squad is a namespace). Team.spec.agents is intentionally
# flat: the BMAD reporting hierarchy lives in the role prompts and labels, not
# in a controller relationship.
apiVersion: ksquad.io/v1alpha1
kind: Team
metadata:
  name: bmad-squad
  namespace: bmad-squad
spec:
  namespaceStrategy: dedicated
  projects:
    - name: bmad-demo-project
  agents:
    - name: sam       # CEO
    - name: john      # Product Manager
    - name: winston   # System Architect
    - name: uma       # UX Designer
    - name: mary      # Brainstormer
    - name: cade      # Challenger
    - name: quill     # Content Writer
    - name: amelia    # Code Reviewer
    - name: tess      # Test Architect
    - name: ada       # Coder
    - name: devon     # DevOps Engineer
    - name: otto      # Observability Engineer
    - name: gabi      # Graphical Designer
