name: Security

# Story 14.4 — Half A: the supply-chain gate (§6.1–§6.4, §10.4). Fails the build on:
#   A1 govulncheck   — call-graph-reachable (known-exploitable) Go module vulns
#   A2 npm audit     — high/critical console advisories
#   A3 Trivy         — CRITICAL/HIGH-with-fix fs/config findings (+secret scanner)
#   A4 gitleaks      — any committed secret (working tree on PR, FULL git history on schedule)
#   A5 CodeQL        — SAST alerts (Go + JS/TS)
# The ONLY CVE escape hatch is a checked-in .trivyignore whose entries carry an expiry
# date + written justification, enforced by the trivyignore-lint job below. An expired
# entry is itself a gate failure. The no-softening-lint job asserts nobody reintroduced
# failure-swallowing constructs into either L4 workflow — a green run of this workflow
# means clean, not "ran".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC

permissions:
  contents: read
  actions: read          # codeql-action status/telemetry reads the workflow run
  security-events: write # CodeQL SARIF upload (when GHAS is enabled)

jobs:
  s4-blast-radius-model-gate:
    # Story X.1 / ISI-2240 (arch §4.3, §17.1, S4, NFR-SEC1). DESIGN-LEVEL model gate: falsifies the
    # isolation *model* (hand-authored contained vs porous postures), not the live cluster. Pure
    # stdlib, deterministic, no cluster needed. exit 0 = hostile Run contained + differential teeth
    # intact. Anchoring to parsed config/ manifests + the runtime kind e2e are tracked on ISI-2245.
    name: S4 blast-radius model gate (Story X.1)
    # Self-hosted, like every other Security job: GitHub-hosted `ubuntu-latest` runners are not
    # available to this private repo (CI migrated to the gitrunner fleet, ISI-2602/2644), so a job
    # left on ubuntu-latest never provisions — it fails in ~2s with zero steps (looks like a red
    # assertion but the harness never ran). setup-python below supplies python3 on the runner.
    # (ISI-2656; do not revert to ubuntu-latest.)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - id: guard
        run: |
          f=hack/security/hostile-run-blast-radius-check.py
          if [ -f "$f" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true'
        with:
          python-version: '3.x'
      - name: Run hostile-Run blast-radius falsification harness
        if: steps.guard.outputs.present == 'true'
        run: python3 hack/security/hostile-run-blast-radius-check.py

  trivyignore-lint:
    name: trivyignore (expiry lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint .trivyignore (expiry + justification on every entry)
        run: |
          python3 - <<'PY'
          import datetime as dt
          import re
          import sys

          path = ".trivyignore"
          try:
              lines = open(path, encoding="utf-8").read().splitlines()
          except FileNotFoundError:
              print(f"::error::{path} is missing — the curated CVE escape hatch must exist "
                    "(seeded empty is fine; absent is not).")
              sys.exit(1)

          today = dt.date.today()
          errors = []
          expires_re = re.compile(r"expires:(\d{4}-\d{2}-\d{2})")
          date_re = re.compile(r"^\d{4}-\d{2}-\d{2}$")

          prev_comment = None
          for i, raw in enumerate(lines, 1):
              line = raw.strip()
              if line.startswith("#"):
                  prev_comment = line
                  # Even a comment-only expiry marker must not be stale — an expired
                  # suppression is a gate failure no matter how it is formatted.
                  for m in expires_re.finditer(line):
                      d = m.group(1)
                      if not date_re.match(d):
                          errors.append(f"line {i}: malformed expiry date '{d}'")
                      elif dt.date.fromisoformat(d) < today:
                          errors.append(f"line {i}: entry expired on {d} — remove, renew, or re-justify")
                  continue
              if not line:
                  continue
              # A live suppression entry (CVE/misconf id). It is only valid when the
              # comment line directly above it carries BOTH an expiry date and a
              # written justification (reviewed-like-code discipline, §6.2).
              if prev_comment is None or "justification:" not in prev_comment:
                  errors.append(f"line {i}: '{line}' lacks a preceding justification: comment")
              if prev_comment is None or not expires_re.search(prev_comment):
                  errors.append(f"line {i}: '{line}' lacks a preceding expires:YYYY-MM-DD date")

          if errors:
              for e in errors:
                  print(f"::error::trivyignore: {e}")
              sys.exit(1)
          print("trivyignore lint: no entries past expiry, every entry justified and dated.")
          PY

  no-softening-lint:
    name: no-softening (L4 teeth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert no failure-swallowing softening in the L4 workflows
        run: |
          # Patterns are assembled by concatenation so this lint's own source text
          # never contains the literals it greps for (a naive self-match would make
          # the check worthless). `if grep` uses the exit status directly — the
          # lint itself must not be softened either.
          files=(.github/workflows/security.yml .github/workflows/blast-radius.yml)
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::expected L4 workflow $f not found"; exit 1; }
          done
          p1='continue''-on-''error'
          p2='|''| true'
          p3='set ''+e'
          if grep -n -F -e "$p1" -e "$p2" -e "$p3" "${files[@]}"; then
            echo "::error::softening found in an L4 workflow — a green Security run must mean clean, not 'ran'. Remove it."
            exit 1
          fi
          echo "no-softening lint: both L4 workflows fail loud."

  govulncheck:
    name: govulncheck (Go modules)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - id: guard
        run: |
          if [ ! -f go.mod ]; then echo "present=false" >> "$GITHUB_OUTPUT"; else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v6
        if: steps.guard.outputs.present == 'true'
        with:
          # Match the module's declared Go version (go.mod) rather than `stable`, so the
          # toolchain govulncheck builds against is consistent with the rest of CI (ISI-2543).
          go-version-file: go.mod
      - name: Run govulncheck
        if: steps.guard.outputs.present == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  npm-audit:
    name: npm audit (console)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - id: guard
        run: |
          if [ ! -f console/package.json ] && [ ! -f package.json ]; then echo "present=false" >> "$GITHUB_OUTPUT"; else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: 24
      - name: Audit
        if: steps.guard.outputs.present == 'true'
        run: npm audit --audit-level=high

  trivy-fs:
    name: Trivy (filesystem + config)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - name: Trivy fs scan
        # v0.36.0 pins its setup-trivy dependency by commit SHA; older tags (e.g. v0.28.0)
        # pin aquasecurity/setup-trivy@v0.2.1, which was deleted upstream and no longer
        # resolves — breaking the job at "Set up job" before any step runs.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # The ONLY suppression path: the curated, expiry-dated .trivyignore
          # (validated by the trivyignore-lint job above).
          trivyignores: .trivyignore

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for the scheduled git-history scan
      # Run the gitleaks CLI directly rather than gitleaks/gitleaks-action, whose v2
      # requires a paid GITLEAKS_LICENSE for organization repos. The CLI (Apache-2.0)
      # has no such gate. Exits non-zero on any finding.
      #
      # Scan scope (§6.4): working tree on PR/push; the FULL git history on the
      # weekly schedule — a secret deleted in a later commit still leaked and must
      # fail the scheduled gate.
      - name: Run gitleaks (CLI, no org license)
        run: |
          args=(detect --source=/repo --redact --verbose --exit-code=1)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "schedule trigger: scanning FULL git history"
            docker run --rm -v "${{ github.workspace }}:/repo" \
              ghcr.io/gitleaks/gitleaks:v8.21.2 "${args[@]}"
          else
            echo "${{ github.event_name }} trigger: scanning working tree"
            docker run --rm -v "${{ github.workspace }}:/repo" \
              ghcr.io/gitleaks/gitleaks:v8.21.2 "${args[@]}" --no-git
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v5

      - name: Skip if analyzed source is absent (skeleton phase)
        id: guard
        run: |
          # CodeQL autobuild/analyze fails hard ("No source code was seen") on an empty
          # skeleton. Gate each language on its source landing — skip-with-reason until then.
          present=false
          case "${{ matrix.language }}" in
            go)
              [ -f go.mod ] && present=true ;;
            javascript-typescript)
              if [ -f console/package.json ] || [ -f package.json ] \
                 || [ -n "$(git ls-files '*.js' '*.ts' '*.tsx' '*.jsx' '*.mjs' '*.cjs' | head -1)" ]; then
                present=true
              fi ;;
          esac
          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [ "$present" = "false" ]; then
            echo "::notice::${{ matrix.language }} source not present yet — CodeQL skipped."
          fi

      # The self-hosted runner ships no language runtimes on PATH (ubuntu-latest did), so the
      # CodeQL extractors fail: Go with "Unable to locate executable file: go" and TS with
      # "Could not start Node.js. It is required for TypeScript extraction." Provide each
      # language's runtime before extraction. Go uses build-mode autobuild (the tree compiles —
      # govulncheck's `go build ./...` is green); Go does NOT support build-mode none. JS/TS uses
      # build-mode none but still needs `node` on PATH for TS type extraction. (ISI-2644)
      - uses: actions/setup-go@v6
        if: steps.guard.outputs.present == 'true' && matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.present == 'true' && matrix.language == 'javascript-typescript'
        with:
          node-version: 24
      - uses: github/codeql-action/init@v3
        if: steps.guard.outputs.present == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/autobuild@v3
        if: steps.guard.outputs.present == 'true' && matrix.language == 'go'
      # upload:false — SARIF upload to code scanning requires GitHub Advanced
      # Security, which is not enabled on this private repo (and cannot be
      # enabled via token: billing-level setting). The analyze step hard-fails
      # with "Resource not accessible by integration" otherwise. Analysis still
      # runs; results are attached as workflow artifacts. To restore native
      # code-scanning alerts: enable Advanced Security under repo Settings →
      # Code security, then remove `upload: false` and the artifact step.
      - uses: github/codeql-action/analyze@v3
        if: steps.guard.outputs.present == 'true'
        with:
          upload: false
          output: ${{ runner.temp }}/sarif/${{ matrix.language }}.sarif
      - name: Attach SARIF artifact (GHAS unavailable)
        if: steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/sarif/${{ matrix.language }}.sarif
          if-no-files-found: ignore
