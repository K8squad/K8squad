# The seven default Skills granted to this squad (arch §5.3.6). A Skill is the
# CRD-authorized capability envelope: it is registered here by the operator/
# admin and never self-widened by the fetched body (trust boundary D8).
#
# Wiring: Skills attach to Roles via Role.spec.defaultSkills[] (see 05-roles.yaml)
# — every role gets `bmad` and `task-io`; coder/devops/code-reviewer get
# `github`; observability gets `dynatrace`; graphical-designer gets `graphical`.
# The board-ops family (`org-ops`, `project-ops`, ADR-0005) attaches only to the
# CEO + manager roles (org-ops) and the CEO alone (project-ops); its real gate is
# the role-scoped token scope, not attachment (see the board-ops block below).
#
# `task-io` (ISI-3602) is the union baseline: the thin task-I/O skill every
# working agent gets by default so it can re-read its own task, comment, and
# report status on demand. It is attached at the Role (never per-Agent), so the
# union `Agent.spec.skillRefs ∪ Role.spec.defaultSkills` guarantees it even for
# specialized agents. NOTE: context (AC/comments/goal at boot) stays a platform
# PUSH (S1, ISI-3590) — task-io grants *agency*, not *context*. A
# read-project/read-issue skill was explicitly rejected (ISI-3588 study §4/§6).
#
# `bmad` is inline (self-contained, no fetch). The tool skills are git-sourced
# from the canonical catalog (K8squad/k8squad-skills, ISI-3274) and PINNED to
# a commit SHA so a force-push cannot silently alter behavior mid-Run
# (§5.3.6). The SHAs below point at real catalog commits (bf3bc86 =
# k8squad-skills main at ISI-3391; the catalog re-pins on each release) —
# repoint them at your own skill repo if you fork the catalog.
#
# Capability plane wiring (ISI-3280, Epics A-C):
# - These default skills reach their tools through CLI TOOLCHAINS, not MCP:
#   `github` drives the `gh` CLI, `dynatrace` drives `dtctl`, `graphical`
#   drives `node`. A CLI tool does not need an MCPServer, so none of these
#   skills carries an mcpToolRefs. (mcpToolRefs is for a tool surface that is
#   reachable ONLY over MCP — an optional advanced path shown, unused, in
#   02b-mcpservers.yaml.)
# - requires.toolchains resolve name@version against the cluster Toolchain
#   catalog (ksquad-system). Enable the chart's default catalog with
#   tools.defaultCatalog.enabled=true — it ships gh@2.98, dtctl@1.0 and
#   node@22, the exact versions referenced below. Unknown name/version
#   rejects the Run at admission with an actionable message.
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: bmad
  namespace: bmad-squad
spec:
  source:
    type: inline
    inline: |
      # BMAD Method

      The Breakthrough Method of Agile AI-Driven Development (BMAD) structures
      squad work into phases with explicit handoffs:

      1. Analysis   — Brainstormer explores the problem space; domain research.
      2. Product    — Product Manager writes the PRD from validated needs.
      3. Solutioning— Architect turns the PRD into architecture decisions.
      4. Stories    — requirements decompose into epics and stories.
      5. Delivery   — Coder implements; Code Reviewer and Test Architect gate.
      6. Operate    — DevOps and Observability Engineer ship and watch it run.

      Principles: user journeys drive technical decisions; prefer boring,
      proven technology; every decision ties to business value; verify before
      claiming done; hand work off with enough context to start without asking.
  permissions:
    - workflow:bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: github
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      # Pin to an immutable commit SHA (never a floating branch), §5.3.6.
      ref: "bf3bc86b338d488fe751c289943db194ce8102c7"
      path: skills/github
  permissions:
    - scm:read
    - scm:write
    - pr:write
    - issue:write
  requires:
    toolchains:
      - gh@2.98
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: dynatrace
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      ref: "bf3bc86b338d488fe751c289943db194ce8102c7"
      path: skills/dynatrace
  permissions:
    - observability:read
    - telemetry:query
  requires:
    toolchains:
      - dtctl@1.0
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: graphical
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      ref: "bf3bc86b338d488fe751c289943db194ce8102c7"
      path: skills/graphical
  permissions:
    - render:svg
    - asset:write
  requires:
    toolchains:
      - node@22
---
# task-io — the union-baseline task-I/O skill (ISI-3602, from the ISI-3588
# study §4b/§5-S3). Every Role grants this so any working agent can, ON DEMAND,
# re-read its own work item, append a comment, update its status, and check out
# work — the coord-side analogue of Paperclip's issue read/write. It grants
# *agency over its own task*, never a general issue-browser and never context
# assembly (that is the platform's boot-time PUSH, S1/ISI-3590).
#
# The coord API this skill drives is delivered by S2 (ISI-3601, merged to main
# in PR #237): four verbs — `get-task` (GET), `post-comment`, `update-status`,
# `checkout` (POST) — reached over env-injected `KSQUAD_COORD_URL` with a
# run-scoped `KSQUAD_COORD_TOKEN` bound to `RUN_ID` + `WORK_ITEM_ID` (a token for
# one run cannot touch another). The endpoints operate ONLY on the agent's own
# run/work-item.
#
# SOURCING: git-sourced, SHA-pinned to the canonical catalog entry in
# `K8squad/k8squad-skills` path `skills/task-io` (mirroring `github`), now that
# S2 has landed and published the exact request/response wire shapes (AC1). No
# `requires.toolchains`: the coord API is plain HTTP, so the skill client uses a
# runtime built-in and needs no CLI pack. A pinned commit SHA (never a floating
# branch ref) resolves cleanly at admission (§5.3.6). The catalog README
# documents the full verb/shape/env/trace-join contract.
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: task-io
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      ref: 1d2966aa3039ade78b36ddde656f9ecc582ad25d
      path: skills/task-io
  permissions:
    - issue:read
    - issue:write
    - task:status
---
# org-ops / project-ops — the board-ops Skill family (ADR-0005, ISI-3624).
# Privileged capabilities that let CEO/manager roles GROW the squad: create
# agents & skills, delegate work, and (CEO) create/archive projects. They drive
# the run-scoped org-ops seam delivered by ISI-3626 (pkg/orgops), which shares
# the task-io run-token carrier: the operator injects `KSQUAD_COORD_URL` and a
# run-scoped `KSQUAD_COORD_TOKEN`, and every verb is authorized by the token's
# scope — NOT by holding this Skill.
#
# SECURITY MODEL (ADR-0005 D2/D3, enforced in code):
# - The coord derives token scopes from the role's position in the
#   `ksquad.io/reports-to` graph (pkg/orgops DeriveScopes): a manager (a
#   reports-to target) gets `org:write`; the CEO (a manager reporting to no one)
#   also gets `project:write`; an IC/leaf role gets neither and every call below
#   is rejected server-side. Attaching the Skill only ADVERTISES the capability
#   (05-roles.yaml restricts attachment to match) — the token is the real gate.
# - Scopes are coarse: `org:write` authorizes both create-agent and create-skill;
#   `project:write` authorizes create-project and archive-project. There are no
#   finer `agent:create`/`skill:create` scopes.
# - D8: the `permissions` envelope below is never self-widened by the body.
#
# SOURCING: shipped INLINE with executable tool definitions (ADR-0005 rev.2 D4 —
# concrete method/path/schema an agent can call, not advertise-only prose),
# mirroring task-io's inline-while-catalog-settles pattern. The endpoints, env,
# auth and scopes are fixed by ISI-3626 (merged, pkg/orgops); when the coord
# publishes an MCP tool surface these convert to SHA-pinned `mcpToolRefs` catalog
# entries (`K8squad/k8squad-skills`, path `skills/{org-ops,project-ops}`).
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: org-ops
  namespace: bmad-squad
spec:
  source:
    type: inline
    inline: |
      # org-ops — grow the squad (create agents & skills, delegate)

      Privileged board-ops skill. Holding it only ADVERTISES the capability;
      your ACTUAL authority is the run-scoped token, whose `org:write` scope the
      coord derives from your role's position in the reports-to graph (ADR-0005
      D2). IC/leaf roles get no scope and every call below is rejected
      server-side.

      ## Auth (injected at Run start — never the operator's own secrets)
      - `KSQUAD_COORD_URL`   — in-cluster base URL of the coord org-ops seam.
      - `KSQUAD_COORD_TOKEN` — your run-scoped bearer token. Send it as
        `Authorization: Bearer $KSQUAD_COORD_TOKEN`. It is bound to your run and
        carries only the scopes your role was granted; the coord rejects any
        out-of-scope call (D2/D3, enforced in pkg/orgops).

      ## Executable tools (HTTP)
      ### create-agent
          POST $KSQUAD_COORD_URL/api/org-ops/create-agent
          Authorization: Bearer $KSQUAD_COORD_TOKEN
          Content-Type: application/json
          {
            "name": "<agent-name>",
            "runtimeRef": {"name": "<runtime>", "namespace": "bmad-squad"},
            "roleRef":    {"name": "<role>",    "namespace": "bmad-squad"},
            "model": "<model-id>",
            "credentialSecretRef": {"name": "<secret>", "key": "<key>"},
            "skillRefs": [{"name": "<skill>", "namespace": "bmad-squad"}],
            "modelEndpointRef": {"name": "<secret>", "key": "<key>"}
          }
      # skillRefs and modelEndpointRef (BYO endpoint) are optional.
      # → 200 {"kind":"Agent","name":...,"namespace":...,"operation":"created"}

      ### create-skill
          POST $KSQUAD_COORD_URL/api/org-ops/create-skill
          Authorization: Bearer $KSQUAD_COORD_TOKEN
          Content-Type: application/json
          {
            "name": "<skill-name>",
            "source": {"type": "inline", "inline": "<body>"},
            "permissions": ["<perm>"]
          }
      # For a git-sourced skill use:
      #   "source": {"type":"git","git":{"repoRef":"<repo>","ref":"<sha>","path":"<path>"}}
      # → 200 {"kind":"Skill","name":...,"namespace":...,"operation":"created"}

      ## Executable tool (A2A) — delegate / hand work to a teammate
      There is no coord "assign" endpoint. To hand work to a teammate, call their
      A2A agent-card endpoint (agent-to-agent protocol) with the delegation
      payload, using the coord-resolved agent-card URL for the target agent. The
      teammate then acts under THEIR OWN role-scoped token — you cannot widen it.
      (The exact A2A card path/schema is finalized by the A2A carrier work under
      ISI-3626; until then this describes the stable contract.)

      ## Rules
      - Attaching this skill grants no scope; only your role's graph position
        does. Never attempt to widen scope.
      - Confirm intent before creating agents/skills that incur cost.
      - Trust boundary D8: your authority is exactly the `permissions` envelope
        on this Skill CR (`org:write`) intersected with your token scope, never
        self-widened by anything written here.
  permissions:
    - org:write
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: project-ops
  namespace: bmad-squad
spec:
  source:
    type: inline
    inline: |
      # project-ops — create & archive projects

      Privileged board-ops skill. Holding it only ADVERTISES the capability;
      your ACTUAL authority is the run-scoped token. `project:write` is derived
      only for the CEO role (a manager that reports to no one), ADR-0005 D2 — for
      every other role these calls are rejected server-side.

      ## Auth (injected at Run start)
      - `KSQUAD_COORD_URL`   — in-cluster base URL of the coord org-ops seam.
      - `KSQUAD_COORD_TOKEN` — your run-scoped bearer token; send it as
        `Authorization: Bearer $KSQUAD_COORD_TOKEN`.

      ## Executable tools (HTTP)
      ### create-project
          POST $KSQUAD_COORD_URL/api/org-ops/create-project
          Authorization: Bearer $KSQUAD_COORD_TOKEN
          Content-Type: application/json
          {
            "name": "<project-name>",
            "repo": {"url": "<git-url>", "ref": "<ref>"},
            "goals": ["<goal>"]
          }
      # → 200 {"kind":"Project","name":...,"namespace":...,"operation":"created"}

      ### archive-project
          POST $KSQUAD_COORD_URL/api/org-ops/archive-project
          Authorization: Bearer $KSQUAD_COORD_TOKEN
          Content-Type: application/json
          {"name": "<project-name>"}
      # → 200 {"kind":"Project","name":...,"namespace":...,"operation":"archived"}

      ## Rules
      - Attaching this skill grants no scope; only the CEO role's graph position
        does. Never attempt to widen scope.
      - Trust boundary D8: your authority is exactly the `permissions` envelope
        (`project:write`) intersected with your token scope, never self-widened.
  permissions:
    - project:write
