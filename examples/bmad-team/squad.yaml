# One Agent per Role — the concrete squad members. Each Agent binds a model +
# credential to a Role and Runtime. Skills are inherited from the Role's
# spec.defaultSkills (05-roles.yaml) unless the Agent sets its own
# spec.skillRefs — which *replaces* (does not merge with) the role defaults.
#
# Most members leave skillRefs unset and inherit the role defaults. The four
# members that carry a specialist dev/debug Skill (ISI-3273) — amelia
# (golangci-lint), ada (golangci-lint + container-build + delve-pprof), devon
# (container-build), otto (delve-pprof) — therefore enumerate their FULL skill
# set in skillRefs, since a partial skillRefs would drop bmad/github/dynatrace.
#
# Models: opus for the strategic/heavy-reasoning roles (CEO, PM, Architect),
# sonnet for the rest. credentialClass defaults to service-account.
