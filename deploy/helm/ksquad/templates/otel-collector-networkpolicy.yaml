{{- /*
  Collector gateway NetworkPolicy — Story 13.7, obs-plan §10 "egress interaction".

  This is the collector-SIDE half of the telemetry path inside the tenancy model:
  - INGRESS: squad-namespace shim/agent OTLP (4317/4318) may reach the gateway,
    plus in-cluster Prometheus scrape of the exporter (8889). The squad-SIDE
    allowlist (each Project's default-deny egress carving a hole TO this Service)
    is stamped by the operator from egress.yaml — obs-plan §10 flags this as an
    explicit input to internal/tenancy NetworkPolicy templates (§11.1 arch).
  - EGRESS: DNS, control-plane scrape targets in the release namespace, and the
    governed hop to the vendor backend (443/TCP). Sandboxes never get this hop —
    only the gateway does, keeping telemetry INSIDE the isolation model (§9.2 arch).
*/ -}}
{{- if and .Values.observability.collector.enabled .Values.observability.collector.networkPolicy.enabled -}}
{{- $name := include "ksquad.otel-collector.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ksquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: otel-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OTLP push from squad-tenant namespaces (label-selected) — the shim/agent path.
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.observability.collector.networkPolicy.squadNamespaceLabel.key }}: {{ .Values.observability.collector.networkPolicy.squadNamespaceLabel.value | quote }}
        # Control-plane self-telemetry (operator/apiserver/etc.) from this namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Prometheus scrape of the collector's own exporter (8889) — any namespace.
    - ports:
        - protocol: TCP
          port: 8889
  egress:
    # DNS resolution (always).
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Scrape control-plane /metrics in the release namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    {{- if .Values.observability.collector.networkPolicy.vendorEgress.enabled }}
    # Governed hop to the vendor OTLP backend. Cluster-internal CIDRs are the
    # sandbox/pod ranges — the vendor is external, so this allows the configured
    # port to destinations OUTSIDE the excluded (in-cluster) ranges only.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.observability.collector.networkPolicy.vendorEgress.exceptCIDRs | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.observability.collector.networkPolicy.vendorEgress.port }}
    {{- end }}
{{- end }}
