# Story 1.3: service exposing the validating admission webhook server.
# The webhook binary serves on 9443 with certs mounted at
# /tmp/k8s-webhook-server/serving-certs (kubebuilder convention).
apiVersion: v1
kind: Service
metadata:
  name: ksquad-webhook-service
  namespace: system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: ksquad-webhook
