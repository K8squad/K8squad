apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-devops-engineer-role
  annotations:
    description: "Backup DevOps Engineer role with comprehensive disaster recovery and backup operations capabilities"
    created-by: "ISI-2677 Emergency Restoration"
    restored-date: "2026-08-16"
    prompt-template: "backup-devops-engineer-prompt"
    backup-operations: "backup-operations"
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "namespaces"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "persistentvolumes"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "issuers", "clusterissuers"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors", "prometheuses", "alertmanagers"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["operator.openshift.io"]
  resources: ["etcds", "clusterversions"]
  verbs: ["get", "list"]
- apiGroups: ["cloud.redhat.com"]
  resources: ["odfbrstorageclusters"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["nvidia.com"]
  resources: ["gpuclustertemplates", "gpucrds"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-devops-engineer-binding
  annotations:
    description: "Binding for backup-devops-engineer service account"
    created-by: "ISI-2677 Emergency Restoration"
    restored-date: "2026-08-16"
subjects:
- kind: ServiceAccount
  name: backup-devops-engineer
  namespace: default
roleRef:
  kind: ClusterRole
  name: backup-devops-engineer-role
  apiGroup: rbac.authorization.k8s.io