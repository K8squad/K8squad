# BYO model credential the Codex Agent authenticates with (arch §11 / ADR-010,
# ADR-045: secret material never rides the CRD, always a per-user Secret).
#
# Codex is OpenAI's official Rust coding agent and speaks the OpenAI wire
# natively, so a SERVICE-ACCOUNT credential is a long-lived OpenAI API key that
# the credential-injection contract (pkg/credinject) maps onto the runtime's
# native env var OPENAI_API_KEY — selected by the Agent's
# spec.credentialClass: service-account (06-agent.yaml).
#
# There is deliberately NO human-seat path for codex in v1: a human-seat class
# on a codex Agent fails CLOSED (ISI-3647 S9, ToS-gated auth.json), it does not
# silently fall back to this API-key row.
#
# Replace REPLACE_ME with a real OpenAI API key before pointing the squad at
# anything.
apiVersion: v1
kind: Secret
metadata:
  name: openai-credentials
  namespace: codex-squad
type: Opaque
stringData:
  token: "REPLACE_ME"
