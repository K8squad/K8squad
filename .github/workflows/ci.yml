name: CI

# Lint + build + unit/integration test + coverage, as a per-component matrix.
# Each component leg is an independent required status check.
# Action majors are pinned to the Node 24 runtime (Node 20 runtimes are deprecated).
#
# Story 14.7 (ISI-2742): the per-component fan-out is derived from the REUSABLE
# `component-matrix.yml` workflow so the component list is declared in exactly one place
# and shared with every downstream lane (L5 e2e, supply-chain, Ollama — 14.5/14.6/14.8).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for the component fan-out. Emits typed JSON matrices that the
  # legs below consume via fromJSON(). Runs on a GitHub-hosted runner so it never eats a
  # self-hosted slot.
  components:
    uses: ./.github/workflows/component-matrix.yml

  go:
    name: go / ${{ matrix.component }}
    needs: components
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.components.outputs.go) }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip if component source is absent (skeleton phase)
        id: guard
        run: |
          if [ ! -d "${{ matrix.path }}" ] && [ ! -f go.mod ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.component }} source not present yet — skeleton lane skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        if: steps.guard.outputs.present == 'true'
        with:
          # Pin the toolchain to the module's declared Go version (go.mod) instead of
          # `stable`. `stable` resolves to the newest runner Go (1.26.x), whose stdlib
          # ships go1.26-guarded files that the golangci-lint binary (built with an older
          # Go) cannot typecheck — producing false "file requires newer Go version" and
          # apimachinery deepcopy typecheck errors in dependency code (ISI-2543). Reading
          # the version from go.mod keeps the lint typechecker and toolchain in lockstep.
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        if: steps.guard.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v7
        # Memory cap for the self-hosted gitrunner (7.8 GB VM). Unbounded, golangci-lint
        # peaked ~7.7 GB RSS / 16-18 GB vm and triggered a global OOM-kill of the runner
        # (ISI-2614, parent ISI-2612). Host-side GOMEMLIMIT alone is a soft limit and can't
        # cap a >6 GiB live working set, so we constrain the job itself:
        #   - --concurrency=1 serialises the per-package analysis passes (the dominant
        #     memory driver) so peak live set stays ~1 package instead of NPROC packages.
        #   - GOMAXPROCS=1 keeps the Go runtime from spawning per-CPU worker heaps.
        #   - GOGC=30 / GOMEMLIMIT=3800MiB make GC aggressive well under the 6.8 G cgroup cap.
        #   - --timeout 10m because serial analysis is slower.
        env:
          GOMAXPROCS: "1"
          GOGC: "30"
          GOMEMLIMIT: "3800MiB"
        with:
          # lint v2 line: built with go >= 1.25, required since the module targets go 1.25.
          # v1.64.x is built with go1.24 and refuses to load a go 1.25 module.
          # Note: lint v2 requires golangci-lint-action v7 (ISI-2566).
          version: v2.12.2
          args: --timeout=10m --concurrency=1

      - name: Build
        if: steps.guard.outputs.present == 'true'
        run: go build ./...

      - name: Test (race + coverage)
        if: steps.guard.outputs.present == 'true'
        run: go test -race -covermode=atomic -coverprofile=coverage-${{ matrix.component }}.out ./...

      - name: Coverage gate (interim ratchet floor — target 80%, ISI-2714)
        if: steps.guard.outputs.present == 'true'
        env:
          # Interim ratchet floor. The historical ">=80% / >=90% pkg/coord" target was
          # never actually enforced on real code: CI was red at the *lint* step from the
          # skeleton-era green (CI #5, 2026-08-12) through ISI-2692, so this coverage step
          # never once ran on the merged event-seam/coord code. Fixing lint (ISI-2692)
          # exposed the true baseline: 30.1% over hand-written code (35.9% if generated
          # code is counted — see below). The flat 80% is not currently satisfiable here:
          #   1. This unit lane runs `go test ./...` with NO Postgres, so DB-backed code
          #      (pkg/coord resume/store 12.9%, pkg/events store/listen/publisher) cannot
          #      be covered here — it belongs to the integration/e2e lane (ISI-2714).
          #   2. We exclude generated code (api/v1alpha1/zz_generated.deepcopy.go) from the
          #      metric so the gate measures *authored* code, not codegen. That file is
          #      52.3% covered incidentally, so excluding it LOWERS the number from 35.9%
          #      to the honest 30.1% — the metric now reflects real test debt, not codegen.
          # Floor is the current honest hand-written baseline. Ratcheting up to 80%
          # (adding unit tests + a DB-backed coverage lane) is tracked in ISI-2714.
          # Do NOT lower this number; raise it as coverage improves.
          COVERAGE_FLOOR: "30"
        run: |
          # Exclude generated files from the profile before scoring (the `mode:` header
          # line has no path and is preserved).
          grep -v -E '/zz_generated[^:]*\.go:' "coverage-${{ matrix.component }}.out" > coverage.filtered.out
          go tool cover -func=coverage.filtered.out | tee coverage.txt
          total=$(grep -E '^total:' coverage.txt | awk '{print $3}' | tr -d '%')
          echo "total coverage (excl. generated): ${total}%  (floor: ${COVERAGE_FLOOR}%)"
          awk -v t="$total" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (t+0 < floor+0) { printf "coverage %.1f%% below %s%% ratchet floor\n", t+0, floor; exit 1 }
          }'

      - name: Upload coverage
        if: steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.component }}
          path: coverage-${{ matrix.component }}.out
          if-no-files-found: ignore

  migrations:
    name: db / migrations self-check
    runs-on: [self-hosted, linux, x64]
    # Applies every forward-only migration to a real Postgres and runs each *_test.sql self-check
    # (e.g. the coord schema's 7+ structural assertions). Keeps the runnable checks from rotting.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ksquad
          POSTGRES_PASSWORD: ksquad
          POSTGRES_DB: ksquad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ksquad -d ksquad_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Skip if no migrations present (skeleton phase)
        id: guard
        run: |
          if [ ! -d db/migrations ] || [ -z "$(ls -A db/migrations/*.sql 2>/dev/null)" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::db/migrations not present yet — self-check lane skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # The self-hosted runner image does not ship the postgresql client (ubuntu-latest
      # did — this lane broke with exit 127 "psql: command not found" after the ISI-2602
      # runner migration). Install it on demand; no-op once the runner is warmed. (ISI-2644)
      - name: Ensure psql client is present
        if: steps.guard.outputs.present == 'true'
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Apply migrations + run self-checks
        if: steps.guard.outputs.present == 'true'
        env:
          DATABASE_URL: postgres://ksquad:ksquad@localhost:5432/ksquad_test
        run: |
          set -euo pipefail
          # Apply migrations in version order (persisted), then run each companion *_test.sql against
          # the applied schema. Each test wraps its assertions in BEGIN/ROLLBACK so it leaves no residue.
          for f in $(ls db/migrations/*.sql | grep -v '_test\.sql$' | sort); do
            echo "== applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          for t in $(ls db/migrations/*_test.sql 2>/dev/null | sort); do
            echo "== self-check $t"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$t"
          done

  shim:
    name: shim / ${{ matrix.runtime }}
    needs: components
    runs-on: [self-hosted, linux, x64]
    # Per-runtime A2A shim matrix (Story 14.7 "+ shim matrix"). Every shim speaks the same
    # A2A wire spine (Epic 5), so each runtime adapter is lint+build+test'd independently and
    # is its own required check. Guarded on the specific shim source path (NOT go.mod) so the
    # leg genuinely skip-with-reasons until a given runtime's shim lands — no false green.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.components.outputs.shims) }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip if shim source is absent (skeleton phase)
        id: guard
        run: |
          # Probe the runtime's own entrypoint dir; fall back to a pkg/shim/<runtime> layout.
          if [ ! -d "${{ matrix.path }}" ] && [ ! -d "pkg/shim/${{ matrix.runtime }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::shim '${{ matrix.runtime }}' source not present yet — skeleton lane skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        if: steps.guard.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        if: steps.guard.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v7
        # Same OOM containment as the go leg (ISI-2614/ISI-2612): serial analysis under the
        # self-hosted gitrunner's cgroup cap.
        env:
          GOMAXPROCS: "1"
          GOGC: "30"
          GOMEMLIMIT: "3800MiB"
        with:
          version: v2.12.2
          args: --timeout=10m --concurrency=1

      - name: Build
        if: steps.guard.outputs.present == 'true'
        run: go build ./...

      - name: Test (race)
        if: steps.guard.outputs.present == 'true'
        run: go test -race ./...

  helm:
    name: helm / ${{ matrix.chart }}
    needs: components
    runs-on: [self-hosted, linux, x64]
    # Helm chart lint + render gate. `helm lint` catches schema/values regressions and
    # `helm template` proves the chart renders to valid manifests (fail-closed on template
    # errors). Helm is installed as a pinned binary rather than via a marketplace action so
    # there is no Node-runtime action to age out of the Node 24 requirement.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.components.outputs.helm) }}
    env:
      HELM_VERSION: v3.16.4
    steps:
      - uses: actions/checkout@v5

      - name: Skip if chart is absent (skeleton phase)
        id: guard
        run: |
          if [ ! -f "${{ matrix.path }}/Chart.yaml" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::chart '${{ matrix.chart }}' (${{ matrix.path }}) not present yet — skeleton lane skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install helm (pinned)
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          if helm version --short 2>/dev/null | grep -q "${HELM_VERSION}"; then
            echo "helm ${HELM_VERSION} already present"; exit 0
          fi
          tmp="$(mktemp -d)"
          curl -sSfL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "$tmp/helm.tgz"
          tar -xzf "$tmp/helm.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/linux-amd64/helm" /usr/local/bin/helm
          helm version --short

      - name: helm lint
        if: steps.guard.outputs.present == 'true'
        run: helm lint "${{ matrix.path }}"

      - name: helm template (render self-check)
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          # Render with defaults; fail closed on any template/schema error. CRDs live under
          # crds/ and are installed by Helm out-of-band, so --include-crds keeps the render
          # representative of an install.
          helm template ksquad-ci "${{ matrix.path }}" --include-crds > /dev/null
          echo "chart '${{ matrix.chart }}' renders clean"

  node:
    name: node / ${{ matrix.component }}
    needs: components
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.components.outputs.node) }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip if console source is absent (skeleton phase)
        id: guard
        run: |
          if [ ! -f "${{ matrix.path }}/package.json" ] && [ ! -f package.json ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.component }} source not present yet — skeleton lane skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.guard.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.guard.outputs.present == 'true'
        run: npm run lint

      - name: Test (coverage)
        if: steps.guard.outputs.present == 'true'
        run: npm test -- --coverage
