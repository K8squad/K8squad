{{- if .Values.exposure.gateway.enabled -}}
{{- $g := .Values.exposure.gateway -}}
{{- $ns := include "k8squad.namespace" . -}}
{{- /* Serving listener: prefer https when enabled, else http. */ -}}
{{- $serveSection := ternary "https" "http" $g.listeners.https.enabled -}}
{{- /* Hostnames are OPTIONAL (ISI-3515): omit `hostnames` to expose by IP. To
       let console + apiserver coexist on ONE address the apiserver is matched
       on its natural `/api` prefix when it has no hostname of its own; with a
       dedicated hostname it takes `/`. Gateway API precedence (hostname
       specificity first, then path length) keeps every combination correct. */ -}}
{{- $apiHasHost := not (empty $g.hostnames.apiserver) -}}
{{- $apiPath := ternary "/" "/api" $apiHasHost -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ksquad-console
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "console") | nindent 4 }}
spec:
  parentRefs:
    - name: ksquad
      sectionName: {{ $serveSection }}
  {{- if $g.hostnames.console }}
  hostnames:
    - {{ $g.hostnames.console | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ksquad-console
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ksquad-apiserver
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "apiserver") | nindent 4 }}
spec:
  parentRefs:
    - name: ksquad
      sectionName: {{ $serveSection }}
  {{- if $apiHasHost }}
  hostnames:
    - {{ $g.hostnames.apiserver | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $apiPath | quote }}
      # SSE PRESERVATION (§13): request timeout 0s disables the route timeout so
      # a long-lived progress stream is never cut. HTTPRoute.timeouts is Extended
      # conformance — kgateway/Envoy-based classes honor 0s; verify per class.
      timeouts:
        request: "0s"
        backendRequest: "0s"
      backendRefs:
        - name: ksquad-apiserver
          port: 8080
{{- if and $g.httpsRedirect $g.listeners.http.enabled $g.listeners.https.enabled }}
---
{{/* Edge http→https redirect on the http listener (values-driven). Hostnames
     are optional here too — omitted → redirect every host reaching the IP. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ksquad-https-redirect
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "exposure") | nindent 4 }}
spec:
  parentRefs:
    - name: ksquad
      sectionName: http
  {{- if or $g.hostnames.console $g.hostnames.apiserver }}
  hostnames:
    {{- with $g.hostnames.console }}
    - {{ . | quote }}
    {{- end }}
    {{- with $g.hostnames.apiserver }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
