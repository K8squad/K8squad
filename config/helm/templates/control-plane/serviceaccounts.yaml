{{- if .Values.controlPlane.enabled }}
{{- $ns := include "k8squad.namespace" . }}
{{- range $c := list "operator" "apiserver" "console" "memory" "scm-webhook" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ksquad-{{ $c }}
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
{{- with $.Values.controlPlane.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- if .Values.controlPlane.eventRelay.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ksquad-event-relay
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "event-relay") | nindent 4 }}
{{- with $.Values.controlPlane.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
