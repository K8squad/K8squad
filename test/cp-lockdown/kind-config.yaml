# kind cluster config for the control-plane full-lockdown suite (ISI-3910).
#
# disableDefaultCNI: the suite bootstraps Calico itself (run.sh) — NetworkPolicy
# enforcement is the primitive under test and kind's default CNI (kindnet) is not
# trustworthy for egress policy. podSubnet matches Calico's default IPPool so no
# manifest patching is needed. Single control-plane node keeps every stand-in
# co-scheduled and reachable by pod IP.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
