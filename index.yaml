  k8squad-crds:
  - apiVersion: v2
    appVersion: 0.1.0
    created: "2026-09-10T18:41:21.497435808Z"
    description: 'K8squad CRD chart — the eleven ksquad.io CustomResourceDefinitions
      (Team, Agent, AgentRuntime, Role, Skill, Project, Run, EgressPolicy, OtelConfig,
      MCPServer, Toolchain), delivered as an independently versioned, upgrade-safe
      Helm chart (ADR-0002, Option B).  Install this chart BEFORE the k8squad control-plane
      chart, and upgrade it independently to roll CRD schema changes forward on their
      own cadence. CRDs carry helm.sh/resource-policy: keep, so uninstalling never
      deletes the CRDs or the user''s custom resources. '
