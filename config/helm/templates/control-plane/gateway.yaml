{{- if .Values.exposure.gateway.enabled -}}
{{- $g := .Values.exposure.gateway -}}
{{- $ns := include "k8squad.namespace" . -}}
{{- /* Fail-fast pre-flight — the chart REFERENCES a GatewayClass, never creates
       one, so the class is mandatory once exposure is turned on. Hostnames are
       OPTIONAL: omit them to expose by IP address (ISI-3515). */ -}}
{{- if not .Values.controlPlane.enabled -}}
{{- fail "exposure.gateway.enabled=true requires controlPlane.enabled=true — the HTTPRoutes target the console/apiserver Services, which only exist when the control plane is running" -}}
{{- end -}}
{{- if not $g.gatewayClassName -}}
{{- fail "exposure.gateway.gatewayClassName is REQUIRED when exposure.gateway.enabled=true (e.g. kgateway|cilium|envoy|istio|traefik) — the chart references, never creates, a GatewayClass" -}}
{{- end -}}
{{- if and $g.listeners.https.enabled (not $g.listeners.https.certSecretName) -}}
{{- fail "exposure.gateway.listeners.https.certSecretName is REQUIRED when the https listener is enabled (TLS terminates at the Gateway)" -}}
{{- end -}}
{{- /* Reject IDENTICAL non-empty hostnames: both routes would share parent +
       hostname + `/` match, so Gateway API conflict resolution silently drops
       one backend and either the console or the API becomes unreachable. Distinct
       hosts, or one host + one IP-prefix, are fine. */ -}}
{{- if and $g.hostnames.console $g.hostnames.apiserver (eq $g.hostnames.console $g.hostnames.apiserver) -}}
{{- fail "exposure.gateway.hostnames.console and .apiserver are identical — the two HTTPRoutes would collide on the same host+path and Gateway API would drop one backend. Give them distinct hostnames, or leave apiserver empty so it is routed under the /api prefix on the console host." -}}
{{- end -}}
{{- if and (not $g.listeners.http.enabled) (not $g.listeners.https.enabled) -}}
{{- fail "at least one exposure.gateway.listeners.{http,https}.enabled must be true — a Gateway with zero listeners is invalid and leaves the HTTPRoutes' sectionName dangling" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ksquad
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" "exposure") | nindent 4 }}
    {{- with $g.labels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with $g.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # REFERENCE only — the Gateway controller owns the GatewayClass; the chart
  # never creates one. Validated non-empty above.
  gatewayClassName: {{ $g.gatewayClassName | quote }}
  listeners:
    {{- if $g.listeners.http.enabled }}
    - name: http
      protocol: HTTP
      port: {{ $g.listeners.http.port }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- if $g.listeners.https.enabled }}
    - name: https
      protocol: HTTPS
      port: {{ $g.listeners.https.port }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $g.listeners.https.certSecretName | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
