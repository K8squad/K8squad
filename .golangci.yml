version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      # G201 in pkg/coord + pkg/controller/rundrive: SQL interpolates only table
      # names from validated config constants and code-supplied step clauses;
      # all values stay parameterized ($1, $2, ...).
      - linters:
          - gosec
        text: "G201: SQL string formatting"
        path: ^pkg/(coord|controller/rundrive)
      # G101 in internal/memory/config.go: the flagged string is the zero-config
      # DEV default DSN, overridden by env/flags/file in every real deployment
      # (LoadConfig/DefaultConfig). It is a placeholder, not a real secret.
      - linters:
          - gosec
        text: "G101"
        path: internal/memory/config\.go
      # G101 in pkg/controller/reposync: the flagged constant is the condition
      # REASON string "CredentialMissing" (k8s.io/apimachinery Condition
      # reason), not a credential value — the identifier trips gosec's
      # credential-name heuristic by coincidence.
      - linters:
          - gosec
        text: "G101"
        path: pkg/controller/reposync
      # G101 in pkg/controller/credential: the flagged strings are the Anthropic
      # OAuth token *endpoint URL* (defaultAnthropicTokenURL) and a k8s label key
      # ("ksquad.io/credential-class") — a URL and an identifier, not secrets;
      # they trip gosec's credential-name heuristic by coincidence.
      - linters:
          - gosec
        text: "G101"
        path: ^pkg/controller/credential/
      # G101 in pkg/controller/run/status.go: the flagged constants are Condition
      # REASON strings ("CredentialExpired"/"CredentialRotated"), same class as
      # the reposync exclusion above — reason identifiers, not credential values.
      - linters:
          - gosec
        text: "G101"
        path: ^pkg/controller/run/status\.go
      # G101 in pkg/coord/credpause.go: the flagged constants are CredPauseReason
      # enum values ("credential_expired"/"credential_rotated") — pause-reason
      # identifiers surfaced to the console, not secrets.
      - linters:
          - gosec
        text: "G101"
        path: ^pkg/coord/credpause\.go
      # G202 in internal/apiserver/audit.go: the only concatenated fragment is the
      # positional placeholder tail (" LIMIT $N OFFSET $M") built from int
      # counters; every value stays parameterized via QueryContext(ctx, q, params...).
      # No user-controlled string enters the query text — no injection surface.
      - linters:
          - gosec
        text: "G202"
        path: ^internal/apiserver/audit\.go
      # G706 in cmd/memory/main.go: the logged value is a parsed time.Duration
      # (time.ParseDuration validates it), not raw env text — no injection surface.
      - linters:
          - gosec
        text: "G706"
        path: cmd/memory/main\.go
      # revive exported-stutter on memory.MemoryBackend: the seam name is a
      # deliberate public API (§7.1/§7.6); any rename is an ISI-2222 concern,
      # not a trunk-green blocker.
      - linters:
          - revive
        text: stutters
        path: ^internal/memory/backend\.go
      # G101 credential-name heuristic false positives (same class as the
      # reposync/config.go exclusions above): the flagged constants are k8s
      # Condition REASON strings, a label KEY, and a public OAuth token URL —
      # identifiers whose names contain "Credential"/"token", not secret values.
      # refresher.go: defaultAnthropicTokenURL (public OAuth endpoint).
      # secret.go: LabelCredentialClass label key. status.go + credpause.go:
      # reasonCredential{Expired,Rotated} status reason codes.
      - linters:
          - gosec
        text: "G101"
        path: ^pkg/controller/credential/(refresher|secret)\.go
      - linters:
          - gosec
        text: "G101"
        path: ^pkg/controller/run/status\.go
      - linters:
          - gosec
        text: "G101"
        path: ^pkg/coord/credpause\.go
      # G202 in internal/apiserver/audit.go: the concatenated fragment is a
      # constant " LIMIT $N OFFSET $N" clause built from code-supplied parameter
      # indices (fmt.Sprintf of ints), not user input; all values stay bound as
      # $1..$N placeholders — no injection surface.
      - linters:
          - gosec
        text: "G202"
        path: ^internal/apiserver/audit\.go
      # SA1019 controller-runtime 0.24 / k8s 0.36 deprecation wave (ISI-3238 dep
      # bump). The bumped libraries deprecate APIs still in wide use here —
      # admission.Custom{Validator,Defaulter} (untyped aliases), scheme.Builder,
      # Result.Requeue, WithCustomValidator. The code is CORRECT and compiles;
      # only the symbols are marked deprecated. Migrating the admission webhooks
      # to the typed Validator[T]/Defaulter[T] builders (and the scheme/Result
      # changes) is a deliberate follow-up (tracked separately), not a hasty
      # edit inside a dependency bump — a rushed webhook rewrite risks admission
      # bypass. Silence the deprecation notices in the files that carry them
      # until that migration lands.
      #
      # NOTE: staticcheck's SA1019 message for a chained builder call spans
      # multiple lines (`SA1019: ctrl.WebhookManagedBy(...).\n  WithCustom... is
      # deprecated`). golangci matches `text` with Go's regexp, whose `.` does
      # not cross newlines, so a single `SA1019.*WithCustom...` pattern never
      # matched and the deprecations leaked through. Scope by `path` instead —
      # `text: SA1019` matches the leading token on the message's first line,
      # so it is robust to the multiline / variable-name-dependent tail.
      - linters:
          - staticcheck
        text: "SA1019"
        path: ^internal/webhook/attribution\.go
      - linters:
          - staticcheck
        text: "SA1019"
        path: ^pkg/controller/run/controller_test\.go
      # kept for other files that hit the same single-line deprecation wave
      - linters:
          - staticcheck
        text: "SA1019.*admission\\.(Custom)?(Validator|Defaulter) is deprecated"
      - linters:
          - staticcheck
        text: "SA1019.*scheme\\.Builder is deprecated"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
