name: 💡 Feature request
description: Suggest a new capability or improvement for KSquad.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape KSquad! Please search
        [existing issues](https://github.com/K8squad/K8squad/issues) and
        [discussions](https://github.com/K8squad/K8squad/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? What's the use case?
      placeholder: As an operator, I can't ... which makes it hard to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of KSquad does this touch?
      options:
        - console
        - API
        - coordination
        - sandbox
        - plugin
        - docs
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues, or anything else.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
