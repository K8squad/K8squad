name: Build Images

# Supply-chain provenance lane (Story 14.6 / ISI-2745).
#
# Per-component multi-arch image build → push to ghcr.io → SBOM (Syft) → CVE scan (Trivy,
# gated on the curated .trivyignore) → Grype cross-check + cosign sign/attest + SLSA build
# provenance (release tags only). The component fan-out is NOT declared here: this lane is a
# consumer of the reusable component-matrix (Story 14.7 / ISI-2742), so "what components does
# KSquad ship" lives in exactly ONE place (component-matrix.yml) and can never drift lane to
# lane. We union its `go` (deployable Go binaries) and `node` (Node/TS surfaces) families into
# the image build set. Helm is not a container-image lane here; the per-runtime A2A shim
# images ARE (build-shim lane below, ISI-3653) — driven by the component-matrix `shims`
# family from that same single source of truth.
#
# Toolchain lane (ISI-3413): a second matrix from the component-matrix `toolchains`
# family builds/pushes ghcr.io/<owner>/toolchains/<tool>:<catalog-version> — the images
# the default Toolchain catalog (config/helm/values.yaml tools.defaultCatalog.entries)
# references. Per-tool build detail (pinned upstream patch buildArgs) is read from
# images/toolchains/matrix.json and cross-validated against the component-matrix list.
# On main pushes the toolchain lane only runs legs when a Dockerfile.toolchain-*,
# images/toolchains/matrix.json (or this file / component-matrix.yml) changed — 14 multi-arch legs on every unrelated main push would
# starve the 2-runner homelab fleet (ISI-2602/ISI-2748 R1). Tags and dispatch always
# build the full set. Same supply-chain posture as the platform lane, with one
# deliberate deviation: sign/attest on EVERY publish (not just v* tags) because the
# rolling catalog tag IS the toolchain release artifact — there are no git tags here.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless (OIDC) + SLSA provenance attestation
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  # Single source of truth for the component list (ISI-2742). Emits typed JSON per toolchain
  # family; we consume `go` + `node` (the two that produce container images).
  components:
    uses: ./.github/workflows/component-matrix.yml

  # Fold the two image-producing families into one build matrix, deriving each component's
  # Dockerfile and a source-presence srcprobe from the authoritative path. Keeping this here
  # (rather than in the shared primitive) leaves component-matrix.yml generic for every lane.
  plan:
    name: plan image matrix
    needs: components
    # R1 (ISI-2748 epic-14-ci-runner-constraints): K8squad has no hosted-runner minutes, so a
    # `ubuntu-latest` job queues forever and wedges downstream. This is a trivial JSON-shaping
    # leg — rides either self-hosted box as a light leg.
    runs-on: [self-hosted, linux, x64]
    outputs:
      images: ${{ steps.union.outputs.images }}
      toolchains: ${{ steps.toolchains.outputs.tools }}
      shims: ${{ steps.shims.outputs.shims }}
    steps:
      # Needed to read images/toolchains/matrix.json and diff the push range for the
      # toolchain change gate. Shallow-skip: the diff needs the before/after commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Union go + node into the image build matrix
        id: union
        env:
          GO: ${{ needs.components.outputs.go }}
          NODE: ${{ needs.components.outputs.node }}
        run: |
          set -euo pipefail
          # The srcprobe must resolve to a marker whose PRESENCE means the image is actually
          # buildable — the guard skips-with-reason until it lands, so shipping a Dockerfile
          # ahead of source can't trip a doomed build on main (ISI-2644). The right marker
          # differs per family:
          #   go   — the component-matrix path IS the entrypoint dir (cmd/<c>); its presence
          #          implies main.go, so probe the dir directly.
          #   node — the path is the surface dir (console/), which exists as soon as ANY file
          #          lands under it (e.g. e2e specs). But Dockerfile.<c> `COPY console/package.json`
          #          hard-fails without the build manifest, so probe <path>/package.json — the
          #          same marker the removed inline matrix used. Probing the bare dir would run a
          #          doomed console build the moment a test file appeared (exactly ISI-2644's trap).
          # GO/NODE come from the step env (the reusable component-matrix outputs).
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          go = json.loads(os.environ["GO"])
          node = json.loads(os.environ["NODE"])
          def row(i, srcprobe):
              return {"component": i["component"],
                      "dockerfile": "Dockerfile." + i["component"],
                      "srcprobe": srcprobe}
          out = ([row(i, i["path"]) for i in go]
                 + [row(i, i["path"] + "/package.json") for i in node])
          print("images=" + json.dumps(out, separators=(",", ":")))
          PY
          echo "::notice::image build matrix planned from component-matrix outputs"

      # ISI-3413 toolchain lane planning. Emits one row per catalog tool: {tool, version
      # (catalog tag), dockerfile, context, buildargs, image}. The component-matrix
      # `toolchains` family is the canonical tool LIST; images/toolchains/matrix.json
      # carries the build detail (pinned upstream patch). Cross-validate both directions
      # so the two can never silently drift.
      - name: Plan the toolchain image matrix (ISI-3413)
        id: toolchains
        env:
          TOOLCHAINS: ${{ needs.components.outputs.toolchains }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Change gate: on plain main pushes only build toolchain legs when the
          # toolchain tree, the matrix, or this workflow changed in the push range.
          # Tags (releases) and workflow_dispatch always build the full set.
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "$BEFORE" "${GITHUB_SHA}" -- \
              'Dockerfile.toolchain-*' \
              'images/toolchains/matrix.json' \
              '.github/workflows/build-images.yml' \
              '.github/workflows/component-matrix.yml')
            if [ -z "$CHANGED" ]; then
              echo 'tools=[]' >> "$GITHUB_OUTPUT"
              echo "::notice::no toolchain-relevant changes in this push — toolchain lane skipped."
              exit 0
            fi
            echo "::notice::toolchain-relevant changes detected:"; echo "$CHANGED"
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          declared = {t["tool"]: t for t in json.loads(os.environ["TOOLCHAINS"])}
          detail = {t["tool"]: t for t in json.load(open("images/toolchains/matrix.json"))["tools"]}
          missing_detail = sorted(set(declared) - set(detail))
          undeclared = sorted(set(detail) - set(declared))
          if missing_detail or undeclared:
              raise SystemExit(
                  "::error::component-matrix/matrix.json drift — "
                  f"declared but no matrix.json row: {missing_detail}; "
                  f"matrix.json but not declared: {undeclared}")
          rows = []
          for tool, d in declared.items():
              m = detail[tool]
              if m["version"] != d["version"]:
                  raise SystemExit(
                      f"::error::{tool}: component-matrix version {d['version']} "
                      f"!= matrix.json version {m['version']} — keep catalog tags in sync")
              if not os.path.isfile(m["dockerfile"]):
                  raise SystemExit(f"::error::{tool}: matrix.json dockerfile {m['dockerfile']} missing")
              rows.append({
                  "tool": tool,
                  "version": d["version"],
                  "dockerfile": m["dockerfile"],
                  "context": m.get("context", "."),
                  "buildargs": "\n".join(f"{k}={v}" for k, v in m.get("buildArgs", {}).items()),
                  # OCI refs must be lowercase — hardcode the lowercased owner path
                  # (repository_owner is 'K8squad'; see the imgref step comment below).
                  "image": f"ghcr.io/k8squad/toolchains/{tool}",
              })
          # Stable order so check-run names don't shuffle between runs.
          rows.sort(key=lambda r: r["tool"])
          print("tools=" + json.dumps(rows, separators=(",", ":")))
          PY
          echo "::notice::toolchain image matrix planned from component-matrix + images/toolchains/matrix.json"

      # ISI-3653 shim image lane planning. The A2A shim sidecar was previously NOT a
      # container-image lane here (see the header) — it is now. One row per runtime from the
      # component-matrix `shims` family; every row builds the SAME Dockerfile.shim with a
      # RUNTIME build-arg selecting the CLI layer, and publishes ghcr.io/k8squad/ksquad-shim-
      # <runtime>. Real CLI layers today: codex (static-musl codex@rust-v0.152.0 + the
      # ksquad-codex-exec wrapper, ISI-3653), opencode (sst/opencode@v1.18.27) and claude
      # (Claude Code@2.1.236, sha256-verified) per ISI-3667; openclaw/hermes intentionally
      # ship the shim main only (no upstream CLI artifact — see Dockerfile.shim). Change-gated
      # on plain main pushes (mirrors the
      # toolchain lane) so 5 multi-arch legs don't starve the 2-runner fleet on unrelated pushes.
      - name: Plan the shim image matrix (ISI-3653)
        id: shims
        env:
          SHIMS: ${{ needs.components.outputs.shims }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "$BEFORE" "${GITHUB_SHA}" -- \
              'Dockerfile.shim' \
              'cmd/shim/**' \
              'cmd/ksquad-codex-exec/**' \
              'pkg/shim/**' \
              '.github/workflows/build-images.yml' \
              '.github/workflows/component-matrix.yml')
            if [ -z "$CHANGED" ]; then
              echo 'shims=[]' >> "$GITHUB_OUTPUT"
              echo "::notice::no shim-relevant changes in this push — shim image lane skipped."
              exit 0
            fi
            echo "::notice::shim-relevant changes detected:"; echo "$CHANGED"
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          shims = json.loads(os.environ["SHIMS"])
          rows = []
          for s in shims:
              rt = s["runtime"]
              rows.append({
                  "runtime": rt,
                  # OCI refs must be lowercase — hardcode the lowercased owner path (the raw
                  # owner is 'K8squad'; same reasoning as the imgref steps below).
                  "image": f"ghcr.io/k8squad/ksquad-shim-{rt}",
                  "buildargs": f"RUNTIME={rt}",
              })
          rows.sort(key=lambda r: r["runtime"])
          print("shims=" + json.dumps(rows, separators=(",", ":")))
          PY
          echo "::notice::shim image matrix planned from component-matrix shims family"

  build:
    name: image / ${{ matrix.component }}
    needs: plan
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip until Dockerfile AND component source are present (skeleton phase)
        id: guard
        run: |
          # Dockerfiles ship in the skeleton; the build lane must stay green until the
          # component's source lands, else a present Dockerfile alone would trip a doomed
          # build on main. Gate on both — skip-with-reason, never a silent drop.
          if [ ! -f "${{ matrix.dockerfile }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.dockerfile }} not present yet — image lane skipped."
          elif [ ! -e "${{ matrix.srcprobe }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.component }} source (${{ matrix.srcprobe }}) not present yet — image lane skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: steps.guard.outputs.present == 'true'

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.guard.outputs.present == 'true'

      - name: Log in to ghcr.io
        if: steps.guard.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: steps.guard.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ksquad-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        if: steps.guard.outputs.present == 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILDKIT_INLINE_CACHE=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve pushed image ref (lowercased, by digest)
        if: steps.guard.outputs.present == 'true' && github.event_name != 'pull_request'
        id: imgref
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # OCI refs must be lowercase. metadata-action lowercases the repo path for the
          # push, but the SBOM/scan/sign steps below re-derived the ref straight from the
          # raw (mixed-case) owner — 'K8squad' — which syft/trivy reject as an unparseable
          # reference. They also pinned a full-sha *tag* (sha-<40 hex>) metadata-action never
          # pushes (type=sha emits a short tag), so even lowercased the tag would 404.
          # Pin to the immutable pushed digest under a lowercased repo path instead.
          NAME="${REGISTRY}/${OWNER,,}/ksquad-${{ matrix.component }}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "ref=${NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (Syft)
        if: steps.guard.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.imgref.outputs.ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json

      - name: Upload SBOM artifact
        if: steps.guard.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.spdx.json
          if-no-files-found: ignore

      - name: CVE scan (Trivy) — gate on CRITICAL/HIGH fixable
        if: steps.guard.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — SHA-pinned setup-trivy; v0.28.0's tag ref is broken
        with:
          image-ref: ${{ steps.imgref.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # The ONLY CVE escape hatch (14.6 AC): the curated, expiry-dated .trivyignore, which
          # the security.yml `trivyignore (expiry lint)` job validates and fails on expiry.
          # A suppression added there governs BOTH the filesystem scan (security.yml) and this
          # image scan — one reviewed-like-code list, no per-lane drift.
          trivyignores: .trivyignore

      - name: Grype cross-check (release images)
        if: steps.guard.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        # §6.1/§6.6: Trivy is the primary gate on every image; Grype is an independent
        # second-scanner cross-check on release images so a single scanner's DB gap doesn't
        # silently ship a known-vulnerable release. Same fixable-only posture as Trivy.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.imgref.outputs.ref }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table

      - name: cosign install
        if: steps.guard.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign + attest SBOM (release images)
        if: steps.guard.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          IMG=${{ steps.imgref.outputs.ref }}
          cosign sign --yes "$IMG"
          cosign attest --yes --predicate sbom-${{ matrix.component }}.spdx.json --type spdxjson "$IMG"

      - name: Attest build provenance (SLSA, release images)
        if: steps.guard.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        # SLSA build-provenance attestation on the released digest — keyless (OIDC), pushed to
        # the registry alongside the cosign SBOM attestation. Uses the id-token/attestations
        # permissions already declared; no stored key (§11.5).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.imgref.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ISI-3413 toolchain image lane. Builds and publishes every image the default Toolchain
  # catalog references (ghcr.io/k8squad/toolchains/<tool>:<catalog-version>). The matrix
  # comes from the plan leg (component-matrix toolchains family × images/toolchains/
  # matrix.json); on plain main pushes it is empty unless toolchain-relevant files changed.
  # Supply-chain posture mirrors the platform lane above, except sign/attest/provenance run
  # on EVERY publish (not just v* tags): the rolling catalog tag is the toolchain release
  # artifact, so an unsigned main-publish would leave the catalog unverifiable.
  build-toolchain:
    name: toolchain / ${{ matrix.tool }}
    needs: plan
    if: ${{ needs.plan.outputs.toolchains != '[]' && needs.plan.outputs.toolchains != '' }}
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.toolchains) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image }}:${{ matrix.version }}
            ${{ matrix.image }}:sha-${{ github.sha }}
          build-args: ${{ matrix.buildargs }}
          cache-from: type=gha,scope=toolchain-${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ matrix.tool }}

      - name: Resolve pushed image ref (by digest)
        if: github.event_name != 'pull_request'
        id: imgref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Pin every downstream step (SBOM/scan/sign) to the immutable pushed digest —
          # same reason as the platform lane's imgref step (sha-<short> tags and
          # mixed-case owner paths break syft/trivy/cosign).
          echo "name=${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ matrix.image }}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (Syft)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.imgref.outputs.ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.tool }}.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-toolchain-${{ matrix.tool }}
          path: sbom-${{ matrix.tool }}.spdx.json
          if-no-files-found: ignore

      - name: CVE scan (Trivy) — gate on CRITICAL/HIGH fixable
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — SHA-pinned setup-trivy; v0.28.0's tag ref is broken
        with:
          image-ref: ${{ steps.imgref.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # Same single escape hatch as the platform lane: the curated, expiry-dated
          # .trivyignore validated by security.yml's trivyignore expiry lint.
          trivyignores: .trivyignore

      - name: Grype cross-check
        if: github.event_name != 'pull_request'
        # Toolchain images have no git release tags, so the second-scanner cross-check
        # runs on every publish (the platform lane gates it on refs/tags/v).
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.imgref.outputs.ref }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table

      - name: cosign install
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign + attest SBOM
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          IMG=${{ steps.imgref.outputs.ref }}
          cosign sign --yes "$IMG"
          cosign attest --yes --predicate sbom-${{ matrix.tool }}.spdx.json --type spdxjson "$IMG"

      - name: Attest build provenance (SLSA)
        if: github.event_name != 'pull_request'
        # Keyless (OIDC) SLSA build-provenance attestation on the published digest,
        # pushed to the registry. Every publish attests — see the lane header.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.imgref.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ISI-3653 shim image lane. Builds and publishes the per-runtime A2A shim sidecars
  # (ghcr.io/k8squad/ksquad-shim-<runtime>) from the single Dockerfile.shim, selecting the
  # CLI layer with a RUNTIME build-arg. The matrix comes from the plan leg (component-matrix
  # shims family, change-gated); it is empty on plain main pushes with no shim-relevant diff.
  # Supply-chain posture mirrors the toolchain lane: sign/attest/provenance on EVERY publish
  # (not just v* tags) because the sha tag / digest IS the shim release artifact here.
  # AC1/AC2 (ISI-3653): the codex leg yields a digest-pinned ksquad-shim-codex with
  # codex@rust-v0.152.0 + ksquad-codex-exec on $PATH, referenced downstream by digest.
  build-shim:
    name: shim-image / ${{ matrix.runtime }}
    needs: plan
    if: ${{ needs.plan.outputs.shims != '[]' && needs.plan.outputs.shims != '' }}
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shims) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push shim image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.shim
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
          build-args: ${{ matrix.buildargs }}
          cache-from: type=gha,scope=shim-${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=shim-${{ matrix.runtime }}

      - name: Resolve pushed image ref (by digest)
        if: github.event_name != 'pull_request'
        id: imgref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Pin every downstream step (SBOM/scan/sign) to the immutable pushed digest —
          # same reason as the platform/toolchain lanes' imgref steps. AC2 (ISI-3653):
          # consumers reference the shim by this digest, never a floating tag.
          echo "name=${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ matrix.image }}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (Syft)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.imgref.outputs.ref }}
          format: spdx-json
          output-file: sbom-shim-${{ matrix.runtime }}.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-shim-${{ matrix.runtime }}
          path: sbom-shim-${{ matrix.runtime }}.spdx.json
          if-no-files-found: ignore

      - name: CVE scan (Trivy) — gate on CRITICAL/HIGH fixable
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — SHA-pinned setup-trivy; v0.28.0's tag ref is broken
        with:
          image-ref: ${{ steps.imgref.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # Same single escape hatch as the other lanes: the curated, expiry-dated
          # .trivyignore validated by security.yml's trivyignore expiry lint.
          trivyignores: .trivyignore

      - name: Grype cross-check
        if: github.event_name != 'pull_request'
        # Shim images have no git release tags of their own, so the second-scanner
        # cross-check runs on every publish (mirrors the toolchain lane).
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.imgref.outputs.ref }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table

      - name: cosign install
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign + attest SBOM
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          IMG=${{ steps.imgref.outputs.ref }}
          cosign sign --yes "$IMG"
          cosign attest --yes --predicate sbom-shim-${{ matrix.runtime }}.spdx.json --type spdxjson "$IMG"

      - name: Attest build provenance (SLSA)
        if: github.event_name != 'pull_request'
        # Keyless (OIDC) SLSA build-provenance attestation on the published digest.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.imgref.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
