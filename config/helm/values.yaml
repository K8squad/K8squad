# Default values for the k8squad control-plane chart.
# The namespace + CRD group ship unconditionally (Story 1.4). The running
# control plane (operator/apiserver/console/memory/scm-webhook, ISI-3488) is
# gated behind controlPlane.enabled and is OFF by default so `helm install`
# stays a safe CRD+namespace bootstrap until an operator is wanted.

# ---------------------------------------------------------------------------
# Control plane (ISI-3488). Deployments + Services + RBAC for the workloads
# whose images CI publishes to ghcr.io/k8squad/ksquad-<component>.
#
# Requires a Postgres backing store — set controlPlane.database.existingSecret
# (preferred) or controlPlane.database.dsn (dev only) before enabling.
#
# NOT covered here (deliberate, documented gaps):
#  * admission webhook (cmd/webhook) — no image lane exists yet, so the
#    Mutating/ValidatingWebhookConfiguration is NOT installed. Installing it
#    without a webhook backend would fail-closed on every Agent/Project/Run/
#    Team write. Track the image lane before wiring cert-manager + CA inject.
#  * event-relay — hard-requires NATS + Postgres; gated behind its own
#    controlPlane.eventRelay.enabled and off until a NATS URL is supplied.
# ---------------------------------------------------------------------------
controlPlane:
  # Master switch for the running control plane. false → chart installs only
  # the namespace, CRDs, and (optionally) the toolchain catalog.
  enabled: false

  image:
    # registry+org; component images resolve to <registry>/ksquad-<component>.
    registry: ghcr.io/k8squad
    # Image tag; empty falls back to the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Pull secrets for private ghcr access, attached to each ServiceAccount.
  imagePullSecrets: []

  # Postgres store of record (apiserver, operator coordination, memory).
  database:
    # Name of an existing Secret holding the DSN. Preferred for production.
    existingSecret: ""
    # Key within existingSecret holding the DSN.
    key: dsn
    # Inline DSN — dev only; rendered into a chart-owned Secret. Never commit
    # a real credential here.
    dsn: ""

  # OTLP exporter wiring → the observability gateway collector (live since
  # ISI-3484). Injected as OTEL_EXPORTER_OTLP_* on every workload.
  otel:
    enabled: true
    endpoint: "http://otel-gateway-collector.observability:4317"
    protocol: grpc

  operator:
    replicas: 1
    leaderElect: true
    resources: {}
    extraEnv: []

  apiserver:
    replicas: 1
    resources: {}
    extraEnv: []

  console:
    replicas: 1
    resources: {}
    extraEnv: []

  memory:
    replicas: 1
    resources: {}
    extraEnv: []

  scmWebhook:
    replicas: 1
    resources: {}
    extraEnv: []

  eventRelay:
    # Off by default UNLESS the bundled bus (controlPlane.nats.enabled) is on —
    # then the relay is auto-enabled and natsUrl auto-derived (see below). Set
    # enabled=true + a natsUrl to drain the outbox to an EXTERNAL NATS instead.
    enabled: false
    natsUrl: ""
    replicas: 1
    resources: {}
    extraEnv: []

  # NATS / JetStream — the plugin event bus (§16 / §17.4 / ADR-023; CEO
  # 2026-08-11 "data in Postgres, events on NATS"). Postgres/CNPG stays the sole
  # source of truth (ADR-001); NATS holds only in-flight / replayable event
  # copies drained best-effort by event-relay, so NATS-down NEVER blocks a
  # Run/claim/write. Bundling it here makes `controlPlane.enabled=true` yield a
  # complete event plane (5 Deployments + Postgres + NATS + event-relay),
  # matching the umbrella chart's guarantees.
  nats:
    # ON by default (like the umbrella chart) so `controlPlane.enabled=true`
    # yields a COMPLETE event plane — a JetStream StatefulSet is rendered AND
    # eventRelay is auto-enabled with natsUrl=nats://ksquad-nats.<ns>.svc:<port>.
    # Requires persistence.storageClassName (fail-fast, §16.2). Set false to opt
    # out (e.g. to drain to an EXTERNAL bus via eventRelay.natsUrl, or to run the
    # core without live plugin event streaming — the outbox buffers regardless).
    enabled: true
    image: nats:2.10-alpine
    port: 4222
    jetstream:
      # Bare token — NATS' size lexer rejects a quoted "4GB"/"4Gi" (ISI-2624).
      maxFileStore: 4GB
    ha:
      # false → single JetStream replica. true → clustered RAFT quorum; replicas
      # must be ODD and >= 3.
      enabled: false
      replicas: 3
    # JetStream file-store PVC. StorageClass is a first-class knob (§16.2): the
    # PVC NEVER silently relies on the cluster-default class — it is REQUIRED
    # when nats.enabled (fail-fast), exactly like the umbrella chart.
    persistence:
      storageClassName: ""
      size: 4Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

# ---------------------------------------------------------------------------
# Exposure (ISI-3515). Gateway API routing for the console + apiserver.
#
# OFF by default — a bare `controlPlane.enabled=true` brings the stack up as
# ClusterIP Services (reach the console via `kubectl port-forward`), so the
# install needs no Gateway API / GatewayClass to succeed. Turn this on to have
# the chart render a Gateway + HTTPRoutes automatically:
#
#   helm upgrade k8squad config/helm -n k8squad-system \
#     --set controlPlane.enabled=true \
#     --set exposure.gateway.enabled=true \
#     --set exposure.gateway.gatewayClassName=kgateway \
#     --set exposure.gateway.hostnames.console=ksquad.example.com \
#     --set exposure.gateway.hostnames.apiserver=api.ksquad.example.com
#
# The chart REFERENCES an existing GatewayClass and NEVER creates one — the
# GatewayClass is owned by the Gateway controller you installed (kgateway,
# cilium, envoy, istio, traefik…). The install fails fast if `enabled` is set
# without a gatewayClassName + both hostnames.
# ---------------------------------------------------------------------------
exposure:
  gateway:
    # Master switch. false → no Gateway/HTTPRoute rendered (ClusterIP only).
    enabled: false
    # REQUIRED when enabled. The GatewayClass to reference — must already exist
    # in the cluster (e.g. `kgateway`). The chart never creates a GatewayClass.
    gatewayClassName: ""
    # Host-based routing. BOTH are REQUIRED when enabled — the console and the
    # apiserver each get their own HTTPRoute keyed by hostname.
    hostnames:
      console: "" # e.g. ksquad.example.com
      apiserver: "" # e.g. api.ksquad.example.com   (the SSE endpoint, §13)
    listeners:
      http:
        enabled: true
        port: 80
      https:
        # Off by default — flip on and supply certSecretName to terminate TLS
        # at the Gateway.
        enabled: false
        port: 443
        # REQUIRED when https.enabled: the TLS cert Secret (terminate at gateway).
        certSecretName: ""
    # Redirect http→https at the Gateway edge (renders a RequestRedirect route
    # on the http listener). Ignored unless BOTH listeners are enabled.
    httpsRedirect: false
    # Extra annotations/labels on the Gateway object (controller-specific tuning).
    annotations: {}
    labels: {}

namespace:
  # Create the control-plane namespace as a chart resource.
  create: true
  # Control-plane namespace name. CRs are namespaced into it by later stories;
  # the CRDs themselves are cluster-scoped objects installed by Helm on first
  # install (see crds/).
  name: k8squad-system
  labels: {}
  #  team: platform
  annotations: {}

# Standard `app.kubernetes.io/*` label roots applied to chart-owned resources.
nameOverride: ""
fullnameOverride: ""

# Workspace PVC configuration for Projects (story 4.3, §9.4)
workspacePVC:
  # Default storage class for workspace PVCs. Empty means the cluster default,
  # but this is discouraged as it can lead to misconfiguration (story 9.2).
  # Should be resolved by the operator from Helm-provided workspace storage class.
  # +optional
  defaultClass: ""
  
  # Default size for workspace PVCs when not specified in Project.spec.workspacePVC.size
  # +optional
  defaultSize: "10Gi"
  
  # Default access modes for workspace PVCs (RWO by default for write-lease serialization)
  # +optional
  defaultAccessModes:
  - ReadWriteOnce
  
  # Supported storage classes for workspace PVCs
  # +optional
  supportedClasses: []

# Toolchain capability plane (Epic B, ISI-3286, plan §2.2/§2.2b).
tools:
  # defaultCatalog ships the curated cluster catalog as chart-rendered
  # Toolchain objects in the control-plane namespace. One flag deploys
  # the fourteen-tool set Skills reference (kubectl, git, gh, go, node,
  # dtctl, helm, python, docker-cli, uv, jq, yq, curl, make); the
  # operator owns all per-Run RBAC rendering.
  defaultCatalog:
    # +optional
    enabled: false
    # Catalog entries. The defaults are the curated least-privilege set:
    # kubectl → read-only core+apps RBAC, the other thirteen → no RBAC
    # (staged onto PATH, no Kubernetes API grant). Override versions or
    # images per tool; add entries to extend the catalog (cluster scope
    # additionally needs tools.rbac.clusterScopeEnabled).
    # +optional
    entries:
      kubectl:
        versions:
        - version: "1.36"
          image: ghcr.io/k8squad/toolchains/kubectl:1.36
          provides: [kubectl]
        rbac:
          scope: namespace
          rules:
          - apiGroups: [""]
            resources: [pods, services, configmaps, events]
            verbs: [get, list, watch]
          - apiGroups: [apps]
            resources: [deployments, replicasets, statefulsets]
            verbs: [get, list, watch]
      git:
        versions:
        - version: "2.45"
          image: ghcr.io/k8squad/toolchains/git:2.45
          provides: [git]
      gh:
        versions:
        - version: "2.98"
          image: ghcr.io/k8squad/toolchains/gh:2.98
          provides: [gh]
      go:
        versions:
        - version: "1.26"
          image: ghcr.io/k8squad/toolchains/go:1.26
          provides: [go]
      node:
        versions:
        - version: "22"
          image: ghcr.io/k8squad/toolchains/node:22
          provides: [node, npm]
      dtctl:
        versions:
        - version: "1.0"
          image: ghcr.io/k8squad/toolchains/dtctl:1.0
          provides: [dtctl]
      helm:
        versions:
        - version: "3.21"
          image: ghcr.io/k8squad/toolchains/helm:3.21
          provides: [helm]
      # AI-agent toolset (ISI-3400, approved on ISI-3387 card b72964f6).
      # All seven are PATH-staged with zero Kubernetes grants — no rbac
      # blocks, same posture as git/go/node above. docker-cli is the
      # client only; the daemon stays the existing dockerd sidecar
      # (requires.sidecars: [dockerd]), never shipped in this image.
      python:
        versions:
        - version: "3.12"
          image: ghcr.io/k8squad/toolchains/python:3.12
          provides: [python, python3, pip]
      docker-cli:
        versions:
        - version: "29"
          image: ghcr.io/k8squad/toolchains/docker-cli:29
          provides: [docker]
      uv:
        versions:
        - version: "0.5"
          image: ghcr.io/k8squad/toolchains/uv:0.5
          provides: [uv, uvx]
      jq:
        versions:
        - version: "1.7"
          image: ghcr.io/k8squad/toolchains/jq:1.7
          provides: [jq]
      yq:
        versions:
        - version: "4"
          image: ghcr.io/k8squad/toolchains/yq:4
          provides: [yq]
      curl:
        versions:
        - version: "8"
          image: ghcr.io/k8squad/toolchains/curl:8
          provides: [curl]
      make:
        versions:
        - version: "4"
          image: ghcr.io/k8squad/toolchains/make:4
          provides: [make]
  # rbac gates the cluster-scope escape (plan §2.2b): when true, a
  # cluster-catalog Toolchain may declare rbac.scope=cluster (rendered as
  # a per-Run ClusterRole). Injected as KSQUAD_TOOLCHAIN_CLUSTER_SCOPE_ENABLED
  # on the webhook and operator deployments. Never default-on.
  rbac:
    # +optional
    clusterScopeEnabled: false
