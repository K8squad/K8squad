# The seven default Skills granted to this squad (arch §5.3.6). A Skill is the
# CRD-authorized capability envelope: it is registered here by the operator/
# admin and never self-widened by the fetched body (trust boundary D8).
#
# Wiring: Skills attach to Roles via Role.spec.defaultSkills[] (see 05-roles.yaml)
# — every role gets `bmad` and `task-io`; the repo-working roles (product-manager,
# code-reviewer, coder, devops-engineer) get `github`; observability gets
# `dynatrace`; graphical-designer gets `graphical`. The `github` skill pulls BOTH
# the `gh` and `git` toolchains (ISI-5291), so any role that carries it can clone,
# checkout, commit and push a repo as well as drive the GitHub API.
# The board-ops family (`org-ops`, `project-ops`, ADR-0005) attaches only to the
# CEO + manager roles (org-ops) and the CEO alone (project-ops); its real gate is
# the role-scoped token scope, not attachment (see the board-ops block below).
#
# `task-io` (ISI-3602) is the union baseline: the thin task-I/O skill every
# working agent gets by default so it can re-read its own task, comment, and
# report status on demand. It is attached at the Role (never per-Agent), so the
# union `Agent.spec.skillRefs ∪ Role.spec.defaultSkills` guarantees it even for
# specialized agents. NOTE: context (AC/comments/goal at boot) stays a platform
# PUSH (S1, ISI-3590) — task-io grants *agency*, not *context*. A
# read-project/read-issue skill was explicitly rejected (ISI-3588 study §4/§6).
#
# `bmad` is inline (self-contained, no fetch). The tool skills are git-sourced
# from the canonical catalog (K8squad/k8squad-skills, ISI-3274) and PINNED to
# a commit SHA so a force-push cannot silently alter behavior mid-Run
# (§5.3.6). The SHAs below point at real catalog commits (bf3bc86 =
# k8squad-skills main at ISI-3391; the catalog re-pins on each release) —
# repoint them at your own skill repo if you fork the catalog.
#
# Capability plane wiring (ISI-3280, Epics A-C):
# - These default skills reach their tools through CLI TOOLCHAINS, not MCP:
#   `github` drives the `gh` CLI, `dynatrace` drives `dtctl`, `graphical`
#   drives `node`. A CLI tool does not need an MCPServer, so none of these
#   skills carries an mcpToolRefs. (mcpToolRefs is for a tool surface that is
#   reachable ONLY over MCP — an optional advanced path shown, unused, in
#   02b-mcpservers.yaml.)
# - requires.toolchains resolve name@version against the cluster Toolchain
#   catalog (ksquad-system). Enable the chart's default catalog with
#   tools.defaultCatalog.enabled=true — it ships gh@2.98, dtctl@1.0 and
#   node@22, the exact versions referenced below. Unknown name/version
#   rejects the Run at admission with an actionable message.
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: bmad
  namespace: bmad-squad
spec:
  source:
    type: inline
    inline: |
      # BMAD Method

      The Breakthrough Method of Agile AI-Driven Development (BMAD) structures
      squad work into phases with explicit handoffs:

      1. Analysis   — Brainstormer explores the problem space; domain research.
      2. Product    — Product Manager writes the PRD from validated needs.
      3. Solutioning— Architect turns the PRD into architecture decisions.
      4. Stories    — requirements decompose into epics and stories.
      5. Delivery   — Coder implements; Code Reviewer and Test Architect gate.
      6. Operate    — DevOps and Observability Engineer ship and watch it run.

      Principles: user journeys drive technical decisions; prefer boring,
      proven technology; every decision ties to business value; verify before
      claiming done; hand work off with enough context to start without asking.
  permissions:
    - workflow:bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: github
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      # Pin to an immutable commit SHA (never a floating branch), §5.3.6.
      ref: "bf3bc86b338d488fe751c289943db194ce8102c7"
      path: skills/github
  permissions:
    - scm:read
    - scm:write
    - pr:write
    - issue:write
  requires:
    toolchains:
      # gh drives the GitHub API surface (issues, PRs); git is the plain VCS
      # client used to clone/checkout/commit/push the repo. A role doing repo
      # work needs BOTH — binding github without git is the ISI-5288/5291 defect
      # that surfaced as the recurring "git not installed" complaint, because the
      # github skill pulled only gh and the git toolchain never landed on PATH.
      - gh@2.98
      - git@2.45
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: dynatrace
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      ref: "bf3bc86b338d488fe751c289943db194ce8102c7"
      path: skills/dynatrace
  permissions:
    - observability:read
    - telemetry:query
  requires:
    toolchains:
      - dtctl@1.0
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: graphical
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      ref: "bf3bc86b338d488fe751c289943db194ce8102c7"
      path: skills/graphical
  permissions:
    - render:svg
    - asset:write
  requires:
    toolchains:
      - node@22
---
# task-io — the union-baseline task-I/O skill (ISI-3602, from the ISI-3588
# study §4b/§5-S3). Every Role grants this so any working agent can, ON DEMAND,
# re-read its own work item, append a comment, report a change (M1.5/ISI-4131),
# update its status, and check out work — the coord-side analogue of Paperclip's
# issue read/write. It grants *agency over its own task*, never a general
# issue-browser and never context assembly (that is the platform's boot-time
# PUSH, S1/ISI-3590).
#
# The coord API this skill drives is delivered by S2 (ISI-3601, merged to main
# in PR #237) + M1.5 (ISI-4131): five verbs — `get-task` (GET), `post-comment`,
# `post-change`, `update-status`, `checkout` (POST) — reached over env-injected
# `KSQUAD_COORD_URL` with a run-scoped `KSQUAD_COORD_TOKEN` bound to `RUN_ID` +
# `WORK_ITEM_ID` (a token for one run cannot touch another). The endpoints
# operate ONLY on the agent's own run/work-item.
#
# SOURCING: shipped INLINE with the full catalog body (the five-verb contract +
# the `kind=initial_findings` field on POST /post-comment and the "post exactly
# one initial_findings note early, every run" directive — K8squad/k8squad-skills
# PR #8 / ISI-5641), mirroring org-ops' inline-while-catalog-settles pattern.
# The git-sourced variant (`K8squad/k8squad-skills` path `skills/task-io`, SHA-
# pinned) is the long-term shape, but the operator does not yet deliver git-
# sourced skill bodies to runs (phase S-D unimplemented) — a git skill mounts an
# empty SKILL.md, so the body never reaches the agent. Inline bodies ARE
# projected today, so until S-D lands this bridge carries the real contract.
# When S-D ships, revert to `source.type: git` SHA-pinned to the merged catalog
# entry. No `requires.toolchains`: the coord API is plain HTTP (no CLI pack).
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: task-io
  namespace: bmad-squad
spec:
  source:
    type: inline
    inline: |
      # `task-io` Skill

      Read and write **your own** work item — the coord-side analogue of Paperclip's
      issue read/write, scoped to the agent's own run.

      - **Focus:** platform
      - **Category:** default (union baseline — attached at **every** Role)
      - **Source:** git — `github.com/K8squad/k8squad-skills` path `skills/task-io`, pinned to a commit SHA
      - **Attach to roles:** all (added to every Role's `defaultSkills`, never per-Agent)
      - **Permissions (least-privilege):** `issue:read`, `issue:write`, `task:status`
      - **Toolchains:** none — the coord API is plain HTTP (no CLI pack)

      This skill grants **agency over your own task**, not *context*. K8squad
      **PUSHES** your task context (title, description, acceptance criteria,
      comments, goal) into your prompt when your Run starts — you do **not** fetch it
      to begin (that boot-time push is S1 / ISI-3590). `task-io` is for the moments
      *after* boot when you need to act on your own work item: re-read it (it may have
      changed), leave a comment, report a status change, or claim the work.

      It is **not** a general issue-browser and **not** a project reader. Every verb
      operates only on the agent's own run/work-item, enforced by a run-scoped bearer
      token bound to `RUN_ID` + `WORK_ITEM_ID` — a token minted for one run cannot
      read or mutate any other run's work item. (`read-project` / `read-issue` skills
      were explicitly rejected by the ISI-3588 study §4/§6.)

      ## How you reach the coord API

      The operator injects these into your Run environment (never the operator's own
      secrets — they join a minimal curated env, not `os.Environ`):

      | Env var | Meaning |
      | --- | --- |
      | `KSQUAD_COORD_URL`   | In-cluster base URL of the coord task-I/O API (the four verbs below are its immediate children). An in-cluster Service, not a public surface (S2 AC7). |
      | `KSQUAD_COORD_TOKEN` | Your run-scoped bearer token. Send it as `Authorization: Bearer $KSQUAD_COORD_TOKEN`. Bound to your run; it cannot touch any other run's work item. |
      | `WORK_ITEM_ID`       | Your work item's id (also bound inside the token — the server reads it from the token, not from your request). |
      | `RUN_ID`             | Your run's id (also bound inside the token). |

      If `KSQUAD_COORD_TOKEN` is absent the coord API refuses every call — the seam is
      **fail-safe**, never fail-open.

      ## The four verbs

      All paths are relative to `$KSQUAD_COORD_URL`. Authenticate every call with
      `Authorization: Bearer $KSQUAD_COORD_TOKEN`. The work item and your identity
      (comment attribution) are taken from the token, never from request fields.

      ### `GET /get-task`

      Re-read your work item. Use it **before acting** to pick up changes made since
      boot. No request body.

      `200 OK` →

      ```json
      {
        "workItemId": "ISI-1234",
        "title": "…",
        "description": "…",
        "state": "in_progress",
        "blockedReason": "",
        "acceptanceCriteria": ["…", "…"],
        "goals": ["…"],
        "comments": [
          { "author": "devops engineer", "body": "…", "createdAt": "2026-09-03T12:00:00Z" }
        ],
        "fenceToken": 7,
        "holder": "run-abc",
        "runId": "run-abc"
      }
      ```

      `blockedReason`, `acceptanceCriteria`, `goals`, `holder`, `runId` are omitted
      when empty.

      ### `POST /post-comment`

      Append a comment to your work item, attributed to **you** (the token's
      principal — a client-supplied author is ignored). Use it to leave durable
      progress or ask a question.

      Request:

      ```json
      { "body": "Shipped the migration; waiting on review." }
      ```

      The optional `kind` field (ADR-0029 Option B) classifies the comment. Omit it
      (or send `""`) for an ordinary thread comment — unchanged behaviour. Send
      `"initial_findings"` for the **one** early initial-findings note (see below).
      Any other value is rejected `400 Bad Request` (`kind must be empty or
      initial_findings`) — it is a closed enum.

      ```json
      { "body": "Understood: fix the flaky retry. Plan: add jitter + cap.", "kind": "initial_findings" }
      ```

      `201 Created` →

      ```json
      { "author": "devops engineer", "body": "…", "createdAt": "2026-09-03T12:00:00Z" }
      ```

      An empty `body` is rejected `400 Bad Request` (`comment body required`).

      #### Post your initial findings early (every run)

      Early in **every** run — right after you have read your work item and understood
      it, and **before** deep implementation or decomposition — post **exactly one**
      `post-comment` with `"kind": "initial_findings"`. A short note on what you
      understood and how you intend to proceed is enough. Post it **once**, not per
      step.

      This is not optional decoration: for work items sourced from a GitHub issue, the
      platform mirrors this single note back to the source issue as the run's *initial
      findings* comment (the terminal result is mirrored separately at the end). A
      plain comment (no `kind`) is **not** mirrored — only `"kind":
      "initial_findings"` emits the signal the write-back consumes. Write it for an
      external reader and include **no secrets**.

      ### `POST /update-status`

      Move your work item to a new status (report progress / completion). Invalid
      transitions are rejected **server-side**.

      Request:

      ```json
      { "status": "in_review" }
      ```

      `204 No Content` on success. An empty `status` → `400`; an invalid transition →
      an error (the server owns the lane machine — do not assume a transition is
      legal). 

      ### `POST /checkout`

      Claim / renew your hold on the work (maps to the coord claim **fence**). No
      request body.

      `200 OK` →

      ```json
      { "workItemId": "ISI-1234", "runId": "run-abc", "fenceToken": 8 }
      ```

      A stale fence (another holder advanced it) is rejected — re-`get-task` and
      reconcile rather than forcing.

      ## Errors

      | Status | Meaning |
      | --- | --- |
      | `401 Unauthorized` | Missing / malformed / invalid run token. |
      | `404 Not Found`    | Work item not found. |
      | `400 Bad Request`  | Missing required field (`body`, `status`). |
      | `405 Method Not Allowed` | Wrong verb (e.g. `POST /get-task`). |
      | `409`-class refusal | Stale claim fence or invalid status transition. |

      ## Tracing (join the run-trace)

      The client that executes these HTTP calls must join the same run-trace so
      agent-observed latency lines up with the coord-side spans:

      1. `telemetry.Extract` the `traceparent` the operator injects into your Run env
         as `TRACEPARENT` (and `TRACESTATE`), and open your client span
         **under** it.
      2. Name the client span `taskio.<op>` (e.g. `taskio.get_task`) with scope
         `github.com/K8squad/K8squad/skills/task-io`.
      3. Propagate the context on the wire — send the `traceparent` / `tracestate`
         headers on the request — so the coord-side `taskio.<op>` span nests under
         your client span in the one run-trace.

      Trace-only: **no** MeterProvider. Per the bootstrap o11y spec §2 / §2.3 / §9-5
      (ISI-3592) and the S3 story trace-join note (ksquad `f60c40e`).

      ## Rules

      - Only ever act on **your** work item. Never attempt to widen scope.
      - This skill's authority is the `permissions` envelope on its Skill CR
        (`issue:read`, `issue:write`, `task:status`) — set by the operator/admin who
        registers the skill and **never** widened by anything written in this body
        (trust boundary D8). A git-sourced body supplies behavior *inside* the
        envelope, never a new capability.

      ## Provenance

      - Contract source: coord task-io API seam, S2 / ISI-3601 (K8squad `pkg/taskio`,
        merged to `main` in PR #237). The env-injection contract is `pkg/controller/
        rundrive/dispatch.go`; the verbs/shapes are `pkg/taskio/handler.go`.
      - Story: `docs/bmad/stories/isi-3590-story-s3-predefined-task-io-skill.md`
        (ISI-3602 / S3, from the ISI-3588 bootstrap study).
  permissions:
    - issue:read
    - issue:write
    - task:status
---
# org-ops / project-ops — the board-ops Skill family (ADR-0005, ISI-3624).
# Privileged capabilities that let CEO/manager roles GROW the squad: create
# agents & skills, delegate work, and (CEO) create/archive projects. They drive
# the run-scoped org-ops seam delivered by ISI-3626 (pkg/orgops), which shares
# the task-io run-token carrier: the operator injects `KSQUAD_COORD_URL` and a
# run-scoped `KSQUAD_COORD_TOKEN`, and every verb is authorized by the token's
# scope — NOT by holding this Skill.
#
# SECURITY MODEL (ADR-0005 D2/D3, enforced in code):
# - The coord derives token scopes from the role's position in the
#   `ksquad.io/reports-to` graph (pkg/orgops DeriveScopes): a manager (a
#   reports-to target) gets `org:write`; the CEO (a manager reporting to no one)
#   also gets `project:write`; an IC/leaf role gets neither and every call below
#   is rejected server-side. Attaching the Skill only ADVERTISES the capability
#   (05-roles.yaml restricts attachment to match) — the token is the real gate.
# - Scopes are coarse: `org:write` authorizes both create-agent and create-skill;
#   `project:write` authorizes create-project and archive-project. There are no
#   finer `agent:create`/`skill:create` scopes.
# - D8: the `permissions` envelope below is never self-widened by the body.
#
# SOURCING: shipped INLINE with executable tool definitions (ADR-0005 rev.2 D4 —
# concrete method/path/schema an agent can call, not advertise-only prose),
# mirroring task-io's inline-while-catalog-settles pattern. The endpoints, env,
# auth and scopes are fixed by ISI-3626 (merged, pkg/orgops); when the coord
# publishes an MCP tool surface these convert to SHA-pinned `mcpToolRefs` catalog
# entries (`K8squad/k8squad-skills`, path `skills/{org-ops,project-ops}`).
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: org-ops
  namespace: bmad-squad
spec:
  source:
    type: inline
    inline: |
      # org-ops — grow the squad (create agents & skills, delegate)

      Privileged board-ops skill. Holding it only ADVERTISES the capability;
      your ACTUAL authority is the run-scoped token, whose `org:write` scope the
      coord derives from your role's position in the reports-to graph (ADR-0005
      D2). IC/leaf roles get no scope and every call below is rejected
      server-side.

      ## Auth (injected at Run start — never the operator's own secrets)
      - `KSQUAD_COORD_URL`   — in-cluster base URL of the coord org-ops seam.
      - `KSQUAD_COORD_TOKEN` — your run-scoped bearer token. Send it as
        `Authorization: Bearer $KSQUAD_COORD_TOKEN`. It is bound to your run and
        carries only the scopes your role was granted; the coord rejects any
        out-of-scope call (D2/D3, enforced in pkg/orgops).

      ## Executable tools (HTTP)
      ### create-agent
          POST $KSQUAD_COORD_URL/api/org-ops/create-agent
          Authorization: Bearer $KSQUAD_COORD_TOKEN
          Content-Type: application/json
          {
            "name": "<agent-name>",
            "runtimeRef": {"name": "<runtime>", "namespace": "bmad-squad"},
            "roleRef":    {"name": "<role>",    "namespace": "bmad-squad"},
            "model": "<model-id>",
            "credentialSecretRef": {"name": "<secret>", "key": "<key>"},
            "skillRefs": [{"name": "<skill>", "namespace": "bmad-squad"}],
            "modelEndpointRef": {"name": "<secret>", "key": "<key>"}
          }
      # skillRefs and modelEndpointRef (BYO endpoint) are optional.
      # → 200 {"kind":"Agent","name":...,"namespace":...,"operation":"created"}

      ### create-skill
          POST $KSQUAD_COORD_URL/api/org-ops/create-skill
          Authorization: Bearer $KSQUAD_COORD_TOKEN
          Content-Type: application/json
          {
            "name": "<skill-name>",
            "source": {"type": "inline", "inline": "<body>"},
            "permissions": ["<perm>"]
          }
      # For a git-sourced skill use:
      #   "source": {"type":"git","git":{"repoRef":"<repo>","ref":"<sha>","path":"<path>"}}
      # → 200 {"kind":"Skill","name":...,"namespace":...,"operation":"created"}

      ## Executable tool (A2A) — delegate / hand work to a teammate
      There is no coord "assign" endpoint. To hand work to a teammate, call their
      A2A agent-card endpoint (agent-to-agent protocol) with the delegation
      payload, using the coord-resolved agent-card URL for the target agent. The
      teammate then acts under THEIR OWN role-scoped token — you cannot widen it.
      (The exact A2A card path/schema is finalized by the A2A carrier work under
      ISI-3626; until then this describes the stable contract.)

      ## Rules
      - Attaching this skill grants no scope; only your role's graph position
        does. Never attempt to widen scope.
      - Confirm intent before creating agents/skills that incur cost.
      - Trust boundary D8: your authority is exactly the `permissions` envelope
        on this Skill CR (`org:write`) intersected with your token scope, never
        self-widened by anything written here.
  permissions:
    - org:write
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: project-ops
  namespace: bmad-squad
spec:
  source:
    type: inline
    inline: |
      # project-ops — create & archive projects

      Privileged board-ops skill. Holding it only ADVERTISES the capability;
      your ACTUAL authority is the run-scoped token. `project:write` is derived
      only for the CEO role (a manager that reports to no one), ADR-0005 D2 — for
      every other role these calls are rejected server-side.

      ## Auth (injected at Run start)
      - `KSQUAD_COORD_URL`   — in-cluster base URL of the coord org-ops seam.
      - `KSQUAD_COORD_TOKEN` — your run-scoped bearer token; send it as
        `Authorization: Bearer $KSQUAD_COORD_TOKEN`.

      ## Executable tools (HTTP)
      ### create-project
          POST $KSQUAD_COORD_URL/api/org-ops/create-project
          Authorization: Bearer $KSQUAD_COORD_TOKEN
          Content-Type: application/json
          {
            "name": "<project-name>",
            "repo": {"url": "<git-url>", "ref": "<ref>"},
            "goals": ["<goal>"]
          }
      # → 200 {"kind":"Project","name":...,"namespace":...,"operation":"created"}

      ### archive-project
          POST $KSQUAD_COORD_URL/api/org-ops/archive-project
          Authorization: Bearer $KSQUAD_COORD_TOKEN
          Content-Type: application/json
          {"name": "<project-name>"}
      # → 200 {"kind":"Project","name":...,"namespace":...,"operation":"archived"}

      ## Rules
      - Attaching this skill grants no scope; only the CEO role's graph position
        does. Never attempt to widen scope.
      - Trust boundary D8: your authority is exactly the `permissions` envelope
        (`project:write`) intersected with your token scope, never self-widened.
  permissions:
    - project:write
