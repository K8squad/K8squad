# Story 1.3: ValidatingWebhookConfiguration aggregate. manifests.yaml is
# generated by `make manifests` (controller-gen webhook generator) from the
// +kubebuilder:webhook markers in internal/webhook/v1alpha1/webhook.go.
# caBundle injection (cert-manager or the Helm chart's provisioner, story
# 1.4) happens in the chart overlay — this kustomization stays raw.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- manifests.yaml
- service.yaml
