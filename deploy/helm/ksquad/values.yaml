# ─────────────────────────────────────────────────────────────────────────────
# KSquad chart values — scoped view (ISI-2149)
#
# This file focuses on the two concerns the chart must CREATE, never assume:
#   • exposure.*  — Gateway API (or graceful fallbacks) for console + apiserver
#   • storage.*   — every PVC's StorageClass, never the cluster default
#
# Other control-plane knobs (operator/apiserver/console images, replicas, NATS
# tuning, RBAC) are layered by their own tickets; the seams below are what
# ISI-2149 pins.
# ─────────────────────────────────────────────────────────────────────────────

nameOverride: ""
fullnameOverride: ""

# ─────────────────────────────────────────────────────────────────────────────
# Workload Deployments (ISI-2913 / Story 9.5)
# ─────────────────────────────────────────────────────────────────────────────

# ── console (Next.js BFF + frontend, ISI-2180) ──────────────────────────────
console:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k8squad/ksquad-console
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  service:
    port: 80
    targetPort: 3000

# ── operator (controller-runtime reconcilers, §9.4 / Epic 2/3/4/11) ─────────
operator:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k8squad/ksquad-operator
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  database:
    existingSecret: "" # empty → derived CNPG app secret <fullname>-pg-app
    existingSecretKey: uri
  # shimRuntimeType selects the A2A shim runtime flavor (KSQUAD_RUNTIME_TYPE,
  # one of the registered v1 set: openclaw | hermes | opencode) the operator
  # spawns per dispatched Run (ISI-3352). Empty = dispatch fails loudly with
  # "no runtime selected" — set it once the runtime CLI is reachable in the
  # operator image/topology (the pod-side supervisor ADR tracks the endgame).
  shimRuntimeType: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# ── scm-webhook (Story 11.1 HMAC-verified SCM ingress) ──────────────────────
scmWebhook:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k8squad/ksquad-scm-webhook
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# ── event-relay (Story 12.1 outbox→NATS relay, ISI-2260) ────────────────────
eventRelay:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k8squad/ksquad-event-relay
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  database:
    existingSecret: "" # empty → derived CNPG app secret <fullname>-pg-app
    existingSecretKey: uri
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
apiserver:
  # The ksquad-apiserver HTTP host (ISI-2750, §17.3) — the binary the console BFF
  # proxies to. Mounts the §7.5 discussion surface behind the §13 authz choke
  # point, hosts the §4.4 SSE run-progress hub, and serves health/readiness.
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k8squad/ksquad-apiserver
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  # DATABASE_URL source. By default the chart reads the CNPG-generated app secret
  # (`<release>-pg-app`, key `uri`) — the same store of record the operator uses.
  # Override existingSecret/existingSecretKey to point at your own secret.
  database:
    existingSecret: "" # empty → derived CNPG app secret <fullname>-pg-app
    existingSecretKey: uri
  # Name of the HttpOnly session cookie the BFF forwards (arch §12.3/ADR-033).
  # MUST match the console's KSQUAD_SESSION_COOKIE.
  sessionCookie: ksquad_session

  # ── Epic 15 auth seam (9.5 / ISI-2920) ────────────────────────────────────
  auth:
    # HS256 signing key for the internal JWT. SUPPLY A DURABLE ONE for any
    # multi-replica or restart-surviving install (auto-generated per-pod
    # otherwise — sessions die on every restart and replicas disagree).
    # Value is raw or base64 bytes; >= 32 bytes required.
    jwtSigningKey: "" # e.g. from `openssl rand -base64 32`
    jwtTtlSeconds: 3600 # internal JWT lifetime (spec 15.1: 1h)
    sessionTtlSeconds: 86400 # edge session lifetime (24h)
    # Failed-login brake (only FAILURES count; successes reset the window).
    loginRateLimit: 5
    loginRateWindowSeconds: 900
    # Secure attribute on issued cookies. Keep true behind chart TLS; a local
    # http dev run may set false explicitly.
    secureCookies: true
    # Comma-separated IPs/CIDRs whose X-Forwarded-For the login limiter may
    # trust (e.g. the console BFF pod range). EMPTY = trust no proxy: client IP
    # falls back to the socket address. Do not widen this blindly.
    trustedProxies: ""
    # Browser origins accepted on cookie-authenticated state changes (CSRF
    # guard). List the PUBLIC console origin, e.g. https://console.ksquad.example.com.
    # Empty = strict same-host Origin matching (direct exposure only).
    allowedOrigins: ""
    # Max simultaneous argon2id derivations (each holds 64 MiB; default 2 fits
    # the 256Mi limit — raise together with resources.limits.memory).
    maxHashConcurrency: 2
    # Raw JSON of the 15.9 OIDC group→access mapping (validated at startup,
    # consumed by the OIDC login leg).
    oidcGroupMapping: ""
    # Secret refs for the sensitive values — preferred over the plain values:
    #   existingJwtKeySecret: { name: my-secret, key: signing-key }
    #   existingBootstrapPasswordSecret: { name: my-secret, key: admin-password }
    existingJwtKeySecret: null
    existingBootstrapPasswordSecret: null
    # One-time initial admin (15.2). Created ONLY when the user table is empty.
    # CLEAR THE PASSWORD after first login — it should not live in values.
    bootstrap:
      adminUsername: ""
      adminPassword: ""
      adminTeamId: "" # optional uuid; empty = auto-generated tenancy root
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# ═════════════════════════════════════════════════════════════════════════════
# Exposure — the chart CREATES exposure, it does not assume it (§16.1, FR-L1…L3)
# ═════════════════════════════════════════════════════════════════════════════
exposure:
  # REQUIRED, no default guess. One of:
  #   gateway   — renders Gateway + HTTPRoutes; sets the apiserver route timeout
  #               to 0s for SSE (preferred production path). Requires
  #               gateway.gatewayClassName. NOTE: HTTPRoute.timeouts is Extended
  #               conformance — Envoy Gateway/Istio honor 0s, Traefik survives via
  #               no-default, Cilium may ignore it (verify per class; see README).
  #   ingress   — renders a plain Ingress with SSE-safe annotations. Graceful
  #               degrade for clusters with an Ingress controller but no Gateway API.
  #   clusterip — renders Services only (reach console via port-forward / your LB).
  #               Zero-dependency path; always brings the stack up on a bare cluster.
  # No mode is a blanket SSE guarantee: gateway depends on GatewayClass timeout
  # support, ingress on controller annotations — an honest trade, surfaced not hidden.
  mode: gateway

  # Hostnames route by host in gateway/ingress modes (REQUIRED there, ignored
  # for clusterip).
  hostnames:
    console: "" # e.g. ksquad.example.com
    apiserver: "" # e.g. api.ksquad.example.com   (the SSE endpoint, §13)

  gateway:
    # REQUIRED when mode=gateway. The chart REFERENCES an operator-provided
    # GatewayClass and NEVER creates one. cilium | envoy | istio | traefik are
    # all valid — the install pre-flights that the class exists (helm will fail
    # fast if this is empty).
    gatewayClassName: ""
    listeners:
      http:
        enabled: true
        port: 80
      https:
        enabled: true
        port: 443
        # REQUIRED when https.enabled: the TLS cert Secret (terminate at gateway).
        certSecretName: ""
    # Redirect http→https at the gateway edge (renders a RequestRedirect route
    # on the http listener). Ignored unless both listeners are enabled.
    httpsRedirect: true
    # Extra annotations/labels for the Gateway object (controller-specific tuning).
    annotations: {}
    labels: {}

  ingress:
    className: "" # REQUIRED when mode=ingress
    # SSE-safe defaults for the nginx ingress controller. Override for others.
    # These keep the apiserver progress stream (§13) from being buffered/timed out.
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: "" # REQUIRED when tls.enabled

# ═════════════════════════════════════════════════════════════════════════════
# Storage — every PVC's StorageClass comes from values, NEVER the cluster
# default (§16.2 / §9.4, FR-L2). An unset class fails the install fast.
# ═════════════════════════════════════════════════════════════════════════════
storage:
  # Global fallback StorageClass for every PVC family below. REQUIRED unless
  # each family sets its own. There is no silent cluster-default fallback.
  #
  # StorageClass CAPABILITY MATRIX — pre-flight your class against what you need:
  #   ReadWriteOnce (RWO)  — every class. The default; pairs with worktree-per-Run.
  #   ReadWriteMany (RWX)  — only some classes (CephFS, NFS, Azure Files, EFS…).
  #                          Required only if you set workspace.accessMode=RWX for
  #                          true parallel-Run write access (§9.4).
  #   volume expansion     — needs allowVolumeExpansion=true on the class.
  #   snapshots            — needs a CSI driver + VolumeSnapshotClass.
  storageClassName: ""

  # CNPG Postgres — the chart renders a CloudNativePG `Cluster` CR whose PVC
  # StorageClass is set here (never omitted → never cluster-default).
  postgres:
    storageClassName: "" # falls back to storage.storageClassName
    size: 10Gi
    instances: 1 # single-instance default profile; raise for HA (§16)
    # Optional dedicated WAL volume (recommended in prod). Same class rules.
    walStorage:
      enabled: false
      size: 2Gi

  # Per-Project workspace PVCs are created by the OPERATOR at Project reconcile,
  # not by Helm. The chart hands the operator the StorageClass + access mode to
  # stamp onto each Project PVC via its config (see operator-config ConfigMap).
  workspace:
    storageClassName: "" # falls back to storage.storageClassName
    # RWO default (worktree-per-Run, §9.4). Set ReadWriteMany ONLY if your class
    # supports RWX — that enables true parallel-Run writes.
    accessMode: ReadWriteOnce
    size: 20Gi

  # NATS/JetStream file store PVC (dependency #2, §16). StorageClass drives the
  # parent-rendered JetStream StatefulSet's volumeClaimTemplate (see `nats:`
  # below); never left to cluster-default. Fail-fast when unset AND nats.enabled.
  nats:
    storageClassName: "" # falls back to storage.storageClassName
    size: 5Gi

# ═════════════════════════════════════════════════════════════════════════════
# NATS / JetStream — the plugin event bus (stateful dependency #2)
#   §16 / §17.4 / ADR-023 — "data in Postgres, events on NATS" (CEO 2026-08-11).
#   The chart brings NATS up itself as a parent-rendered JetStream StatefulSet
#   (same packaging pattern as the CNPG `Cluster` CR) so the JetStream file-store
#   PVC's StorageClass stays the first-class `storage.nats.storageClassName` knob
#   (§16.2) — never the cluster default. JetStream is ENABLED (the plugin
#   replay/catch-up substrate). NATS holds NO state of record (Postgres is the
#   sole source-of-truth, ADR-001) — only in-flight/replayable event copies.
# ═════════════════════════════════════════════════════════════════════════════
nats:
  # The event bus is ON by default (one `helm install` yields the whole stack,
  # §16). Turning it OFF must NEVER break the core install — the outbox buffers
  # and the relay is best-effort, so NATS-down never blocks a Run/claim/write.
  enabled: true
  image: nats:2.10-alpine
  port: 4222
  jetstream:
    enabled: true # JetStream ON — replay/catch-up for plugins (§17.4)
    maxFileStore: 4GB
  ha:
    enabled: false
    replicas: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Egress configuration for Projects (story 4.6, ISI-2888)
# This controls the default-deny + allowlist egress policy structure applied
# to each Project's Run workloads. When enabled, the operator will create
# NetworkPolicies for Projects that specify egressPolicyRef.
egress:
  # Enable egress policy reconciliation for Projects
  enabled: true
  
  # Default egress proxy configuration. Projects can override this by
  # specifying their own egressPolicyRef.
  defaultEgressProxy:
    # Service name of the egress proxy in each team namespace
    service: "egress-proxy"
    # Port the egress proxy listens on
    port: 8080
    
  # NetworkPolicy configuration for egress control
  networkPolicy:
    # Default-deny policy name prefix
    defaultDenyName: "ksquad-default-deny"
    # Project-specific egress policy name prefix
    projectEgressPrefix: "ksquad-egress"
    
  # Allowed egress destinations by default
  defaultAllow:
    # DNS resolution is always allowed
    dns:
      enabled: true
      ports:
        - protocol: "TCP"
          port: 53
        - protocol: "UDP" 
          port: 53
    # Control plane communication (API server, health checks)
    controlPlane:
      enabled: true
      ports:
        - protocol: "TCP"
          port: 443  # HTTPS (API server)
        - protocol: "TCP"
          port: 8080 # Health/proxy ports
  image: nats:2.10-alpine
  port: 4222
  jetstream:
    enabled: true # JetStream ON — replay/catch-up for plugins (§17.4)
    # Max on-disk JetStream file store. Keep ≤ storage.nats.size (5Gi).
    # This is a nats-server config size, emitted UNQUOTED into nats.conf (see
    # templates/nats.yaml): 4GB == 4Gi == 4*1024^3 bytes to nats. Do NOT quote
    # a multi-char suffix in the template — nats fails to parse "4GB"/"4Gi".
    maxFileStore: 4GB
  # SINGLE-REPLICA DEFAULT. HA = ha.enabled:true → a clustered JetStream RAFT
  # quorum (odd replicas ≥ 3). Same toggle SHAPE as storage.postgres.instances
  # (CNPG). Off = one lightweight replica, keeping the ≤4h install (S1) true.
  ha:
    enabled: false
    replicas: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Egress configuration for Projects (story 4.6, ISI-2888)
# This controls the default-deny + allowlist egress policy structure applied
# to each Project's Run workloads. When enabled, the operator will create
# NetworkPolicies for Projects that specify egressPolicyRef.
egress:
