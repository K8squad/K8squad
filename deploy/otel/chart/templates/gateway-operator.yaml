{{- /*
Mode: operator — OpenTelemetryCollector CR managed by the otel-operator.
The operator derives Service "<name>-collector" and ServiceAccount
"<name>-collector" from the CR name, satisfying the platform contract.
*/ -}}
{{- include "k8squad-otel.validate" . -}}
{{- if eq .Values.collector.mode "operator" }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Values.collector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.collector.name }}
    ksquad.io/component: telemetry-gateway
    {{- include "k8squad-otel.labels" . | nindent 4 }}
spec:
  mode: deployment
  observability:
    metrics:
      enableMetrics: true
  replicas: {{ .Values.collector.replicas }}
  image: {{ .Values.collector.image }}
  env:
    - name: KSQUAD_OTLP_AUTH
      valueFrom:
        secretKeyRef:
          name: {{ .Values.collector.authSecretRef.name }}
          key: {{ .Values.collector.authSecretRef.key }}
  config: |
    {{- include "k8squad-otel.gatewayConfig" . | nindent 4 }}
{{- end }}
