<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Message Color Specification</text>
  
  <!-- Current Colors -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" fill="#ffffff" font-size="16" font-weight="600">Current Colors:</text>
    
    <!-- Current Agent -->
    <text x="0" y="30" fill="#cbd5e1" font-size="14">Agent Message</text>
    <rect x="0" y="40" width="150" height="80" fill="#f8f9fa" stroke="#e2e8f0" stroke-width="1" rx="5"/>
    <circle cx="20" cy="60" r="12" fill="#64748b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="64" text-anchor="middle" fill="#ffffff" font-size="8">A</text>
    <rect x="40" y="50" width="40" height="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="60" y="59" text-anchor="middle" fill="#64748b" font-size="7">agent</text>
    <text x="40" y="80" fill="#475569" font-size="9">Unknown Agent</text>
    <text x="40" y="95" fill="#64748b" font-size="8">Generic styling</text>
    
    <!-- Current Human -->
    <text x="0" y="150" fill="#cbd5e1" font-size="14">Human Message</text>
    <rect x="0" y="160" width="150" height="80" fill="#f8f9fa" stroke="#e2e8f0" stroke-width="1" rx="5"/>
    <circle cx="20" cy="180" r="12" fill="#64748b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="184" text-anchor="middle" fill="#ffffff" font-size="8">H</text>
    <rect x="40" y="170" width="40" height="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="60" y="179" text-anchor="middle" fill="#64748b" font-size="7">human</text>
    <text x="40" y="200" fill="#475569" font-size="9">Human User</text>
    <text x="40" y="215" fill="#64748b" font-size="8">Generic styling</text>
  </g>
  
  <!-- Proposed Colors -->
  <g transform="translate(400, 80)">
    <text x="0" y="0" fill="#ffffff" font-size="16" font-weight="600">Proposed Colors:</text>
    
    <!-- Proposed Agent -->
    <text x="0" y="30" fill="#4caf50" font-size="14">Agent Message</text>
    <rect x="0" y="40" width="150" height="80" fill="#e0f2f1" stroke="#80cbc4" stroke-width="2" rx="5"/>
    <circle cx="20" cy="60" r="12" fill="#00bcd4" stroke="#00acc1" stroke-width="2"/>
    <text x="20" y="64" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="bold">A</text>
    <rect x="40" y="50" width="45" height="12" fill="#00bcd4" stroke="#00acc1" stroke-width="1" rx="6"/>
    <text x="62.5" y="59" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="bold">AGENT</text>
    <text x="40" y="80" fill="#00695c" font-size="9" font-weight="600">CodeBot Agent</text>
    <text x="40" y="95" fill="#00695c" font-size="8">Teal theme #00bcd4</text>
    
    <!-- Proposed Human -->
    <text x="0" y="150" fill="#4caf50" font-size="14">Human Message</text>
    <rect x="0" y="160" width="150" height="80" fill="#f1f8e9" stroke="#c5e1a5" stroke-width="2" rx="5"/>
    <circle cx="20" cy="180" r="12" fill="#4caf50" stroke="#388e3c" stroke-width="2"/>
    <text x="20" y="184" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="bold">H</text>
    <rect x="40" y="170" width="45" height="12" fill="#4caf50" stroke="#388e3c" stroke-width="1" rx="6"/>
    <text x="62.5" y="179" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="bold">HUMAN</text>
    <text x="40" y="200" fill="#33691e" font-size="9" font-weight="600">Sarah Johnson</text>
    <text x="40" y="215" fill="#33691e" font-size="8">Green theme #4caf50</text>
  </g>
  
  <!-- Color Palette -->
  <g transform="translate(50, 350)">
    <text x="0" y="0" fill="#ffffff" font-size="16" font-weight="600">Color Palette:</text>
    
    <!-- Agent Colors -->
    <rect x="0" y="20" width="60" height="30" fill="#00838f"/>
    <text x="70" y="40" fill="#e0f2f1" font-size="12">Agent Chip: #00838f</text>
    
    <rect x="0" y="60" width="60" height="30" fill="#e0f2f1"/>
    <text x="70" y="80" fill="#00695c" font-size="12">Agent Message: #e0f2f1</text>
    
    <!-- Human Colors -->
    <rect x="250" y="20" width="60" height="30" fill="#4caf50"/>
    <text x="320" y="40" fill="#ffffff" font-size="12">Human Background: #4caf50</text>
    
    <rect x="250" y="60" width="60" height="30" fill="#f1f8e9"/>
    <text x="320" y="80" fill="#ffffff" font-size="12">Human Message: #f1f8e9</text>
    
    <!-- Border Colors -->
    <rect x="500" y="20" width="60" height="30" fill="#80cbc4"/>
    <text x="570" y="40" fill="#ffffff" font-size="12">Agent Border: #80cbc4</text>
    
    <rect x="500" y="60" width="60" height="30" fill="#c5e1a5"/>
    <text x="570" y="80" fill="#ffffff" font-size="12">Human Border: #c5e1a5</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" fill="#ffffff" font-size="14" font-weight="600">Visual Improvements:</text>
    <text x="0" y="25" fill="#4caf50" font-size="12">• 300% higher contrast between agent and human messages</text>
    <text x="0" y="45" fill="#4caf50" font-size="12">• Color-coded chips with white text for immediate recognition</text>
  </g>
</svg>