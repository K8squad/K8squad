{{- /* Always-rendered: the backends every exposure.mode routes to.
       Also the single include site for ksquad.validate so any values error
       fails the whole render fast. */ -}}
{{- include "ksquad.validate" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ksquad.console.fullname" . }}
  labels:
    {{- include "ksquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: {{ .Values.console.service.targetPort }}
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ksquad.apiserver.fullname" . }}
  labels:
    {{- include "ksquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: apiserver
  ports:
    - name: http
      port: {{ .Values.apiserver.service.port }}
      targetPort: {{ .Values.apiserver.service.targetPort }}
      protocol: TCP
