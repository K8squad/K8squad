                      this is a full http(s) URL (typically .../v1/traces, .../v1/metrics,
                      .../v1/logs).
                    maxLength: 2048
                    minLength: 1
                    type: string
                  protocol:
                    description: Protocol used to export the signal.
                    enum:
                    - grpc
                    - http/protobuf
                    - http/json
                    type: string
                  resourceAttributes:
                    additionalProperties:
                      type: string
                    description: |-
                      ResourceAttributes are merged into the OTel resource attributes of the
                      exported signal. Keys owned by the platform (service.instance.id) are
                      rejected.
                    maxProperties: 64
                    type: object
                  sampling:
                    description: Sampling configures the head sampler. Traces only.
                    properties:
                      ratio:
                        description: |-
                          Ratio is the fraction of traces kept when Type is probabilistic.
                          Required and in (0, 1] for probabilistic; forbidden otherwise.
                        maximum: 1
                        minimum: 0
                        type: number
                      type:
                        description: Type selects the sampler.
                        enum:
                        - always_on
                        - always_off
                        - probabilistic
                        type: string
                    required:
                    - type
                    type: object
                required:
                - endpoint
                - protocol
                type: object
                x-kubernetes-validations:
                - message: endpoint must not contain whitespace
                  rule: self.endpoint.matches('^[^[:space:]]+$')
                - message: grpc endpoint must be host[:port] with an optional http(s)
                    scheme and no path
                  rule: self.protocol != 'grpc' || self.endpoint.matches('^(https?://)?[^/[:space:]]+(:[[:digit:]]+)?$')
                - message: http/protobuf and http/json endpoints must be full http(s)
                    URLs
                  rule: '!self.protocol.startsWith(''http/'') || self.endpoint.matches(''^https?://[^[:space:]]+$'')'
                - message: sampling.ratio is required and must be > 0 when sampling.type
                    is probabilistic
                  rule: '!has(self.sampling) || self.sampling.type != ''probabilistic''
                    || (has(self.sampling.ratio) && self.sampling.ratio > 0)'
                - message: sampling.ratio must only be set when sampling.type is probabilistic
                  rule: '!has(self.sampling) || self.sampling.type == ''probabilistic''
                    || !has(self.sampling.ratio)'
            type: object
            x-kubernetes-validations:
            - message: at least one signal (traces, metrics, logs) must be configured
                — OTelConfig exports nothing by default
              rule: has(self.traces) || has(self.metrics) || has(self.logs)
          status:
            description: OTelConfigStatus defines the observed state of OTelConfig.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation most recently
                  reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
