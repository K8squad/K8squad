    description: 'K8squad control plane — Kubernetes-native AI agent squad orchestration.
      Installs the control-plane namespace and (when enabled) the control-plane services
      (apiserver, operator, console, memory, scm-webhook, event bus). This chart ships
      NO CRDs: the ksquad.io CRDs are owned by the standalone, independently-versioned
      k8squad-crds chart (config/helm-crds), which must be installed/upgraded first
      (ADR-0002, Option B). '
