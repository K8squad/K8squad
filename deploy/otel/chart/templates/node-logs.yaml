{{- /*
Node-logs DaemonSet — plain manifests in every mode (it is not operator-managed
in the live topology either). Exports to the in-chart gateway Service, or to
collector.external.endpoint when collector.mode=external.
*/ -}}
{{- include "k8squad-otel.validate" . -}}
{{- if .Values.nodeLogs.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-node-logs
  namespace: {{ .Release.Namespace }}
  labels:
    ksquad.io/component: telemetry-node-logs
    {{- include "k8squad-otel.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-node-logs
  namespace: {{ .Release.Namespace }}
  labels:
    ksquad.io/component: telemetry-node-logs
    {{- include "k8squad-otel.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "k8squad-otel.nodeLogsConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-node-logs
  namespace: {{ .Release.Namespace }}
  labels:
    ksquad.io/component: telemetry-node-logs
    {{- include "k8squad-otel.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-node-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-node-logs
        ksquad.io/component: telemetry-node-logs
    spec:
      serviceAccountName: otel-node-logs
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ .Values.nodeLogs.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/config.yaml
          ports:
            - name: health
              containerPort: 13133
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.nodeLogs.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: otelcol-state
              mountPath: /var/lib/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-node-logs
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: otelcol-state
          emptyDir: {}
{{- end }}
