{{- if .Values.controlPlane.enabled }}
{{- $ns := include "k8squad.namespace" . }}
{{- $c := "operator" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksquad-operator
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
spec:
  {{- /* Honor an explicit 0 (operator-less secondary/preview install, ISI-3984/ISI-4019).
         `| default 1` treats sprig-empty 0 as unset and would silently render 1, defeating
         the documented `controlPlane.operator.replicas: 0` opt-out. Only default when nil. */}}
  replicas: {{ if kindIs "invalid" .Values.controlPlane.operator.replicas }}1{{ else }}{{ .Values.controlPlane.operator.replicas }}{{ end }}
  selector:
    matchLabels:
      {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 8 }}
    spec:
      serviceAccountName: ksquad-operator
      securityContext:
        runAsNonRoot: true
      containers:
      - name: operator
        image: {{ include "k8squad.image" (dict "root" $ "component" $c) }}
        imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy | default "IfNotPresent" }}
        args:
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --leader-elect={{ .Values.controlPlane.operator.leaderElect | default true }}
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        env:
        # The control-plane namespace this pod runs in. resolveTelemetryOptions
        # (cmd/operator) reads $POD_NAMESPACE to resolve an OTelConfig auth Secret
        # that omits an explicit namespace; without it the code falls back to a
        # hardcoded default that need not match the release namespace, so the
        # Dynatrace token Secret is looked up in a non-existent namespace, the
        # lookup fails, and EVERY signal (traces/metrics/logs) silently drops to
        # the stdout default — nothing reaches the gateway (ISI-4102/ISI-4146).
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- include "k8squad.databaseEnv" . | nindent 8 }}
        {{- include "k8squad.otelEnv" . | nindent 8 }}
        {{- /* ISI-3680 (E3-S2, AD-7): exact apiserver ServiceAccount name and
               control-plane namespace for the get-only credential-tester
               RoleBinding the Team reconciler provisions inside every squad
               namespace (the contained Secret read behind POST
               /api/credentials/{name}/test). Rendered from the chart's own
               serviceaccount naming + namespace so they cannot drift from the
               real subject. */}}
        - name: KSQUAD_APISERVER_SERVICE_ACCOUNT
          value: ksquad-apiserver
        - name: KSQUAD_APISERVER_NAMESPACE
          value: {{ include "k8squad.namespace" . | quote }}
        - name: KSQUAD_TOOLCHAIN_CLUSTER_SCOPE_ENABLED
          value: {{ .Values.tools.rbac.clusterScopeEnabled | default false | quote }}
        {{- /* ISI-4384 (WS-E/D5): the NATS client URL the operator TCP-dials for
               the ksquad.dependency.up{dep="nats"} health gauge. Same address the
               event-relay drains to; unset ⇒ the operator skips the nats probe
               (no misleading "down") rather than dialing nothing. */}}
        - name: KSQUAD_NATS_URL
          value: {{ include "k8squad.nats.url" . | quote }}
        {{- /* ISI-3745: hand the operator the workspace PVC StorageClass / size /
               access mode from Helm values so every per-Run workspace PVC comes
               from the storage contract, never the cluster default (which on
               k8squad-test has no `standard` class → PVC Pending → Run stranded).
               An empty defaultClass is omitted here and the operator falls back
               to its compile-time default (pkg/workspace/manager.go). */}}
        {{- with .Values.workspacePVC.defaultClass }}
        - name: KSQUAD_WORKSPACE_STORAGE_CLASS
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.workspacePVC.defaultSize }}
        - name: KSQUAD_WORKSPACE_PVC_SIZE
          value: {{ . | quote }}
        {{- end }}
        {{- with (first .Values.workspacePVC.defaultAccessModes) }}
        - name: KSQUAD_WORKSPACE_ACCESS_MODE
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.controlPlane.operator.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          {{- toYaml (.Values.controlPlane.operator.resources | default dict) | nindent 10 }}
---
# Metrics Service for OTel/Prometheus scrape of the manager (:8080).
apiVersion: v1
kind: Service
metadata:
  name: ksquad-operator-metrics
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
spec:
  selector:
    {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 4 }}
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
{{- end }}
