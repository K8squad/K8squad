{{/*
  Control-plane (release-namespace) default-deny NetworkPolicy.

  POSTURE (ISI-3907): the release namespace is the CONTROL PLANE — operator,
  apiserver, console, gateway, NATS, event-relay, scm-webhook and Postgres
  (CNPG) all run here. arch §12.2 grants the control plane HIGH-TRUST egress,
  and this namespace is NOT a tenant Run-workload namespace, so it must NOT
  inherit the blanket default-deny baseline. The tenant baseline (default-deny
  + allowlists) is stamped by the OPERATOR into squad/team namespaces at
  runtime (story 4.6 / ISI-2884) — that is where it belongs, NOT in this chart.

  Consequently this blanket default-deny is OPT-IN and OFF by default
  (egress.networkPolicy.releaseNamespaceDefaultDeny). Rendering it without a
  matching allow (carve-out) policy for EVERY control-plane component starves
  the entire control plane on any enforcing CNI. Only the apiserver (below)
  and the otel-collector (otel-collector-networkpolicy.yaml) have carve-outs
  today; the full set (operator/console/gateway/NATS/event-relay/scm-webhook +
  CNPG replication) is tracked in ISI-3910. Do NOT enable in production until
  ISI-3910 lands.
*/}}
{{- if and .Values.egress.enabled (dig "networkPolicy" "releaseNamespaceDefaultDeny" false .Values.egress) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.egress.networkPolicy.defaultDenyName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ksquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: networkpolicy
    app.kubernetes.io/name: egress-default-deny
spec:
  policyTypes:
  - Egress
  - Ingress
  egress:
  # Default deny: no egress traffic allowed by default
  ingress:
  # Default deny: no ingress traffic allowed by default
  podSelector: {}
  # Apply to all pods in the namespace as baseline
---
{{/*
  Apiserver egress carve-out over the release-namespace default-deny
  (ISI-3906). Only meaningful when releaseNamespaceDefaultDeny is ON — a
  carve-out with no deny to carve would ITSELF restrict the high-trust
  apiserver (any egress policy selecting a pod restricts it to the listed
  destinations), so it is gated on the default-deny toggle. Mirrors the
  otel-collector pattern: the governed hop to model providers (credential
  test-connection, ISI-3680/ISI-3891) is 443/TCP to destinations OUTSIDE the
  excepted in-cluster/private ranges only — RFC1918, CGNAT and link-local
  (the cloud metadata service) are denied by rule, and pkg/probeegress adds
  its own declarative SSRF/DNS-rebind containment at the dial seam on top.
  DNS, in-namespace peers (Postgres) and kube-system (kube-api on 443/6443)
  ride along so the carve-out keeps the apiserver functional, not just
  probeable.
*/}}
{{- if and .Values.egress.enabled
           (dig "networkPolicy" "releaseNamespaceDefaultDeny" false .Values.egress)
           (dig "networkPolicy" "apiserverEgress" "enabled" false .Values.egress) }}
{{- $apiserverName := include "ksquad.apiserver.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $apiserverName }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ksquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
    app.kubernetes.io/name: ksquad-apiserver-egress
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: apiserver
  egress:
    # DNS resolution (always) — CoreDNS lives in kube-system.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # In-cluster peers: the release namespace's own services (Postgres,
    # NATS, console BFF targets) on any port.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    # Kubernetes API — the default Service VIP resolves to hostNetwork
    # control-plane nodes (kube-system) on 443/6443.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Governed hop to model providers (ISI-3906): external 443 only —
    # private/in-cluster/link-local ranges are carved out so the probe
    # cannot become a control-plane-internal reachability oracle at the
    # NetworkPolicy layer.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml (dig "networkPolicy" "apiserverEgress" "exceptCIDRs" (list) .Values.egress) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}