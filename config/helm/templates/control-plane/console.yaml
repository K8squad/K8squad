{{- if .Values.controlPlane.enabled }}
{{- $ns := include "k8squad.namespace" . }}
{{- $c := "console" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksquad-console
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.console.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 8 }}
    spec:
      serviceAccountName: ksquad-console
      securityContext:
        runAsNonRoot: true
      containers:
      - name: console
        image: {{ include "k8squad.image" (dict "root" $ "component" $c) }}
        imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        # BFF (console/lib/bff.ts) proxies server-side to the apiserver.
        - name: KSQUAD_APISERVER_URL
          value: "http://ksquad-apiserver.{{ $ns }}.svc:8080"
        {{- include "k8squad.otelEnv" . | nindent 8 }}
        {{- with .Values.controlPlane.console.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          # Next.js standalone server writes its runtime cache; leave the root
          # FS writable (still non-root, no privilege escalation, no caps).
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          {{- toYaml (.Values.controlPlane.console.resources | default dict) | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ksquad-console
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
spec:
  selector:
    {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 4 }}
  ports:
  - name: http
    port: 80
    targetPort: http
{{- end }}
