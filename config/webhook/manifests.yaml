---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-ksquad-io-v1alpha1-otelconfig
  failurePolicy: Fail
  name: votelconfig-v1alpha1.ksquad.io
  rules:
  - apiGroups:
    - ksquad.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - otelconfigs
  sideEffects: None
