{{- if .Values.controlPlane.enabled }}
{{- $ns := include "k8squad.namespace" . }}
{{- $c := "apiserver" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksquad-apiserver
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.apiserver.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 8 }}
    spec:
      serviceAccountName: ksquad-apiserver
      securityContext:
        runAsNonRoot: true
      containers:
      - name: apiserver
        image: {{ include "k8squad.image" (dict "root" $ "component" $c) }}
        imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: HTTP_PORT
          value: "8080"
        {{- include "k8squad.databaseEnv" . | nindent 8 }}
        - name: KSQUAD_OPERATOR_METRICS_URL
          value: "http://ksquad-operator-metrics.{{ $ns }}.svc:8080/metrics"
        {{- include "k8squad.otelEnv" . | nindent 8 }}
        {{- include "k8squad.bootstrapAdminEnv" . | nindent 8 }}
        {{- include "k8squad.secureCookiesEnv" . | nindent 8 }}
        {{- with .Values.controlPlane.apiserver.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # /healthz is liveness-only (never DB-gated); /readyz gates on a DB ping so
        # a Postgres-down pod is pulled from Service endpoints instead of routed traffic.
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          {{- toYaml (.Values.controlPlane.apiserver.resources | default dict) | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ksquad-apiserver
  namespace: {{ $ns }}
  labels:
    {{- include "k8squad.componentLabels" (dict "root" $ "component" $c) | nindent 4 }}
spec:
  selector:
    {{- include "k8squad.componentSelectorLabels" (dict "root" $ "component" $c) | nindent 4 }}
  ports:
  - name: http
    port: 8080
    targetPort: http
{{- end }}
