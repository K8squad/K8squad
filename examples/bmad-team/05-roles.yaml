# One Role per BMAD function (arch §5.1). Each carries:
#   - promptRef      → its behavior ConfigMap (04-prompts.yaml)
#   - defaultSkills  → Skills granted to any Agent assuming the role
#   - labels         → the reporting hierarchy (ksquad.io/reports-to), since the
#                      CRD model has no manager edge
#   - runtimeClassHint → sandbox posture for execution-heavy roles (gvisor)
#
# Skill wiring: every role gets `bmad` and `task-io` (the union baseline — a
# working agent can always re-read/comment on/status its own task, ISI-3602);
# coder/devops/code-reviewer add `github`; observability-engineer adds
# `dynatrace`; graphical-designer adds `graphical`.
#
# Board-ops (ADR-0005 D2): the CEO + manager roles (ceo, product-manager,
# architect, ux-designer — the roles that are a `ksquad.io/reports-to` target)
# add `org-ops`; `project-ops` is CEO-only. IC/leaf roles get neither.
# Attaching a board-ops Skill is advisory advertisement ONLY — the real
# authority is the run-scoped token, whose `org:write`/`project:write` scope the
# coord derives from this reports-to graph (pkg/orgops DeriveScopes, ISI-3626),
# not from attachment. A leaf role that somehow carried the Skill would still be
# denied server-side.
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: ceo
  namespace: bmad-squad
  labels:
    ksquad.io/bmad-role: ceo
spec:
  promptRef:
    name: ceo-prompt
  defaultSkills:
    - name: bmad
    - name: task-io
    - name: org-ops
    - name: project-ops
---
