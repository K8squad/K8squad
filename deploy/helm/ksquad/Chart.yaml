apiVersion: v2
name: ksquad
description: >-
  KSquad — Kubernetes-native, agent-agnostic AI agent orchestration platform.
  This chart brings up the ksquad-system control plane and CREATES (never
  assumes) its exposure and storage: Gateway API resources for console +
  apiserver, and PVCs whose StorageClass is parameterized — never the cluster
  default. See §16.1 (exposure), §16.2 (storage), §9.4 (workspace) of the
  architecture, and ISI-2149.
type: application
# Chart version tracks the chart; appVersion tracks the KSquad control plane.
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.29.0-0"
keywords:
  - ai-agents
  - orchestration
  - gateway-api
  - operator
home: https://github.com/K8squad/K8squad
sources:
  - https://github.com/K8squad/K8squad
maintainers:
  - name: KSquad
# NOTE: the CloudNativePG operator is a cluster prerequisite (see README); this
# chart renders a CNPG `Cluster` CR whose PVC StorageClass it parameterizes.
# NATS/JetStream (dependency #2 — the plugin event bus, §16/§17.4/ADR-023) is
# brought up by the chart itself as a parent-rendered JetStream StatefulSet
# (ISI-2253) — same packaging pattern as the CNPG Cluster CR, so the JetStream
# file-store PVC's StorageClass stays a first-class values knob
# (`storage.nats.storageClassName`, §16.2) and never the cluster default; an
# upstream NATS subchart cannot template its PVC StorageClass from a parent
# value, which would break that guarantee. No operator is vendored, so the chart
# renders and lints offline.
annotations:
  ksquad.io/issue: "ISI-2149"
  ksquad.io/event-bus: "ISI-2253"
