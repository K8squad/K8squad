# Seeded Role preset: Boss (AD-3, FR-6.1, ISI-3676).
#
# Boss plans, decomposes and delegates. It carries planning+board default
# skills. The Role CRD has NO model field (F-CRD-1) — the preset default
# model (Opus-5) lives console-side in console/lib/presets.ts and is set on
# Agent.spec.model by the template-materialize flow (POST /api/compose/squad).
#
# defaultSkills are UNIONED onto Agent.spec.skillRefs at materialize/run time
# (ADR-044 step 1; api/v1alpha1/role_types.go), never replaced.
#
# Namespace is intentionally unset: apply this manifest into the squad/team
# namespace where the Agents live — ObjectRefs are namespace-local.
---
apiVersion: ksquad.io/v1alpha1
kind: Role
metadata:
  name: role-boss
  labels:
    ksquad.io/role-preset: boss
spec:
  promptRef:
    name: role-boss-prompt
  defaultSkills:
    - name: planning
    - name: board
  runtimeClassHint: gvisor
