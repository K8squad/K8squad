{{- if .Values.controlPlane.enabled }}
{{- if not (or .Values.controlPlane.database.existingSecret .Values.controlPlane.database.dsn) }}
{{- fail "controlPlane.enabled=true requires a Postgres DSN: set controlPlane.database.existingSecret (preferred) or controlPlane.database.dsn (dev only)." }}
{{- end }}
{{- if and .Values.controlPlane.database.dsn (not .Values.controlPlane.database.existingSecret) }}
# Dev-only inline DSN. Production should set controlPlane.database.existingSecret
# and manage the credential outside the chart (never commit a real DSN to values).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8squad.fullname" . }}-database
  namespace: {{ include "k8squad.namespace" . }}
  labels:
    {{- include "k8squad.labels" . | nindent 4 }}
  {{- if .Values.controlPlane.migrations.enabled }}
  annotations:
    # ISI-7109: when the migration hook Job is on, this chart-owned dev Secret must exist BEFORE the
    # pre-install hook (weight -5) runs, or the Job cannot read DATABASE_URL on a fresh install. Lead
    # the sequence at weight -10 and keep it after the hook (before-hook-creation only, NOT
    # hook-succeeded) so the running pods can still mount it. Production supplies the DSN via a
    # pre-existing existingSecret and never reaches this branch. Note: a hook resource is not adopted
    # into the release, so `helm uninstall` leaves this dev Secret behind — a tolerable dev-only wart.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
type: Opaque
stringData:
  dsn: {{ .Values.controlPlane.database.dsn | quote }}
{{- end }}
{{- end }}
