---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: roles.ksquad.io
spec:
  group: ksquad.io
  names:
    categories:
    - ksquad
    kind: Role
    listKind: RoleList
    plural: roles
    shortNames:
    - role
    singular: role
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Role is the Schema for the roles API — a reusable behavior profile
          (arch §5.1). It is namespaced by default.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RoleSpec defines the desired state of Role (arch §5.1, story 1.2 AC4).

              A Role is a reusable behavior profile. It is data-only and validated, not
              reconciled (arch §5.1 table: "data only; validated").
            properties:
              defaultSkills:
                description: |-
                  DefaultSkills are granted to every agent assuming this role. They are
                  UNIONED with the Agent's own skillRefs, not replaced by them: the
                  effective skill set is Agent.spec.skillRefs ∪ Role.spec.defaultSkills,
                  deduped by ref (ADR-044 step 1).
                items:
                  description: ObjectRef is a light cross-CRD reference to another
                    ksquad.io object.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referenced object. Empty means the referring object's
                        own namespace.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              promptRef:
                description: PromptRef references the prompt / behavior definition
                  for this role.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object. Empty means the referring object's
                      own namespace.
                    type: string
                required:
                - name
                type: object
              runtimeClassHint:
                description: |-
                  RuntimeClassHint suggests the sandbox isolation posture for Runs using
                  this role (arch §9.1: gVisor is the default RuntimeClass, Kata is the
                  high-assurance opt-in, runc only for explicitly-trusted dev). A hint,
                  not a sandboxPolicy — Run.spec.sandboxPolicy is the selection input.
                enum:
                - gvisor
                - kata
                - runc
                type: string
            required:
            - promptRef
            type: object
        type: object
    served: true
    storage: true
