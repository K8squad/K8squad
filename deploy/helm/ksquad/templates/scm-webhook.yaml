{{- /* ksquad-scm-webhook Deployment (ISI-2913, Story 11.1).
       HMAC-verified SCM webhook ingress. Verifies the per-Project HMAC signature
       BEFORE parsing the payload, then patches scm-sync-trigger on the Project CR.
       The operator's level-triggered reconciler does the actual mirror work.
       A bad/absent signature returns 401 with no parse, no write (AC, D8/NFR-SEC8). */ -}}
{{- if .Values.scmWebhook.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ksquad.scm-webhook.fullname" . }}
  labels:
    {{- include "ksquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: scm-webhook
spec:
  replicas: {{ .Values.scmWebhook.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scm-webhook
  template:
    metadata:
      labels:
        {{- include "ksquad.labels" . | nindent 8 }}
        app.kubernetes.io/component: scm-webhook
    spec:
      serviceAccountName: {{ include "ksquad.operator.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scm-webhook
          image: "{{ .Values.scmWebhook.image.repository }}:{{ .Values.scmWebhook.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.scmWebhook.image.pullPolicy }}
          args:
            - --http-port=8080
            - --namespace={{ .Release.Namespace }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.scmWebhook.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ksquad.scm-webhook.fullname" . }}
  labels:
    {{- include "ksquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: scm-webhook
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: scm-webhook
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
{{- end }}
