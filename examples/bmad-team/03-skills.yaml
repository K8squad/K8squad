# The four default Skills granted to this squad (arch §5.3.6). A Skill is the
# CRD-authorized capability envelope: it is registered here by the operator/
# admin and never self-widened by the fetched body (trust boundary D8).
#
# Wiring: Skills attach to Roles via Role.spec.defaultSkills[] (see 05-roles.yaml)
# — every role gets `bmad`; coder/devops/code-reviewer get `github`;
# observability gets `dynatrace`; graphical-designer gets `graphical`.
#
# `bmad` is inline (self-contained, no fetch). The tool skills are git-sourced
# and PINNED to a commit SHA so a force-push cannot silently alter behavior
# mid-Run (§5.3.6). RepoRefs/SHAs below are illustrative placeholders — repoint
# them at your own skill repo before use.
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: bmad
  namespace: bmad-squad
spec:
  source:
    type: inline
    inline: |
      # BMAD Method

      The Breakthrough Method of Agile AI-Driven Development (BMAD) structures
      squad work into phases with explicit handoffs:

      1. Analysis   — Brainstormer explores the problem space; domain research.
      2. Product    — Product Manager writes the PRD from validated needs.
      3. Solutioning— Architect turns the PRD into architecture decisions.
      4. Stories    — requirements decompose into epics and stories.
      5. Delivery   — Coder implements; Code Reviewer and Test Architect gate.
      6. Operate    — DevOps and Observability Engineer ship and watch it run.

      Principles: user journeys drive technical decisions; prefer boring,
      proven technology; every decision ties to business value; verify before
      claiming done; hand work off with enough context to start without asking.
  permissions:
    - workflow:bmad
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: github
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/squad-skills
      # Pin to an immutable commit SHA (never a floating branch), §5.3.6.
      ref: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b"
      path: skills/github
  mcpToolRefs:
    - name: github-mcp
  permissions:
    - scm:read
    - scm:write
    - pr:write
    - issue:write
  requires:
    toolchains:
      - gh@2.62
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: dynatrace
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/squad-skills
      ref: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b"
      path: skills/dynatrace
  mcpToolRefs:
    - name: dynatrace-mcp
  permissions:
    - observability:read
    - telemetry:query
  requires:
    toolchains:
      - dtctl@1.0
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: graphical
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/squad-skills
      ref: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b"
      path: skills/graphical
  permissions:
    - render:svg
    - asset:write
  requires:
    toolchains:
      - node@22
---
# ── Dev / debug Skills (ISI-3273, recommended on ISI-3271) ────────────────────
# Ten local-coding + on-cluster-debugging Skills that fill the gap the four
# defaults leave open. Guardrails (ISI-3271 §Guardrails):
#   • every `source: git` ref is pinned to an immutable commit SHA (§5.3.6) —
#     the placeholder below is shared with the default skills; repoint it at your
#     own skill repo + real SHA before use.
#   • toolchains are standardized on the repo's real versions — go@1.25 and
#     kubectl@1.31 — because version conflicts across a Run's skills fail closed
#     at pod assembly (§5.3.4).
#   • `dockerd` sidecars only resolve where AgentRuntime.capabilities grants the
#     capability (§5.3.3); permissions[] are least-privilege and read-first — the
#     git-fetched body can never widen this envelope (trust boundary D8).
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: code-search
  namespace: bmad-squad
spec:
  # git-sourced: carries a SKILL.md of ripgrep + ast-grep query recipes.
  source:
    type: git
    git:
      repoRef: github.com/K8squad/squad-skills
      ref: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b"
      path: skills/code-search
  permissions:
    - fs:read
  requires:
    toolchains:
      - ripgrep@14
      - ast-grep@0.38
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: kubectl-debug
  namespace: bmad-squad
spec:
  # Read-only cluster introspection + ephemeral debug. No apply/delete verbs.
  source:
    type: inline
    inline: |
      # kubectl (read-only + ephemeral debug)

      Read-only cluster introspection for real-cluster debugging:
        kubectl get / describe / logs / events / top
        kubectl debug   — attach an ephemeral container to a running pod

      Never apply, edit, patch, scale, or delete. Stay in the namespace you were
      granted. Use this to see what a failing Run/pod is actually doing before
      forming a hypothesis.
  permissions:
    - k8s:get
    - k8s:list
    - k8s:watch
    - k8s:logs
    - k8s:debug:ephemeral
  requires:
    toolchains:
      - kubectl@1.31
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: go-build-test
  namespace: bmad-squad
spec:
  # build / vet / test (-run, -race). dockerd sidecar for testcontainers/CNPG.
  source:
    type: inline
    inline: |
      # Go build & test

      go build ./... / go vet ./... / go test (focused with -run, and -race for
      concurrency bugs). Use the dockerd sidecar for the repo's testcontainers /
      CNPG integration suites. Keep the diff green before handing off.
  permissions:
    - fs:read
    - fs:write:workspace
    - exec:go
  requires:
    toolchains:
      - go@1.25
    sidecars:
      - dockerd
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: git-workflow
  namespace: bmad-squad
spec:
  # Local git (complements the remote `github` MCP default). bisect = the
  # highest-leverage regression-hunting primitive.
  source:
    type: inline
    inline: |
      # Local git workflow

      Local history + debugging tooling that the remote `github` skill does not
      cover: git bisect (regression hunting), blame, log -S / -G (pickaxe),
      worktree, and ordinary branch/commit. Reach for bisect the moment "it used
      to work" — it finds the offending commit in log2(n) steps.
  permissions:
    - fs:read
    - fs:write:workspace
    - exec:git
  requires:
    toolchains:
      - git@2.47
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: golangci-lint
  namespace: bmad-squad
spec:
  # Runs the repo's lint gate locally (CI uses golangci-lint-action v7 → v2.x).
  source:
    type: inline
    inline: |
      # golangci-lint

      Run the repo's static-analysis gate locally so Coder/Reviewer catch what
      CI's golangci-lint-action would reject. Use the repo's .golangci.yml; do
      not weaken it. Fix findings at the root, not per-caller.
  permissions:
    - fs:read
    - exec:golangci-lint
  requires:
    toolchains:
      - go@1.25
      - golangci-lint@2.1
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: otel-observability-query
  namespace: bmad-squad
spec:
  # Read-only trace/log/span query via MCP (Dynatrace DQL). Complements the
  # `dynatrace` (dtctl control) default with a query surface. Read-only.
  source:
    type: git
    git:
      repoRef: github.com/K8squad/squad-skills
      ref: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b"
      path: skills/otel-query
  mcpToolRefs:
    - name: dynatrace-dql
  permissions:
    - dt:query:logs
    - dt:query:spans
    - dt:query:metrics
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: container-build
  namespace: bmad-squad
spec:
  # docker/buildkit build/run/inspect. dockerd sidecar; egress gated to registry.
  source:
    type: inline
    inline: |
      # Container build

      docker / buildkit build, run, and inspect — reproduce a build failure or
      run an image locally. Uses the dockerd sidecar; egress is gated to the
      registry only. Do not push unless explicitly asked.
  permissions:
    - exec:docker
    - net:egress:registry
  requires:
    toolchains:
      - docker-cli@27
    sidecars:
      - dockerd
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: delve-pprof
  namespace: bmad-squad
spec:
  # Live-process debug (dlv) + profiling (go tool pprof) against a pod via
  # port-forward. For the hard "only fails in the cluster" bugs.
  source:
    type: inline
    inline: |
      # Delve + pprof

      Live-process debugging with dlv and CPU/heap/goroutine profiling with
      `go tool pprof`, against a running pod reached via kubectl port-forward.
      Reach for this on the bugs that only reproduce in the cluster.
  permissions:
    - fs:read
    - exec:dlv
    - exec:go-tool-pprof
    - k8s:port-forward
  requires:
    toolchains:
      - go@1.25
      - delve@1.24
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: psql-inspect
  namespace: bmad-squad
spec:
  # Read-only psql into the coordination / run-source Postgres. SELECT-only role.
  source:
    type: inline
    inline: |
      # psql (read-only)

      Read-only psql into the coordination / run-source Postgres to inspect
      migrations, Run state, and coord tables (the repo is Postgres-heavy:
      internal/runsource/postgres.go, db/migrations/*). SELECT only — the DB
      role carries no write grant; egress is gated to Postgres.
  permissions:
    - db:read
    - net:egress:postgres
  requires:
    toolchains:
      - postgres-client@16
---
apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: http-grpc-probe
  namespace: bmad-squad
spec:
  # curl / grpcurl to probe live services/endpoints during debugging.
  source:
    type: inline
    inline: |
      # HTTP / gRPC probe

      curl / grpcurl to probe live service endpoints while debugging
      service-to-service issues. Egress is gated to the cluster. Read-first:
      prefer GET / reflection before any mutating call.
  permissions:
    - exec:curl
    - exec:grpcurl
    - net:egress:cluster
  requires:
    toolchains:
      - curl@8
      - grpcurl@1.9
