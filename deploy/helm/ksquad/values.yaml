# ═════════════════════════════════════════════════════════════════════════════
# Event relay — apiserver outbox → NATS (Epic 12.1 / §17.4 / ADR-023)
#   The apiserver's relay worker tails the transactional Postgres outbox and
#   publishes each event to a JetStream subject
#   `ksquad.{entity}.{project}.{squad}.{event_type}`, stamping `published_at` and
#   republishing unflushed rows (at-least-once). DECOUPLED from the write path by
#   construction: the relay runs OUTSIDE the reconcile/coordination transaction,
#   is best-effort, and is NEVER wired into an apiserver liveness/readiness probe.
#   NATS-down (or nats.enabled=false) delays fan-out only — it NEVER blocks a
#   Run/claim/memory write. The chart hands the apiserver this config.
# ═════════════════════════════════════════════════════════════════════════════
events:
  relay:
    enabled: true
    # Subject taxonomy prefix ksquad.{entity}.{project}.{squad}.{event_type}.
    subjectPrefix: ksquad
    # NATS client URL. Empty → derived from the release-local bus (nats.enabled).
    natsUrl: ""
